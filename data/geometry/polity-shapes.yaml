# How each polity polygon is made (docs/geometry-audit.md section 5). tools/build_geometry.py reads this file
# and writes data/geometry/polities/<place-id>.geojson, one feature per entry, clipped to the module's land.
#
# Every entry has: year_from, year_to (the shape applies while year_from <= year < year_to; null = open-ended),
# method, basis.
#   method A: an aourednik/historical-basemaps polygon (GPL-3.0) as is, relabelled and clipped.
#             from: {year, name}   which clipped aourednik file (data/geometry/<module>/aourednik_<year>.geojson)
#   method E: start from an aourednik polygon and edit it (at least one of these):
#             keep: one ring; only the part of the shape inside it is kept
#             remove: list of rings [[lon, lat], ...] cut out of the shape
#             add: list of rings joined to the shape (an extension the research asks for)
#   method H: hand-drawn soft extent from the place's geometry_note, not traced from aourednik.
#             outline: one ring [[lon, lat], ...], kept coarse on purpose (a zone, not a border)
#             or point: [lon, lat] with buffer_km: a town with a small coastal buffer (Swahili polities)
#   zone: nomadic (optional): drawn as a hatched sphere, not a state (Tuareg)
#   smooth (degrees, optional): rounds inside and outside corners so the shape reads as a zone.
# Hand-drawn shapes (H) and the Mali trims are DRAFTS for Wil's review: see docs/geometry-review.md.
# review: draft | approved   (Wil flips this to approved; the app does not read it)

module: africa
polities:
  pl-mali:
    - year_from: 1235
      year_to: 1300
      method: H
      review: draft
      smooth: 0.3
      basis: >-
        Upper-Niger core for c.1250, drawn from the pl-mali geometry_note (upper Niger and Sankarani between
        Kangaba and Siguiri, with the Bure goldfield; Bambuk to the west) and geometry-audit section 5
        ("hand-shrink to the upper-Niger core for c.1250"). Not traced from aourednik or Cliopatria.
      outline: [[-11.0, 12.0], [-10.8, 13.3], [-9.6, 13.7], [-8.0, 13.3], [-6.9, 12.6], [-7.2, 11.4], [-8.0, 10.6],
                [-9.2, 10.5], [-10.4, 11.0]]
    - year_from: 1300
      year_to: 1360
      method: A
      review: draft
      smooth: 0.3
      basis: >-
        Cliopatria 'Mali Empire' 1241 to 1414 (Seshat, CC BY 4.0) as the c.1330 to 1350 snapshot. It agrees with
        the pl-mali geometry_note and the audit's trims without edits: Timbuktu, Gao, Walata, Djenne and Niani are
        inside, the Senegal valley is inside, and the Mossi country and Tadmekka are outside. Replaces the trimmed
        aourednik 1279 shape (docs/geometry-review.md, part 3).
      from: {source: cliopatria, year: 1340, name: Mali Empire}
    - year_from: 1360
      year_to: 1433
      method: E
      review: draft
      smooth: 0.4
      basis: >-
        The Cliopatria c.1330 to 1350 shape contracted for c.1400 without Jolof and Gao (geometry-audit section 5):
        cut west of 14W and north of 13.9N (Jolof and its Wolof provinces, from about 1350 to 1360 per pl-jolof) and
        east of 1W (Gao, lost to the Sunni dynasty per pl-mali geometry_note). Cliopatria itself keeps Mali whole
        until 1463, which the research does not support. Timbuktu and Walata stay until 1433.
      from: {source: cliopatria, year: 1340, name: Mali Empire}
      remove:
        - [[-1.0, 0.0], [20.0, 0.0], [20.0, 30.0], [-1.0, 30.0], [-1.0, 0.0]]
        - [[-30.0, 13.9], [-14.0, 13.9], [-14.0, 30.0], [-30.0, 30.0], [-30.0, 13.9]]
    - year_from: 1433
      year_to: 1600
      method: E
      review: draft
      smooth: 0.4
      basis: >-
        The c.1400 shape with the north cut at 15.8N after the Tuareg took Timbuktu and Walata about 1433
        (pl-mali geometry_note; ev-tuareg-take-timbuktu). Not named in geometry-audit section 5; added so the map
        agrees with the 1433 keyframe. The 15th-century shift west toward the Gambia is not drawn.
      from: {source: cliopatria, year: 1340, name: Mali Empire}
      remove:
        - [[-1.0, 0.0], [20.0, 0.0], [20.0, 30.0], [-1.0, 30.0], [-1.0, 0.0]]
        - [[-30.0, 13.9], [-14.0, 13.9], [-14.0, 30.0], [-30.0, 30.0], [-30.0, 13.9]]
        - [[-30.0, 15.8], [20.0, 15.8], [20.0, 30.0], [-30.0, 30.0], [-30.0, 15.8]]

  pl-ghana-wagadu:
    - year_from: 1200
      year_to: 1240
      method: A
      review: draft
      basis: >-
        aourednik 'Ghana' 1200 as is, relabelled and clipped (geometry-audit section 5 says E, but it asks for no
        edit, which the audit's own definitions call A). The audit uses it for the pre-1203 frame and
        says to fade it after Sosso; it runs to 1240 here to match the place span and its religion profiles
        (Sosso then Mali overlordship, per pl-ghana-wagadu geometry_note).
      from: {year: 1200, name: Ghana}

  pl-sosso:
    - year_from: 1180
      year_to: 1235
      method: H
      review: draft
      smooth: 0.3
      basis: >-
        Drawn from the pl-sosso geometry_note: core in the Koulikoro hills north of the Niger, reaching into
        Kaniaga (geometry-audit section 5: "Sosso in Kaniaga"). The capital's site is not established.
      outline: [[-7.3, 12.7], [-7.0, 13.6], [-7.8, 14.7], [-9.1, 15.3], [-10.2, 15.0], [-10.0, 13.9], [-8.6, 12.9]]

  pl-takrur:
    - year_from: 1000
      year_to: 1500
      method: A
      review: draft
      smooth: 0.2
      basis: >-
        Cliopatria 'Takrur' 1139 to 1235 (Seshat, CC BY 4.0), used for the whole place span: the middle Senegal
        valley with both banks (Podor inside) and the Jolof interior outside, as the pl-takrur geometry_note and
        geometry-audit section 5 ask. Cliopatria absorbs Takrur into Mali after 1235; the research keeps the place
        under Mali's and then Jolof's overlordship, so the shape stays and the overlords draw over it.
      from: {source: cliopatria, year: 1200, name: Takrur}

  pl-jolof:
    - year_from: 1350
      year_to: 1549
      method: H
      review: draft
      smooth: 0.25
      basis: >-
        Drawn from the pl-jolof geometry_note: the inland Wolof kingdom around Linguere (geometry-audit section 5:
        Jolof in the Ferlo/Linguere interior, from c.1350). Only the Jolof core; its overlordship of Waalo,
        Kajoor, Bawol, Siin and Saalum is not drawn.
      outline: [[-16.0, 15.5], [-15.4, 15.95], [-14.6, 15.75], [-14.3, 15.0], [-14.9, 14.6], [-15.8, 14.8]]

  pl-songhay-gao:
    - year_from: 1000
      year_to: 1464
      method: H
      review: draft
      smooth: 0.25
      basis: >-
        Drawn from the pl-songhay-gao geometry_note: the middle Niger around Gao and Kukiya. A small Gao-centred
        zone (geometry-audit section 5); the later Songhay empire (Sunni Ali, 1464) is outside the window.
      outline: [[-0.8, 16.6], [-0.2, 17.0], [0.6, 16.6], [1.4, 15.3], [1.2, 14.6], [0.4, 14.8], [-0.3, 15.7]]

  pl-mossi:
    - year_from: 1250
      year_to: null
      method: H
      review: draft
      smooth: 0.3
      basis: >-
        Drawn from the pl-mossi geometry_note: a soft area south of the Niger bend, drawn as a people, not a
        polity (geometry-audit section 5: small soft zone, low confidence). The Volta Mossi kingdoms are later.
      outline: [[-3.2, 12.0], [-2.8, 13.8], [-1.6, 14.3], [-0.2, 14.0], [0.6, 12.8], [0.0, 11.6], [-1.6, 11.2]]

  pl-bono:
    - year_from: 1300
      year_to: 1723
      method: H
      review: draft
      smooth: 0.2
      basis: >-
        Drawn from the pl-bono geometry_note: the early Akan kingdom north of the forest around Bono Manso near
        Techiman (geometry-audit section 5: small soft zone, low confidence). Location approximate.
      outline: [[-2.5, 7.3], [-2.6, 8.0], [-1.9, 8.4], [-1.2, 8.0], [-1.3, 7.3], [-1.9, 7.0]]

  # ---- Phase 2: central Sahel and forest (csahel) ----
  pl-kanem:
    - year_from: 1075
      year_to: 1210
      method: A
      review: draft
      basis: >-
        aourednik 'Kanem' 1200 as is: the plains north-east of Lake Chad with Njimi inside (geometry-audit
        section 5, pl-kanem geometry_note).
      from: {year: 1200, name: Kanem}
    - year_from: 1210
      year_to: 1387
      method: E
      review: draft
      smooth: 0.4
      basis: >-
        aourednik 'Kanem' 1200 extended north toward the Kawar oases and the Fezzan for the c.1250 maximum under
        Dunama Dibbalemi (geometry-audit section 5; pl-kanem geometry_note: Kanem claimed authority over Kawar and
        the Fezzan, Ibn Sa'id via Lange). The northern arm is a corridor to Kawar (Bilma, 12.9E 19N), not a border.
        Kept to 1387, when the Sayfawa moved west to Bornu.
      from: {year: 1200, name: Kanem}
      add:
        - [[12.4, 15.8], [15.6, 15.8], [14.6, 19.6], [12.0, 19.8], [11.8, 17.6]]

  pl-bornu:
    - year_from: 1380
      year_to: null
      method: E
      review: draft
      smooth: 0.4
      basis: >-
        aourednik 'Kanem-Bornu' 1400 with the detached Bioko part deleted and the northern arm pulled back from 21N
        to about 16.5N (geometry-audit section 5: pull it back unless the research supports Kawar; the pl-bornu
        geometry_note places Bornu west and south-west of Lake Chad). Starts c.1380.
      from: {year: 1400, name: Kanem-Bornu}
      remove:
        - [[7.0, 2.0], [10.0, 2.0], [10.0, 5.0], [7.0, 5.0]]
        - [[6.0, 16.5], [20.0, 16.5], [20.0, 25.0], [6.0, 25.0]]

  pl-bulala:
    - year_from: 1380
      year_to: 1630
      method: H
      review: draft
      smooth: 0.3
      basis: >-
        Drawn from the pl-bulala geometry_note: Kanem (the plains north-east of Lake Chad) from c.1387 plus the
        Bulala homeland around Lake Fitri (17.5E 12.8N). The Lake Chad shore on the west is the historic lake.
      outline: [[15.0, 12.2], [18.4, 11.9], [19.2, 13.4], [18.6, 15.5], [16.8, 16.2], [15.2, 15.6], [14.9, 14.2]]

  pl-kano:
    - year_from: 999
      year_to: null
      method: H
      review: draft
      smooth: 0.15
      basis: >-
        Drawn from the pl-kano geometry_note: the walled city around Dala and Goron Dutse hills with surrounding
        farmland and subordinate towns, "a city-state point with a small surrounding area". About 60 km across.
      outline: [[8.1, 11.7], [8.0, 12.1], [8.3, 12.4], [8.8, 12.4], [9.0, 12.0], [8.8, 11.6], [8.4, 11.5]]

  pl-katsina:
    - year_from: 1300
      year_to: null
      method: H
      review: draft
      smooth: 0.15
      basis: >-
        Drawn from the pl-katsina geometry_note: a city-state in northern Hausaland, with Durbi ta Kusheyi (the
        early seat, about 30 km south-east) inside the zone. About 60 km across.
      outline: [[7.2, 12.8], [7.3, 13.25], [7.7, 13.35], [8.0, 13.1], [8.05, 12.7], [7.7, 12.55], [7.35, 12.6]]

  pl-hausa-states:
    - year_from: 1000
      year_to: 1440
      method: H
      review: draft
      smooth: 0.4
      basis: >-
        Drawn from the pl-hausa-states geometry_note: the soft area between the Niger (west) and the Bornu
        borderlands (east), the Air foothills (north) and the Zazzau frontier (south), holding Daura, Kano, Katsina,
        Gobir, Rano, Zazzau and Biram. A people, not a state, before c.1450 (geometry-audit section 5).
      outline: [[4.8, 12.6], [5.6, 13.6], [7.4, 13.9], [9.6, 13.7], [10.4, 12.6], [9.9, 11.0], [8.0, 10.3],
                [6.2, 10.6], [5.0, 11.4]]
    - year_from: 1440
      year_to: null
      method: A
      review: draft
      basis: >-
        aourednik 'Hausa States' 1492 as a soft c.1450 envelope (geometry-audit section 5), relabelled and clipped.
      from: {year: 1492, name: Hausa States}

  pl-ife:
    - year_from: 1000
      year_to: null
      method: H
      review: draft
      smooth: 0.15
      basis: >-
        Drawn from the pl-ife geometry_note: the city and kingdom in the Yoruba forest, urban core with the Igbo
        Olokun site on its northern edge. Its wider ritual and genealogical influence is not drawn as territory.
        About 60 km across (geometry-audit section 5: small soft zone, low confidence).
      outline: [[4.2, 7.3], [4.2, 7.7], [4.5, 7.85], [4.85, 7.75], [4.95, 7.4], [4.7, 7.15], [4.35, 7.15]]

  pl-benin:
    - year_from: 1000
      year_to: 1440
      method: E
      review: draft
      smooth: 0.3
      basis: >-
        aourednik 'Benin' 1279 shrunk to the Edo core between 5.3E and 6.5E before c.1440 (geometry-audit
        section 5; pl-benin geometry_note: expansion beyond the Edo heartland begins with Ewuare, c.1440).
      from: {year: 1279, name: Benin}
      keep: [[5.3, 4.0], [6.5, 4.0], [6.5, 9.0], [5.3, 9.0]]
    - year_from: 1440
      year_to: null
      method: E
      review: draft
      smooth: 0.3
      basis: >-
        aourednik 'Benin' 1279 as the post-Ewuare extent, with the west cut at 4.9E so Ile-Ife is outside
        (geometry-audit section 5: "Remove Ife").
      from: {year: 1279, name: Benin}
      remove:
        - [[0.0, 0.0], [4.9, 0.0], [4.9, 12.0], [0.0, 12.0]]

  pl-agadez:
    - year_from: 1405
      year_to: null
      method: H
      review: draft
      smooth: 0.3
      basis: >-
        Drawn from the pl-agadez geometry_note: the sultanate of the Air massif seated at Agadez, with the earlier
        seats in the Air (Tadaliza, Tin Chaman) inside the zone (geometry-audit section 5: small soft zone, low
        confidence). Founding date debated (1405 to 1449).
      outline: [[7.2, 16.4], [7.0, 17.6], [7.8, 19.0], [9.2, 19.4], [10.0, 18.2], [9.4, 16.8], [8.4, 16.2]]

  pl-tuareg:
    - year_from: 1000
      year_to: null
      method: H
      review: draft
      smooth: 0.5
      zone: nomadic
      basis: >-
        Drawn from the pl-tuareg geometry_note: a soft sphere for Tamasheq-speaking pastoral confederations over
        the Air massif, the Adrar des Ifoghas, the Niger bend north of Timbuktu and the Hoggar (geometry-audit
        section 5: a nomadic sphere, styled unlike a state). Not a territory; Timbuktu itself belongs to wsahel.
      outline: [[-4.5, 17.0], [-3.5, 20.0], [0.0, 23.5], [4.0, 25.0], [8.0, 24.0], [10.5, 21.0], [10.0, 17.5],
                [7.5, 16.0], [3.0, 16.5], [0.0, 17.5], [-2.0, 17.2]]

  pl-sao:
    - year_from: 1000
      year_to: 1600
      method: H
      review: draft
      smooth: 0.3
      basis: >-
        Drawn from the pl-sao geometry_note: walled towns and settlements south and west of Lake Chad on the
        Logone-Chari plains (modern Cameroon, Chad and Nigeria). Drawn as a people.
      outline: [[13.2, 11.2], [13.0, 12.6], [14.0, 13.3], [15.4, 13.0], [16.0, 11.8], [15.2, 10.6], [14.0, 10.5]]

  # ---- Phase 2: North Africa and Egypt (north) ----
  pl-almohads:
    - year_from: 1121
      year_to: 1236
      method: E
      review: draft
      smooth: 0.4
      basis: >-
        Cliopatria 'Almohad Caliphate' 1202 to 1235 (Seshat, CC BY 4.0), which already runs from the Atlantic to
        Tripolitania as the pl-almohads geometry_note says; al-Andalus is cut away (north of 36N) as part of the
        external margin (geometry-audit section 5). Replaces the aourednik 1200 shape plus a hand-added Ifriqiya.
      from: {source: cliopatria, year: 1220, name: Almohad Caliphate}
      remove:
        - [[-12.0, 36.0], [6.0, 36.0], [6.0, 45.0], [-12.0, 45.0]]
    - year_from: 1236
      year_to: 1250
      method: E
      review: draft
      smooth: 0.4
      basis: >-
        Cliopatria 'Almohad Caliphate' 1241 to 1249: the caliphate after the Hafsids (1229) and Zayyanids (1235)
        broke away and the Marinids took the north, al-Andalus cut away. Cliopatria's later Almohad rows (1250 to
        1343) are not used: the caliphate ended in 1269.
      from: {source: cliopatria, year: 1245, name: Almohad Caliphate}
      remove:
        - [[-12.0, 36.0], [6.0, 36.0], [6.0, 45.0], [-12.0, 45.0]]
    - year_from: 1250
      year_to: 1269
      method: H
      review: draft
      smooth: 0.3
      basis: >-
        Drawn from the pl-almohads geometry_note: by the 1240s to 1260s the caliphate was reduced to the Marrakesh
        region (the Marinids took Fez in 1248). The High Atlas core of the movement (Tinmal) is inside.
      outline: [[-10.0, 30.5], [-10.2, 32.3], [-8.6, 33.2], [-6.6, 32.6], [-6.4, 31.2], [-7.8, 30.3]]

  pl-marinids:
    - year_from: 1244
      year_to: 1344
      method: A
      review: draft
      basis: >-
        Cliopatria 'Marinid Sultanate' (Seshat, CC BY 4.0), its 1363 to 1414 shape used from 1244: Morocco north of
        the High Atlas with Fez, Marrakesh and Sijilmasa inside and Tlemcen outside, as the pl-marinids
        geometry_note says. Cliopatria has no Marinid row for 1260 to 1343; its 1250 and 1363 shapes are the same.
      from: {source: cliopatria, year: 1400, name: Marinid Sultanate}
    - year_from: 1344
      year_to: 1352
      method: A
      review: draft
      basis: >-
        Cliopatria 'Marinid Sultanate' 1344 to 1351: Abu al-Hasan's hold on Tlemcen (pl-marinids geometry_note:
        Tlemcen 1337 and 1352, Tunis 1347 and 1357). Only Cliopatria draws these brief maxima.
      from: {source: cliopatria, year: 1347, name: Marinid Sultanate}
    - year_from: 1352
      year_to: 1363
      method: A
      review: draft
      basis: >-
        Cliopatria 'Marinid Sultanate' 1352 to 1362: Abu Inan's reach to Tunis (pl-marinids geometry_note).
      from: {source: cliopatria, year: 1357, name: Marinid Sultanate}
    - year_from: 1363
      year_to: 1465
      method: A
      review: draft
      basis: >-
        Cliopatria 'Marinid Sultanate' 1363 to 1414 and 1415 to 1462 (the same shape): Morocco again, to the last
        Marinid sultan in 1465.
      from: {source: cliopatria, year: 1400, name: Marinid Sultanate}

  pl-zayyanids:
    - year_from: 1235
      year_to: 1344
      method: A
      review: draft
      basis: >-
        Cliopatria 'Zayyanid dynasty' 1285 to 1343 (Seshat, CC BY 4.0): Tlemcen-centred, about 2W to 5E, Fez and
        Tunis outside, as the pl-zayyanids geometry_note and geometry-audit section 5 ask. Replaces a hand-drawn
        zone. Cliopatria has no Zayyanid row for 1344 to 1362, the years the Marinids held Tlemcen; the Marinid
        shapes cover it then.
      from: {source: cliopatria, year: 1300, name: Zayyanid dynasty}
    - year_from: 1363
      year_to: 1556
      method: A
      review: draft
      basis: >-
        Cliopatria 'Zayyanid dynasty' 1363 to 1506, the same shape, after the Marinid occupations.
      from: {source: cliopatria, year: 1400, name: Zayyanid dynasty}

  pl-hafsids:
    - year_from: 1229
      year_to: 1574
      method: E
      review: draft
      smooth: 0.4
      basis: >-
        aourednik 'Hafsid Caliphate' 1300 with the west cut at 1.5E to exclude Tlemcen (geometry-audit section 5:
        cut at about 1 to 2E). Tunis and Kairouan are inside; Tripolitania to 18E as drawn by aourednik.
      from: {year: 1300, name: Hafsid Caliphate}
      remove:
        - [[-5.0, 25.0], [1.5, 25.0], [1.5, 40.0], [-5.0, 40.0]]

  pl-ayyubids:
    - year_from: 1171
      year_to: 1250
      method: E
      review: draft
      smooth: 0.3
      basis: >-
        The Egypt portion of aourednik 'Mamluke Sultanate' 1279, relabelled and dated 1171 to 1250 (geometry-audit
        section 5): the Levant north of 31.2N east of 33.5E and the Hijaz coast east of 35E are cut away, as the
        pl-ayyubids geometry_note asks (draw Egypt only for this module).
      from: {year: 1279, name: Mamluke Sultanate}
      remove:
        - [[33.5, 31.2], [50.0, 31.2], [50.0, 40.0], [33.5, 40.0]]
        - [[35.0, 10.0], [50.0, 10.0], [50.0, 29.6], [35.0, 29.6]]
        - [[34.62, 10.0], [50.0, 10.0], [50.0, 29.2], [34.62, 29.2]]

  pl-mamluks:
    - year_from: 1250
      year_to: 1517
      method: E
      review: draft
      smooth: 0.3
      basis: >-
        aourednik 'Mamluke Sultanate' 1279 (geometry-audit section 5 says A), cut to Egypt and Cyrenaica for this
        module as the pl-mamluks geometry_note asks: the Levant (north of 31.2N east of 33.5E), the Hijaz coast
        (east of 35E) and Nubia south of 23.7N (Aswan) are removed. Syria-Palestine from 1260 and northern Nubia
        from 1275 are not drawn.
      from: {year: 1279, name: Mamluke Sultanate}
      remove:
        - [[33.5, 31.2], [50.0, 31.2], [50.0, 40.0], [33.5, 40.0]]
        - [[35.0, 10.0], [50.0, 10.0], [50.0, 29.6], [35.0, 29.6]]
        - [[34.62, 10.0], [50.0, 10.0], [50.0, 29.2], [34.62, 29.2]]
        - [[15.0, 10.0], [50.0, 10.0], [50.0, 23.7], [15.0, 23.7]]

  pl-atlas-amazigh:
    - year_from: 1200
      year_to: 1450
      method: H
      review: draft
      smooth: 0.3
      basis: >-
        Drawn from the pl-atlas-amazigh geometry_note: a soft overlay for Tamazight-speaking highland and
        pre-Saharan communities, the High, Middle and Anti-Atlas with the Sous, drawn as one band from the Sous to
        the Middle Atlas. The Rif is not included in this draft (it would need a second ring). Low confidence.
      outline: [[-10.2, 29.4], [-9.2, 31.2], [-7.4, 32.6], [-5.0, 33.9], [-3.6, 33.4], [-4.6, 32.0],
                [-6.6, 30.8], [-8.4, 29.6], [-9.6, 29.0]]

  # ---- Phase 2: Nubia and the Horn (nile-horn) ----
  pl-makuria:
    - year_from: 580
      year_to: 1365
      method: E
      review: draft
