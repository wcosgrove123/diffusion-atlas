  - id: ev-tuareg-timbuktu
    year: 1433
    approx: true
    place: pl-tuareg
    title: Tuareg take Timbuktu from Mali
    keyframe: true
    lenses: [governance, population]
    summary: >
      Tuareg forces take control of Timbuktu as Mali's power on the Niger bend weakens. They hold it until Songhay's
      Sunni Ali takes the city in 1468.
    detail: >
      Izard (GHA IV) dates the takeover 1433-34. The Tarikh al-Sudan names the Tuareg leader Akil
      (citation-only). Coordinate with wsahel, which defines pl-timbuktu.
    evidence: [src-izard-gha4-niger-bend, src-tarikh-al-sudan]
    confidence: medium
    ap_topics: ["1.5", "2.4"]

  - id: ev-eweka-first-oba
    year: 1250
    approx: true
    place: pl-benin
    title: Eweka becomes the first Oba of Benin
    keyframe: true
    lenses: [religion, governance]
    summary: >
      Edo tradition says the son of an Ife prince and an Edo woman becomes the first Oba, crowned with regalia from
      Ife. Benin's kingship now claims Ife's sacred authority.
    detail: >
      Year is a midpoint: Egharevba c.1200; Ryder c.1300. Classroom question: why would a kingdom want its
      kings to come from somewhere else?
    evidence: [src-egharevba-short-history-benin, src-ryder-gha4-volta-cameroon]
    confidence: low
    ap_topics: ["1.5", "1.7"]

  - id: ev-ife-florescence
    year: 1300
    approx: true
    place: pl-ife
    title: Ife's age of heads and glass
    keyframe: true
    lenses: [art-music, technology, religion]
    summary: >
      Between about 1250 and 1400, Ife's artists cast its famous lifelike heads, and its workshops made glass beads
      for kings and shrines. Scholars still debate exactly when the heads were made.
    detail: >
      Blier ties the florescence to Obalufon II c.1250-1350; the British Museum dates its head 14th-early 15th c.
      Babalola et al. (2018) date the Igbo Olokun glass workshop to the 11th-15th c.; their two basal radiocarbon
      dates calibrate to 1295-1404 and 1304-1423.
    evidence: [src-blier-art-and-risk, src-babalola-2018-igbo-olokun]
    confidence: medium
    ap_topics: ["1.5", "2.5"]

  - id: ev-kano-tribute-bornu
    year: 1440
    approx: true
    place: pl-kano
    title: Kano begins paying tribute to Bornu
    keyframe: false
    lenses: [governance, social]
    summary: >
      Under Abdullahi Burja, Kano starts sending tribute to Bornu, opens trade routes east, and sends many captives
      from its southern raids to Bornu.
    detail: >
      Reign 1438-1452 (Chronicle). Adamu: Kano reduced to vassal status. A parallel to Kanem's own
      horse-for-captives economy.
    evidence: [src-adamu-gha4-hausa, src-kano-chronicle]
    confidence: medium
    ap_topics: ["1.5", "2.4"]

sources:
  # ---------------- PRIMARY ----------------
  - id: src-kano-chronicle
    title: Kano Chronicle (Asl al-Kano / "Kano Chronicle")
    author: Anonymous Kano compiler (attributed to Malam Barka, a palace official, per Lovejoy 2018)
    author_from: Kano
    date: c.1880s compilation of earlier records and tradition
    kind: primary
    type: chronicle-local
    voice: insider
    happ:
      historical_situation: >
        Compiled in Arabic in emirate Kano after the Sokoto jihad, drawing on older king lists and oral
        tradition; Palmer obtained a copy at Sabon Gari near Katsina.
      audience: Kano's emirate court and scholarly elite.
      purpose: Record the succession of 48 rulers and their deeds; frame Kano's past as a story of Islam's arrival.
      point_of_view: >
        Muslim court scholarship looking back at non-Muslim and partly Muslim kings; Adamu notes it recasts
        old conflicts as Muslims against non-believers. Last argues for a witty 17th-c. compiler; Hunwick
        reviews the authorship puzzle.
    citation: "H.R. Palmer, trans., \"The Kano Chronicle,\" Journal of the Royal Anthropological Institute 38 (1908): 58-98. Hausa version: R.M. East, Labarun Hausawa da Makwabtansu (1933)."
    url: https://zenodo.org/records/2415833
    access: open-url
    verification: citation-only
    notes: >
      The Zenodo PDF of Palmer 1908 could not be read by the research tools; claims are taken from Adamu
      (UNESCO GHA IV, read) and secondary summaries. Teacher should read the Yaji, Kanajeji, Dauda and
      Abdullahi Burja sections directly.

  - id: src-asl-al-wangariyin
    title: Asl al-Wangariyin (Origin of the Wangara)
    author: Wangara community scholars of Kano
    author_from: Kano
    date: 1650-1651
    kind: primary
    type: chronicle-local
    voice: insider
    happ:
      historical_situation: Written by a Kano Muslim lineage of Mande (Wangara) origin in the mid-17th c.
      audience: The Wangara community and Kano's rulers.
      purpose: Establish the lineage's founding role in Kano Islam and its privileges.
      point_of_view: A clerical lineage's own origin story; places the Wangara mission under Rumfa.
    citation: "Asl al-Wangariyin, ed. and trans. M.A. al-Hajj, \"A seventeenth-century chronicle on the origins and missionary activities of the Wangarawa,\" Kano Studies 1, no. 4 (1968)."
    url: null
    access: library
    verification: needs-library
    notes: Known here through Adamu (GHA IV p.318 n.102), who disputes al-Hajj's dating conclusion.

  - id: src-kanem-diwan
    title: Diwan of the sultans of Kanem-Bornu (girgam)
    author: Court specialists of the Sayfawa dynasty
    author_from: Kanem / Bornu
    date: oral girgam with written Arabic forms; surviving copies 19th c. (Barth collected two)
    kind: primary
    type: chronicle-local
    voice: insider
    happ:
      historical_situation: Royal chronicle maintained by court specialists; written copies in Arabic.
      audience: Sayfawa court and its rivals.
      purpose: Record rulers, reign lengths, mothers and burial places; legitimize the dynasty.
      point_of_view: >
        Dynastic and Muslim; Lange reads its precise reign lengths as evidence of early writing; Holl reads it
        as an oral epic reorganized as a political charter (16th c.).
    citation: "D. Lange, Le Diwan des sultans du (Kanem-)Bornu: chronologie et histoire d'un royaume africain (Wiesbaden: Steiner, 1977). Also H.R. Palmer, \"The Bornu Girgam,\" Journal of the African Society 12 (1912)."
    url: null
    access: library
    verification: citation-only
    notes: Not read directly; cited via Lange's GHA IV chapter and the Tourneux review of Holl.

  - id: src-ibn-furtu-kanem-wars
    title: Ibn Furtu's accounts of Idris Alooma's wars (Bornu and Kanem campaigns)
    author: Ahmad b. Furtu, imam of the Bornu court
    author_from: Bornu
    date: 1570s-1580s
    kind: primary
    type: chronicle-local
    voice: insider
    happ:
      historical_situation: Written for Mai Idris Alooma during his wars, two centuries after the move to Bornu.
      audience: Bornu court.
      purpose: Praise the mai's campaigns as holy war; explain past misfortunes.
      point_of_view: >
        Court imam; interprets Dunama's destruction of the mune as the cause of later troubles, a moral reading
        by a Muslim scholar of an older religious act.
    citation: "Ahmad b. Furtu, trans. H.R. Palmer, History of the First Twelve Years of the Reign of Mai Idris Alooma of Bornu (Lagos, 1926); D. Lange, A Sudanic Chronicle: The Borno Expeditions of Idris Alauma (Stuttgart, 1987)."
    url: null
    access: library
    verification: citation-only
    notes: Mune passage cited via Lange GHA IV (p.281, French ed.).

  - id: src-ibn-said-jughrafiya
    title: Kitab al-Jughrafiya (Book of Geography)
    author: Ibn Sa'id al-Maghribi, relaying Ibn Fatima
    author_from: al-Andalus / North Africa
    date: mid-13th c. (Ibn Sa'id d. 1286)
    kind: primary
    type: travel-geography
    voice: regional-outsider
    happ:
      historical_situation: Geographer compiling reports; his informant Ibn Fatima visited Kanem in the first half of the 13th c.
      audience: Learned readers in North Africa and al-Andalus.
      purpose: Describe the known world.
      point_of_view: >
        Outsider Muslim geographer; praises Dunama's holy war and forced conversions as piety; little interest
        in the religion of those conquered.
    citation: "Ibn Sa'id, in N. Levtzion and J.F.P. Hopkins, eds., Corpus of Early Arabic Sources for West African History (Cambridge, 1981; repr. Markus Wiener, 2000)."
    url: null
    access: book
    verification: citation-only
    notes: Content cited via Lange GHA IV.

  - id: src-al-umari-masalik
    title: Masalik al-absar fi mamalik al-amsar
    author: Ibn Fadl Allah al-Umari
    author_from: Damascus / Cairo
    date: c.1337-1349
    kind: primary
    type: travel-geography
    voice: regional-outsider
    happ:
      historical_situation: Mamluk chancery official compiling reports on foreign kingdoms, including Kanem and Air.
      audience: Mamluk administrators and learned readers.
      purpose: Inform the chancery about rulers it corresponded with.
      point_of_view: >
        Cairo bureaucrat measuring African kingdoms by wealth, troops and Muslim orthodoxy; calls Kanem weak but
        pious and Maliki.
    citation: "al-Umari, in Levtzion and Hopkins, eds., Corpus of Early Arabic Sources for West African History (1981)."
    url: null
    access: book
    verification: citation-only
    notes: Kanem passage cited via Lange GHA IV; Air sultan passage via Rossi (2016).

  - id: src-al-maqrizi
    title: Works of al-Maqrizi on Kanem and Bornu (incl. al-Ilmam and al-Khitat)
    author: Taqi al-Din al-Maqrizi
    author_from: Cairo
    date: early 15th c.
    kind: primary
    type: travel-geography
    voice: regional-outsider
    happ:
      historical_situation: Mamluk-era historian using reports from Kanem/Bornu pilgrims and envoys.
      audience: Cairo's learned public.
      purpose: History and topography of Egypt and of Muslim peoples connected to it.
      point_of_view: >
        Cairo scholar; wrongly calls Dunama Dibbalemi the first Muslim of his dynasty; describes Bornu's people
        as Muslims and hints the Bulala were not.
    citation: "al-Maqrizi, in Levtzion and Hopkins, eds., Corpus of Early Arabic Sources for West African History (1981)."
    url: null
    access: book
    verification: citation-only
    notes: Cited via Lange GHA IV.

  - id: src-bornu-letter-1391
    title: Letter of the king of Bornu to the Mamluk sultan
    author: Bir (Abu Amr Uthman) b. Idris, mai of Bornu
    author_from: Bornu
    date: c.1391-1392 (late 14th c.)
    kind: primary
    type: documentary
    voice: insider
    happ:
      historical_situation: >
        Bornu court in exile from Kanem, at war with the Bulala and raided by Arab groups; preserved by
        al-Qalqashandi in Subh al-a'sha (c.1412), a Cairo chancery manual.
      audience: The Mamluk sultan and his chancery.
      purpose: >
        Protest the enslavement of Bornu's free Muslims by Arab raiders and ask Egypt to act; present Bornu as a
        legitimate Muslim kingdom.
      point_of_view: >
        A Muslim king writing to a more powerful Muslim ruler; stresses shared faith and law; silent on
        non-Muslims enslaved by Bornu itself.
    citation: "Letter in al-Qalqashandi, Subh al-a'sha; trans. in Levtzion and Hopkins, Corpus of Early Arabic Sources (1981), and M. al-Hajj, \"Some diplomatic correspondence of the Seifuwa Mais of Borno with Egypt, Turkey and Morocco,\" in Y.B. Usman and M.N. Alkali, eds., Studies in the History of Pre-colonial Borno (Zaria, 1983)."
    url: null
    access: book
    verification: citation-only
    notes: >
      Content of the complaint confirmed via Lange GHA IV (read): Arabs enslaving Muslim subjects; Umar b. Idris
      killed by "Judham" Arabs. Lange names the addressee "Baybars" (likely an error); others say Barquq.

  - id: src-ibn-battuta-rihla
    title: Tuhfat al-nuzzar (the Rihla)
    author: Ibn Battuta (dictated to Ibn Juzayy)
    author_from: Tangier, Morocco
    date: 1355-1356
    kind: primary
    type: travel-geography
    voice: regional-outsider
    happ:
      historical_situation: Written for the Marinid court after his return from Mali via Takedda (1353).
      audience: Marinid sultan Abu Inan and his court in Fez.
      purpose: Record and entertain; display the reach of Islam and the author's piety and learning.
      point_of_view: >
        Maliki jurist from Morocco judging West African practice by North African norms; his Bornu information is
        hearsay gathered at Takedda.
    citation: "Ibn Battuta. In Hamdun and King, eds., Ibn Battuta in Black Africa (Markus Wiener, 1994)."
    url: null
    access: book
    verification: citation-only
    notes: Used here for Takedda (copper, Muslim merchants), Bornu (secluded king Idris; exports) and the Massufa comparison.

  - id: src-leo-africanus-description
    title: Description of Africa (Descrittione dell'Africa)
    author: al-Hasan al-Wazzan (Leo Africanus)
    author_from: Granada / Fez
    date: 1526 (published 1550)
    kind: primary
    type: travel-geography
    voice: regional-outsider
    happ:
      historical_situation: Written in Italy by a captured Fezzi diplomat who had traveled in the Sudan c.1510s.
      audience: Italian humanist and papal readers.
      purpose: Describe Africa for European readers.
      point_of_view: North African Muslim outsider writing for Christians; after this window, used here only as later evidence.
    citation: "Leo Africanus, Description of Africa; cited via D. Lange in UNESCO GHA IV."
    url: null
    access: book
    verification: citation-only
    notes: Horse-for-slave trade in Bornu (via Lange). Outside 1200-1450; marks continuity.

  - id: src-tarikh-al-sudan
    title: Tarikh al-Sudan
    author: Abd al-Rahman al-Sa'di
    author_from: Timbuktu
    date: c.1655
    kind: primary
    type: chronicle-local
    voice: insider
    happ:
      historical_situation: Timbuktu scholar writing under Moroccan (Arma) rule.
      audience: Timbuktu's scholarly elite.
      purpose: Record Songhay and Timbuktu history and its scholars.
      point_of_view: Timbuktu Muslim scholar; sees the Tuareg period from the city's side.
    citation: "J.O. Hunwick, Timbuktu and the Songhay Empire: al-Sa'di's Ta'rikh al-sudan down to 1613 (Leiden: Brill, 1999)."
    url: null
    access: library
    verification: citation-only
    notes: Tuareg leader Akil and the 1433-34 takeover; wsahel likely defines the same source id.

  - id: src-agadez-chronicles
    title: Agadez Chronicles
    author: Agadez court scholars
    author_from: Agadez
    date: Arabic manuscripts circulated in copies of 1907 (older content)
    kind: primary
    type: chronicle-local
    voice: insider
    happ:
      historical_situation: Copies given to colonial officers in the early 1900s by Sultan Ibrahim Ed Dasouqy.
      audience: Agadez elites and, in 1907, French and British colonial officers.
      purpose: Record the sultans and their supporting groups; support political claims.
      point_of_view: Court perspective; Rossi argues some lists of supporting groups were added in 1907.
    citation: "H.R. Palmer, Sudanese Memoirs vol. 3 (1928), text LVII; Y. Urvoy, \"Chroniques d'Agades,\" Journal de la Societe des Africanistes 4 (1934)."
    url: null
    access: library
    verification: citation-only
    notes: Known here through Rossi (2016), read.

  - id: src-egharevba-short-history-benin
    title: A Short History of Benin (Ekhere vb Itan Edo)
    author: Jacob U. Egharevba
    author_from: Benin City
    date: 1934 (Edo); English eds. 1936-1968
    kind: primary
    type: chronicle-local
    voice: insider
    happ:
      historical_situation: Written by an Edo historian close to the restored palace after the 1897 British conquest.
      audience: Edo readers, colonial officials, schools.
      purpose: Record and defend the royal tradition and its chronology.
      point_of_view: >
        Palace-centered transcription of oral tradition; Usuanlele and Falola assess his scholarship; his
        dates (Eweka c.1200, Oguola late 13th c.) are one chronology among several.
    citation: "J.U. Egharevba, A Short History of Benin, 4th ed. (Ibadan: Ibadan University Press, 1968)."
    url: null
    access: library
    verification: citation-only
    notes: Content as summarized in secondary sources; teacher should check the Oguola/Iguegha and Oranmiyan chapters.

  - id: src-ife-heads
    title: Ife copper-alloy heads (Wunmonije find and others)
    author: Ife casters, probably under royal patronage
    author_from: Ile-Ife
    date: c.12th-15th c. (14th-15th c. per the British Museum for Af1939,34.1)
    kind: primary
    type: material-culture
    voice: insider
    happ:
      historical_situation: Made for the Ooni's court and shrines during Ife's classical era.
      audience: Ife's court, priests and ancestors.
      purpose: Ritual commemoration of rulers; honoring the head (ori) as seat of power.
      point_of_view: Insider royal art; Blier ties much of it to Obalufon II's reign.
    citation: "Head of a king (Ooni), British Museum Af1939,34.1; National Commission for Museums and Monuments, Ife; see E. Platte, Bronze Head from Ife (British Museum Press, 2010)."
    url: null
    access: book
    verification: citation-only
    notes: Composition (heavily leaded zinc-brass) and Nigerian-ore attribution per British Museum summaries.

  # ---------------- SECONDARY ----------------
  - id: src-lange-gha4-chad
    title: "The kingdoms and peoples of Chad (French ed.: Royaumes et peuples du Tchad)"
    author: Dierk Lange
    author_from: Germany (Bayreuth)
    date: 1984 (French ed. read)
    kind: secondary
    type: scholarship
    voice: scholar-international
    citation: "D. Lange, \"The kingdoms and peoples of Chad,\" in D.T. Niane, ed., UNESCO General History of Africa IV: Africa from the Twelfth to the Sixteenth Century (Paris/Berkeley, 1984), ch.10."
    url: https://bokundoli.org/wp-content/uploads/2021/12/T4-14.pdf
    access: open-url
    verification: web-checked
    notes: >
      Read the French chapter online (pp. c.265-292 of the French edition). Lange's later work argues for
      Near Eastern (including Israelite/Canaanite) origins of Chadic kingship, which Nigerian scholars
      (e.g. the Bayero/Maiduguri schools) and others have contested; this file uses only his 1984 chapter.

  - id: src-adamu-gha4-hausa
    title: "The Hausa and their neighbours in the central Sudan (French ed.: Les Hawsa et leurs voisins du Soudan central)"
    author: Mahdi Adamu
    author_from: Nigeria (Ahmadu Bello University; later Usmanu Danfodiyo University)
    date: 1984 (French ed. read)
    kind: secondary
    type: scholarship
    voice: scholar-from-region
    citation: "M. Adamu, \"The Hausa and their neighbours in the central Sudan,\" in UNESCO General History of Africa IV (1984), ch.11."
    url: https://bokundoli.org/wp-content/uploads/2021/12/T4-15.pdf
    access: open-url
    verification: web-checked
    notes: Read online, pp. c.293-322 (French ed.). Cites Abdullahi Smith on Katsina chronology and Hunwick (1971) for Agadez 1405.

  - id: src-ryder-gha4-volta-cameroon
    title: "From the Volta to Cameroon (French ed.: De la Volta au Cameroun)"
    author: Alan F.C. Ryder
    author_from: United Kingdom (taught at University of Ibadan)
    date: 1984 (French ed. read)
    kind: secondary
    type: scholarship
    voice: scholar-international
    citation: "A.F.C. Ryder, \"From the Volta to Cameroon,\" in UNESCO General History of Africa IV (1984), ch.14."
    url: https://bokundoli.org/wp-content/uploads/2021/12/T4-18.pdf
    access: open-url
    verification: web-checked
    notes: Read online, pp. c.369-402 (French ed.). Ife chronology, Benin dynasty c.1300, Benin brass casting, Takedda copper note.

  - id: src-izard-gha4-niger-bend
    title: "The peoples and kingdoms of the Niger Bend and the Volta basin (French ed.)"
    author: Michel Izard
    author_from: France
    date: 1984 (French ed. read)
    kind: secondary
    type: scholarship
    voice: scholar-international
    citation: "M. Izard, \"The peoples and kingdoms of the Niger Bend and the Volta basin from the 12th to the 16th century,\" in UNESCO General History of Africa IV (1984), ch.9."
    url: https://bokundoli.org/wp-content/uploads/2021/12/T4-13.pdf
    access: open-url
    verification: web-checked
    notes: Footnote (French ed. p.239) dates the Tuareg capture of Timbuktu to 1433-34.

  - id: src-ryder-1965-ife-benin
    title: A Reconsideration of the Ife-Benin Relationship
    author: Alan F.C. Ryder
    author_from: United Kingdom (University of Ibadan)
    date: 1965
    kind: secondary
    type: scholarship
    voice: scholar-international
    citation: "A.F.C. Ryder, \"A Reconsideration of the Ife-Benin Relationship,\" Journal of African History 6, no. 1 (1965): 25-37."
    url: https://doi.org/10.1017/S0021853700005314
    access: library
    verification: web-checked
    notes: Abstract read (northern Nupe-Igala origin proposed); full text not read.

  - id: src-hunwick-1994-whodunit
    title: "A Historical Whodunit: The So-Called \"Kano Chronicle\" and its Place in the Historiography of Kano"
    author: John O. Hunwick
    author_from: United Kingdom / USA
    date: 1994
    kind: secondary
    type: scholarship
    voice: scholar-international
    citation: "J. Hunwick, \"A Historical Whodunit,\" History in Africa 21 (1994): 127-146."
    url: https://www.cambridge.org/core/journals/history-in-africa/article/abs/historical-whodunit-the-socalled-kano-chronicle-and-its-place-in-the-historiography-of-kano/8DC5438DE86A0CF05C1E6FCE707FE67E
    access: library
    verification: web-checked
    notes: Abstract/extract read; summarizes Last's 17th-c. compilation thesis and Palmer's 1880s dating.

  - id: src-last-1980-metaphors
    title: Historical Metaphors in the Kano Chronicle
    author: Murray Last
    author_from: United Kingdom (long at Ahmadu Bello University)
    date: 1980
    kind: secondary
    type: scholarship
    voice: scholar-international
    citation: "M. Last, \"Historical Metaphors in the Kano Chronicle,\" History in Africa 7 (1980): 161-178."
    url: null
    access: library
    verification: needs-library
    notes: Known via Hunwick 1994. Last reads the Chronicle's episodes as structured metaphors, not plain record.

  - id: src-holl-diwan-revisited
    title: "The Diwan Revisited: Literacy, State Formation and the Rise of Kanuri Domination (AD 1200-1600)"
    author: Augustin F.C. Holl
    author_from: Cameroon
    date: 2000
    kind: secondary
    type: scholarship
    voice: scholar-from-region
    citation: "A.F.C. Holl, The Diwan Revisited (London: Kegan Paul, 2000)."
    url: null
    access: library
    verification: citation-only
    notes: >
      Argument read via H. Tourneux's review, BCAI 17 (2001), https://www.ifao.egnet.net/bcai/17/6 . Holl
      treats the diwan as an oral epic and political charter, against Lange's reading of an early written record.

  - id: src-bobboyi-1993-ulama
    title: "Relations of the Borno 'Ulama' with the Sayfawa Rulers: The Role of the Mahrams"
    author: Hamidu Bobboyi
    author_from: Nigeria
    date: 1993
    kind: secondary
    type: scholarship
    voice: scholar-from-region
    citation: "H. Bobboyi, \"Relations of the Borno 'Ulama' with the Sayfawa Rulers: The Role of the Mahrams,\" Sudanic Africa 4 (1993)."
    url: null
