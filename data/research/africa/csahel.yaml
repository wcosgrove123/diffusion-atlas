    notes: Cited for the mahram as an institution; check what it says about the Umme Jilmi mahram and Muhammad b. Mani.

  - id: src-al-hajj-1983-diplomatic
    title: Some diplomatic correspondence of the Seifuwa Mais of Borno with Egypt, Turkey and Morocco
    author: Muhammad al-Hajj
    author_from: Sudan / Nigeria (Bayero University, Kano)
    date: 1983
    kind: secondary
    type: scholarship
    voice: scholar-from-region
    citation: "M. al-Hajj, in Y.B. Usman and M.N. Alkali, eds., Studies in the History of Pre-colonial Borno (Zaria: Northern Nigerian Publishing, 1983)."
    url: null
