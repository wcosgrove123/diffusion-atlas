    from: [pl-ext-hijaz, pl-cairo]
    to: pl-kanem
    span: {start: 1086, end: 1250, approx: true}
    mechanism: hierarchical
    carriers: [pilgrim, ruler]
    outcome: elite-only
    summary: >
      Kanem's king lists say its kings made the long pilgrimage to Mecca through Egypt, and at least one died on
      the way. Pilgrimage tied the court to the wider Muslim world long before Mansa Musa's famous hajj.
    detail: >
      Diwan tradition: Hummay died in Egypt (possibly on pilgrimage); Dunama I was killed in Egypt on
      pilgrimage; al-Maqrizi records a Fezzan tomb of a mai who died on pilgrimage. Good comparison for AP
      1.5/2.4 with Mali (owned by wsahel).
    evidence: [src-kanem-diwan, src-lange-gha4-chad, src-al-maqrizi]
    confidence: medium
    ap_topics: ["1.2", "1.5", "2.4"]

  - id: df-dunama-reform-kanem
    lens: religion
    what: Reforming Sunni (Maliki) Islam pressed on Kanem's people, and the opening of the mune
    from: [pl-njimi]
    to: pl-kanem
    span: {start: 1210, end: 1250, approx: true}
    mechanism: imposed
    carriers: [ruler, military, scholar]
    outcome: adoption
    summary: >
      Mai Dunama Dibbalemi pushed Islam beyond the court and is said to have opened the mune, the sacred
      object of Kanem's royal religion. Islam reached ordinary people in his reign, though Kanem's own
      later writers remembered the act as the start of rebellion and war.
    detail: >
      Lange: under Dunama orthodox Islam reached popular strata; Ibn Furtu blamed the mune's destruction for
      later troubles, including the Tubu war. Outcome "adoption" follows the cited source: Lange says
      orthodox Islam reached the popular strata under Dunama. It was earlier coded "resistance" because the
      act is blamed for the succession wars among his sons, but Ibn Furtu's 16th-c. blame of the mune's
      destruction is remembered opposition, not attested refusal; what was fought over was the dynasty's
      authority, not Islam itself. A good outcome-coding debate. Mechanism imposed (Test 1): the reform was
      pressed by the ruler with military force and included destroying the mune, a rival sacred object;
      outcome is still adoption because Islam took hold among the people.
    evidence: [src-lange-gha4-chad, src-ibn-furtu-kanem-wars, src-insoll-archaeology-islam]
    confidence: medium
    ap_topics: ["1.2", "1.5"]

  - id: df-kanem-jihad-sao-lake
    lens: religion
    what: Holy-war campaigns against lake and southern peoples, with conversion and enslavement
    from: [pl-kanem]
    to: pl-sao
    span: {start: 1210, end: 1450, approx: true}
    mechanism: imposed
    carriers: [military, ruler]
    outcome: resistance
    summary: >
      Kanem and later Bornu attacked non-Muslim neighbors around Lake Chad, calling it holy war and selling
      captives north. The Sao fought back hard; four Sayfawa kings died in those wars.
    detail: >
      Ibn Sa'id (via Lange): Dunama kept an arsenal on the lake and launched boat raids on non-Muslim lake
      peoples. Lange: slaves, taken in raids on southern non-Muslims, were Kanem's main export. Holy-war
      language justified enslavement, since Muslim law barred enslaving free Muslims (compare the 1391
      letter, where Bornu protests exactly that). Only enemies' sources survive. Mechanism imposed (Test
      1): conversion pressed by war, with enslavement of those who did not convert.
    evidence: [src-lange-gha4-chad, src-ibn-said-jughrafiya]
    confidence: medium
    ap_topics: ["1.5", "2.4"]

