    citation: "D. Bondarev, \"The language of the glosses in the Bornu quranic manuscripts,\" Bulletin of SOAS 69, no. 1 (2006): 113-140."
    url: https://doi.org/10.1017/S0041977X06000061
    access: library
    verification: citation-only
    notes: Old Kanembu (Tarjumo); oldest dated manuscripts 17th c. (Hamburg CSMC note dates the Konduga Qur'an 17th-18th c.).

  - id: src-insoll-archaeology-islam
    title: The Archaeology of Islam in Sub-Saharan Africa
