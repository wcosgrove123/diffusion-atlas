  # ---------- RELIGION (14) ----------
  - id: df-islam-kawar-to-kanem-court
    lens: religion
    what: Islam as the religion of Kanem's ruling dynasty (the Sayfawa)
    from: [pl-kawar]
    to: pl-kanem
    span: {start: 1075, end: 1210, approx: true}
    mechanism: hierarchical
    carriers: [ruler, family, merchant]
    outcome: elite-only
    summary: >
      Kanem's Sayfawa kings, whose founder probably came from the Muslim Berber oases of the Sahara, made Islam
      the religion of the court. For over a century it stayed mostly a royal and scholarly religion.
    detail: >
      Lange: Hummay probably came from a deeply Islamized Berber milieu, possibly Kawar; tradition names his
      mother as a Kay woman of Dirku (family as carrier). Islam was already known at court before Hummay
      (the diwan's Hu and Selema). Lange: Islam had few deep roots in Kanem before the 13th c. Kanem
      tradition (the mahram of Umme Jilmi) also credits a scholar, Muhammad b. Mani: unverified here.
      Holl (2000) reads the diwan as a political charter shaped in the 16th c., which makes its dynastic
      Islam story partly a legitimacy claim.
    evidence: [src-lange-gha4-chad, src-kanem-diwan, src-holl-diwan-revisited]
    confidence: medium
    ap_topics: ["1.2", "1.5", "2.4"]

  - id: df-hajj-to-kanem
