# Central Sahel (Lake Chad, Hausaland, Air) and West African forest (Ife, Benin), 1200-1450
# Owner: csahel. Researcher notes on verification:
#  - UNESCO GHA vol. IV chapters were read online in the French edition ("Histoire generale de l'Afrique IV"):
#    Lange ch.10 (Chad), Adamu ch.11 (Hausa), Izard ch.9 (Niger bend), Ryder ch.14 (Volta to Cameroon).
#    Page numbers below are from the French edition's running heads and are approximate.
#  - Palmer's 1908 Kano Chronicle PDF could not be read by the tools; Chronicle claims are cited through
#    Adamu (read) and marked citation-only on the Chronicle itself.

places:
  - id: pl-kanem
    name: Kanem
    alt_names: [Kanem (Sayfawa sultanate), "Kanem-Bornu (later name)"]
    kind: polity
    region: central-sahel
    location: {lat: 14.0, lon: 15.6}
    span: {start: 1075, end: 1387, approx: true}
    parent: null
    geometry_note: >
      Core: Kanem, the plains north-east of Lake Chad (modern Chad), capital Njimi (site not securely located).
      At its height under Dunama Dibbalemi (c.1210-1248) Kanem claimed authority over the Kawar oases and
      the Fezzan to the north (Ibn Sa'id via Lange) and raided around the lake. From c.1380 the Bulala took
      Kanem and the Sayfawa moved west to Bornu; Kanem stays under Bulala rule past 1450 (the Sayfawa
      retake Njimi only in the early 16th c.). End the polity's Kanem phase c.1387 and continue as pl-bornu.
    basemap_match: ["Kanem", "Kanem-Bornu", "Kanem Empire"]
    polity_profile:
      - year: 1240
        base: AGR
        flow: EXT
        membership: [KIN, FAITH]
        ruled_not_counted: captives taken in raids on lake and southern peoples and sold north; tributary Tubu, Kawar and Fezzan communities
        standing: SOV
        shape: IMPERIAL
        rulers: ONE
        right: [DESCENT, DIVINE]
        flag: >
          The mai claimed rule as a Muslim sovereign waging holy war, but his authority also rested on
          sacred kingship: the mune cult object Dunama is said to have opened belonged to that older royal
          religion, and later Kanem writers blamed its destruction for the dynasty's troubles.
      - year: 1350
        base: AGR
        flow: EXT
        membership: [KIN, FAITH]
        ruled_not_counted: enslaved captives; Sao and other lake peoples under attack or tribute
        standing: SOV
        shape: IMPERIAL
        rulers: ONE
        right: [DESCENT, DIVINE]
        flag: >
          Al-Umari (Cairo, 1330s-40s) calls Kanem pious and Maliki but weak in resources and troops; the
          Magumi princes' feuds (sons of Dunama, the yerima of the north) show the mai's ONE was contested
          in practice.
    detail: >
      The Sayfawa (Sefuwa) dynasty took power in Kanem in the late 11th c. from the earlier Duguwa line,
      with Hummay (Hume, c.1075-1086 in Lange's chronology) as founder. Lange argues Hummay came from a
      deeply Islamized Berber milieu, possibly the Kawar oases; the girgam/diwan marks the new line as the
      one "who professed Islam," but it also records Muslim rulers before Hummay (Hu and Selema), so the
      dynastic change is not the first Islam at court. Base is a judgment call: Kanem mixed farming
      Kanembu settlements with large herding populations (Tubu, later Arabs, the Bulala); AGR is chosen
      for the sedentary core around Njimi and should be argued in class.
    evidence: [src-lange-gha4-chad, src-kanem-diwan, src-ibn-said-jughrafiya, src-al-umari-masalik]
    confidence: medium

  - id: pl-bornu
    name: Bornu (Sayfawa sultanate west of Lake Chad)
    alt_names: [Borno, Barnu, Kanem-Bornu]
    kind: polity
    region: central-sahel
    location: {lat: 12.6, lon: 12.8}
    span: {start: 1380, end: 1893, approx: true}
    parent: null
    geometry_note: >
      West and south-west of Lake Chad (north-east Nigeria, south-east Niger). Bornu had been a tributary
      province of Kanem since at least the 13th c.; the Sayfawa court relocated there under Umar b. Idris
      (c.1382-1387). No fixed capital for about a century (Kaka is named as a residence) until Ali Gaji
      built Gazargamu (Birni Ngazargamu) c.1470s, outside this window.
    basemap_match: ["Bornu", "Kanem-Bornu", "Bornu Empire"]
    polity_profile:
      - year: 1420
        base: AGR
        flow: EXT
        membership: [KIN, FAITH]
        ruled_not_counted: Sao towns and other non-Muslim communities raided or made tributary; enslaved people
        standing: SOV
        shape: IMPERIAL
        rulers: ONE
        right: [DESCENT, DIVINE]
        flag: >
          A court without a fixed capital, at war with the Bulala in the east and the Sao in the south, and
          split by rival Sayfawa branches: the claim of one Muslim sovereign outran practice until the
          later 15th c.
    detail: >
      Lange (UNESCO GHA IV) dates the abandonment of Njimi to Umar b. Idris (c.1382-1387) under Bulala
      pressure; Bir (Uthman) b. Idris (c.1389-1421) pushed the Bulala back and wrote to the Mamluk sultan
      (see ex-bornu-letter-1391). Kanuri identity is usually explained as forming here from the Kanembu
      settlers (the Magumi royal lineage and its allies) and local peoples, including Sao.
    evidence: [src-lange-gha4-chad, src-bornu-letter-1391, src-al-hajj-1983-diplomatic]
    confidence: medium

  - id: pl-njimi
    name: Njimi (Djimi)
    alt_names: [Djimi, Jimi]
    kind: city
    region: central-sahel
    location: {lat: 13.9, lon: 15.9}
    span: {start: 1075, end: 1387, approx: true}
    parent: pl-kanem
    geometry_note: >
      Capital of Kanem for about three centuries (Lange). The site has never been securely located.
      Magnavita, Dangbet and Bouimon (2019) tentatively proposed the site of Tie; Dewiere (2024) supports
      this. The point here is a placeholder in Kanem, east of the lake; draw it with a "location
      uncertain" style. The Bulala held it from the 1380s; Bornu retook it early in the 16th c.
    basemap_match: []
    detail: >
      Arabic geographers name Njimi from the 12th c. (al-Idrisi). Later writers called it a city of tents,
      which may explain why archaeologists have not found it: much of it may have been built of
      impermanent materials.
    evidence: [src-lange-gha4-chad, src-magnavita-2019-lake-chad, src-dewiere-2024-kanem-borno]
    confidence: low

  - id: pl-kano
    name: Kano
    alt_names: [Dala (early name), Kano birni]
    kind: polity
    region: central-sahel
    location: {lat: 12.0, lon: 8.52}
    span: {start: 999, end: 1807, approx: true}
    parent: null
    geometry_note: >
      Walled city (birni) around Dala and Goron Dutse hills plus surrounding farmland and subordinate
      towns. The traditional founding date of 999 (Bagauda) is Palmer's reckoning and Adamu calls the
      early chronology arbitrary. Draw as a city-state point with a small surrounding area.
    basemap_match: ["Kano", "Hausa states", "Hausa Kingdoms"]
    polity_profile:
      - year: 1380
        base: AGR
        flow: EXT
        membership: [PLACE, KIN]
        ruled_not_counted: captives and tribute slaves (the Kwararafa sent Yaji slaves); conquered towns such as Santolo
        standing: SOV
        shape: CENTRAL
        rulers: ONE
        right: [DESCENT, DIVINE]
        flag: >
          The Kano Chronicle presents Yaji as a Muslim king, yet his son Kanajeji (1390-1410) returned to the
          Tchibiri rites: the court's religious claim swung within one generation.
      - year: 1445
        base: AGR
        flow: EXT
        membership: [PLACE, KIN]
        ruled_not_counted: enslaved captives from southern raids, many sent on to Bornu
        standing: BOUND
        shape: CENTRAL
        rulers: ONE
        right: [DESCENT, DIVINE]
        flag: >
          Under Abdullahi Burja (1438-1452) Kano began paying tribute to Bornu (Kano Chronicle via Adamu),
          while describing itself as sovereign.
    detail: >
      Main sources: the Kano Chronicle (an Arabic text compiled in the 1880s from earlier records and
      tradition) and the Asl al-Wangariyin (1650-51). Kano is AP-named under "Hausa kingdoms." Its walls
      were begun under Gijimasu and completed under Tsaraki (both 12th c. in the Chronicle's chronology).
    evidence: [src-kano-chronicle, src-adamu-gha4-hausa]
    confidence: medium

  - id: pl-katsina
    name: Katsina
    alt_names: [Katsina birni]
    kind: polity
    region: central-sahel
    location: {lat: 12.99, lon: 7.60}
    span: {start: 1300, end: 1807, approx: true}
    parent: null
    geometry_note: >
      City-state in northern Hausaland, a market town on routes north to Air and the Sahara. Its early
      rulers (Durbawa) are associated with Durbi ta Kusheyi, about 30 km south-east of the city. Muhammad
      Korau is said to have moved the seat to a new walled town; date debated (see detail).
    basemap_match: ["Katsina", "Hausa states"]
    polity_profile:
      - year: 1440
        base: AGR
        flow: EXT
        membership: [PLACE, KIN]
        ruled_not_counted: not documented for this date
        standing: SOV
        shape: CENTRAL
        rulers: ONE
        right: [DESCENT, DIVINE]
        flag: >
          Chronology is uncertain: Palmer's king list puts Korau at 1445-1495, but Adamu notes that Abdullahi
          Smith used an eclipse record to show Palmer's Katsina dates run more than a century off, and Korau
          may have been a contemporary of Kano's Rumfa (1463-1499).
    detail: >
      Katsina tradition (Palmer 1927; summarized by Adamu) says Korau, remembered as a mallam, killed the
      last Durbawa ruler Sanau at the Bawada tamarind tree and founded a new dynasty. Treat as tradition with
      an unresolved date; this file keeps Katsina's Muslim court as a 1445+ possibility, flagged.
    evidence: [src-adamu-gha4-hausa]
    confidence: low

  - id: pl-hausa-states
    name: Hausa city-states (Hausaland)
    alt_names: [Kasar Hausa, Hausa Bakwai, Hausa kingdoms]
    kind: people
    region: central-sahel
    location: {lat: 12.3, lon: 7.8}
    span: {start: 1000, end: 1807, approx: true}
    parent: null
    geometry_note: >
      Soft area between the Niger (west) and the Bornu borderlands (east), the Air foothills (north) and the
      Benue/Zazzau frontier (south): Daura, Kano, Katsina, Gobir, Rano, Zazzau (Zaria), Biram. The
      "Hausa Bakwai" list comes from the Bayajidda/Daura legend, which Adamu reads as reflecting later
      conditions. Adamu notes the name "Hausa" appears in documents only in the 16th-17th c.
    basemap_match: ["Hausa states", "Hausa Kingdoms"]
    detail: >
      Adamu favors an origin of Hausa-speaking communities in Hausaland itself, with Air as a possible
      earlier homeland; he discards the Baghdad-origin version of the Bayajidda story. Non-Muslim Hausa
      speakers (later called Maguzawa, Azna/Arna in Niger) show that Hausa identity and Islam were never
      the same thing.
    evidence: [src-adamu-gha4-hausa]
    confidence: medium

  - id: pl-ife
    name: Ile-Ife
    alt_names: [Ife, Ife-Ooye]
    kind: polity
    region: west-african-forest
    location: {lat: 7.49, lon: 4.55}
    span: {start: 1000, end: 1900, approx: true}
    parent: null
    geometry_note: >
      City and kingdom in the Yoruba forest (south-west Nigeria). Urban core with potsherd pavements and
      shrine groves; Igbo Olokun glass-working site on the northern edge. Wider claimed influence over
      Yoruba and Edo kingdoms is ritual and genealogical (Ife-origin claims), not drawn as territory.
    basemap_match: ["Ife", "Yoruba states", "Oyo"]
    polity_profile:
      - year: 1300
        base: AGR
        flow: EXT
        membership: [KIN, PLACE]
        ruled_not_counted: not documented
        standing: SOV
        shape: IMPERIAL
        rulers: ONE
        right: [DIVINE, DESCENT]
        flag: >
          Ogundiran describes an "Ife Empire" with client states and colonies in this era; Ryder (UNESCO)
          saw Yoruba states as small and treats Ife-descent claims as prestige claims. IMPERIAL is Ogundiran's
          reading; the Ooni's wider reach may have been mainly ritual. Debate it.
    detail: >
      Ife is the place Yoruba tradition names as where the earth was created and where the first kings
      (descendants of Oduduwa) were sent out from. Ryder dates Itayemoo charcoal to 960-1160 and potsherd
      pavements from c.1100. The classical florescence (copper-alloy and terracotta heads, glass beads)
      falls c.1200-1400. Ogundiran puts the "atrophy" of Ife's regional system from c.1400.
    evidence: [src-ryder-gha4-volta-cameroon, src-ogundiran-yoruba-new-history, src-babalola-2018-igbo-olokun]
    confidence: medium

  - id: pl-benin
    name: Benin (Edo kingdom)
    alt_names: [Igodomigodo (Ogiso era), Ubini, Edo]
    kind: polity
    region: west-african-forest
    location: {lat: 6.34, lon: 5.62}
    span: {start: 1000, end: 1897, approx: true}
    parent: null
    geometry_note: >
      Benin City and Edo-speaking hinterland (south-central Nigeria). Not the modern Republic of Benin.
      Large-scale earthworks (iya) ring the city and countryside; the city walls are dated variously
      (13th to mid-15th c.; see ex-benin-iya). Expansion beyond the Edo heartland begins with Ewuare,
      c.1440 onward.
    basemap_match: ["Benin", "Kingdom of Benin", "Edo"]
    polity_profile:
      - year: 1300
        base: AGR
        flow: EXT
        membership: [KIN, PLACE]
        ruled_not_counted: not documented
        standing: SOV
        shape: LAYERED
        rulers: ONE
        right: [DESCENT, DIVINE]
        flag: >
          The new Oba line claimed Ife descent, but the hereditary uzama chiefs kept great power (Ryder);
          the Oba's ONE was checked by a FEW in practice.
      - year: 1450
        base: AGR
        flow: EXT
        membership: [KIN, PLACE]
        ruled_not_counted: conquered communities beyond the Edo heartland; captives
        standing: SOV
        shape: IMPERIAL
        rulers: ONE
        right: [DESCENT, DIVINE]
        flag: >
          Ewuare (from c.1440) is credited with rebuilding the capital, reorganizing chiefs into palace,
          town and uzama orders, and conquests; Ryder doubts the tradition that he took the throne by killing
          his brother and suggests a reaction to foreign conquest.
    detail: >
      Edo tradition (Egharevba) names an Ogiso dynasty, a crisis under Ogiso Owodo, an interregnum (Evian,
      Ogiamwen), and a request to Ife that brought Oranmiyan, whose son Eweka became the first Oba.
      Egharevba dates Eweka c.1200; Ryder dates the Ife prince c.1300; Ryder (1965) proposed the dynasty
      came from further north (Nupe-Igala); Ogundiran (2020) calls the Ife story a stock narrative serving
      Ife's expansion.
    evidence: [src-egharevba-short-history-benin, src-ryder-gha4-volta-cameroon, src-ryder-1965-ife-benin, src-ogundiran-yoruba-new-history]
    confidence: medium

  - id: pl-agadez
    name: Agadez (Air sultanate)
    alt_names: [Agades, Sultanate of Air, Tenere sultanate]
    kind: polity
    region: central-sahel
    location: {lat: 16.97, lon: 7.99}
    span: {start: 1405, end: null, approx: true}
    parent: null
    geometry_note: >
      Sultanate of the Air massif (north-central Niger), seated at Agadez. Founding date is debated:
      1405 (Adamu, citing Hunwick 1971); city founding 1413 (Hunwick, Marmol), 1438 (Cooley), 1413-1424
      (Hamani), all reviewed by Rossi (2016); other summaries give 1430 or 1449. Earlier seats are placed in
      the Air (Tadaliza, Tin Chaman) before the move to Agadez. Draw the polity from 1405 (approx) with the
      seat at Agadez from c.1430 and a "date debated" flag.
    basemap_match: ["Agadez", "Air", "Tuareg"]
    polity_profile:
      - year: 1430
        base: PAS
        flow: EXT
        membership: [KIN, FAITH]
        ruled_not_counted: enslaved and servile people (iklan); sedentary farming and trading communities of the Air valleys
        standing: SOV
        shape: LEAGUE
        rulers: ONE
        right: [CONSENT, DESCENT]
        flag: >
          A sultan chosen by Tuareg confederations to mediate among them: he had a title and a seat, but the
          confederations kept their own leaders and arms, so LEAGUE (with ONE at the center) is a judgment
          call worth debating.
    detail: >
      Agadez Chronicles (Arabic manuscripts copied in 1907 and published by Palmer 1928 and Urvoy 1934) and
      oral traditions say the Air confederations chose an outsider as sultan; versions name Yunus as the
      first. One modern tradition links the line to "Istanbul," which scholars read as a metaphor for
      neutrality (and which is anachronistic: Constantinople was Byzantine until 1453). Rossi argues parts of
      the Chronicles were edited in 1907 for political reasons. Al-Umari already knew a Muslim Berber
      "sultan of Air" in the 1330s, before Agadez.
    evidence: [src-adamu-gha4-hausa, src-rossi-2016-agadez-chronicles, src-agadez-chronicles]
    confidence: low

  - id: pl-tuareg
    name: Tuareg (Kel Tamasheq)
    alt_names: [Kel Tamasheq, Imuhagh, Imajeghen]
    kind: people
    region: central-sahel
    location: {lat: 18.0, lon: 8.5}
    span: {start: 1000, end: null, approx: true}
    parent: null
    geometry_note: >
      Soft area for Tamasheq-speaking pastoral confederations: the Air massif, the Adrar des Ifoghas and
      the Niger bend north of Timbuktu, and the Hoggar. In this window Tuareg groups pressed south into Air
      (late 14th c., Adamu) and took Timbuktu c.1433-34 (see ev-tuareg-timbuktu). Timbuktu itself is
      defined by wsahel (pl-timbuktu).
    basemap_match: ["Tuareg", "Tuaregs"]
    detail: >
      Tamasheq is a Berber (Amazigh) language. Society is ranked: noble lineages, tributary herders (imghad),
      clerical lineages (ineslemen), artisans (inadan) and enslaved people (iklan); Rasmussen and others
      describe matrilineal inheritance of leadership (to a sister's son) and women's ownership of the tent.
      Most of that description comes from 19th-20th c. ethnography; for 1200-1450 the evidence is thin
      (al-Umari, Ibn Battuta, the Agadez Chronicles, the Tarikh al-Sudan), and it should not be projected
      backward without saying so.
    evidence: [src-rasmussen-tuareg, src-adamu-gha4-hausa, src-izard-gha4-niger-bend]
    confidence: medium

