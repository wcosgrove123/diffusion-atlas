  - id: src-bondarev-2006-glosses
    title: The language of the glosses in the Bornu quranic manuscripts
    author: Dmitry Bondarev
    author_from: Russia / United Kingdom (SOAS, Hamburg)
    date: 2006
    kind: secondary
