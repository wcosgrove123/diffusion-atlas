religion_profiles:
  # ---------------- KANEM ----------------
  - id: rp-kanem-court-1086-1210
    place: pl-kanem
    span: {start: 1086, end: 1210, approx: true}
    stratum: court
    community_name: null
    traditions:
      - {family: abrahamic, tradition: islam, branch: sunni-unspecified, share: dominant, local_form: "Sayfawa court Islam; royal pilgrimage to Mecca (Hummay died in Egypt, Dunama I was killed there on pilgrimage)"}
      - {family: local, tradition: indigenous, branch: other, share: significant, local_form: "Kanem sacred kingship centered on the mune, a sealed royal cult object, and the mai's ritual seclusion"}
    relation: plural
    basis: projected
    summary: >
      Kanem's Sayfawa kings were Muslims who went on pilgrimage, and later writers suggest they also kept
      the mune, a sacred object at the heart of Kanem's royal religion. The two traditions seem to have
      run side by side at court.
    detail: >
      The girgam/diwan presents the Sayfawa as the house that professed Islam, but also names Muslim rulers
      before Hummay; some scholars suggest the earlier rulers were Ibadi and Hummay Sunni, which is why branch
      is sunni-unspecified. Kanem tradition (the mahram of Umme Jilmi, in Palmer's translations) credits a
      teacher, Muhammad b. Mani, with converting the king; this research did not see that text, so treat it as
      unverified. The mune's existence before Dunama is inferred from later writers (Ibn Furtu, 16th c.)
      who say Dunama destroyed it. Plural, not syncretic: the evidence shows two separate institutions,
      not one blended rite.
    evidence: [src-kanem-diwan, src-lange-gha4-chad, src-ibn-furtu-kanem-wars, src-bobboyi-1993-ulama]
    confidence: medium
    flag: null

  - id: rp-kanem-court-1210-1250
    place: pl-kanem
    span: {start: 1210, end: 1250, approx: true}
    stratum: court
    community_name: null
    traditions:
      - {family: abrahamic, tradition: islam, branch: sunni-maliki, share: dominant, local_form: "Dunama Dibbalemi's reforming Islam: holy war, a Kanem madrasa in Cairo"}
      - {family: local, tradition: indigenous, branch: other, share: minority, local_form: "Supporters of the mune royal cult"}
    relation: contested
    basis: projected
    summary: >
      Mai Dunama Dibbalemi pushed a stricter Islam and is said to have opened or destroyed the mune, the sacred object
      of Kanem's royal religion. Later Kanem writers blamed that act for wars and troubles that followed.
    detail: >
      Lange (UNESCO GHA IV): Dunama (c.1210-1248) is the great Muslim reformer of Kanem; Ibn Sa'id, using
