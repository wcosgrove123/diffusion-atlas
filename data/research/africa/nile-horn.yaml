# Nile-Horn research file: middle Nile (Nubia), Ethiopian/Eritrean highlands, and the Muslim Horn, 1200-1450.
# Owner: nile-horn. Built 2026-10-14. Read docs/research-brief.md for the perspective rules this file follows.
# Verification honesty: the open web was reachable but most key monographs (Taddesse Tamrat, Kaplan, Quirin,
# Ruffini, Derat, Werner, Zarroug, Yusuf Fadl Hasan) were not; those are marked citation-only or needs-library.
# The UNESCO GHA vol. IV chapters 16 (Kropacek) and 17 (Tamrat) could not be opened past the front matter.

places:
  - id: pl-makuria
    name: Makuria (Dotawo)
    alt_names: [Dotawo, Muqurra, "al-Muqurra", "Kingdom of Dongola"]
    kind: polity
    region: middle-nile
    location: {lat: 18.22, lon: 30.75}
    span: {start: 580, end: 1500, approx: true}
    parent: null
    geometry_note: >
      Nile valley from the First Cataract (Aswan frontier; Lower Nubia = the old kingdom of Nobadia, run by an
      eparch based at Qasr Ibrim) south past Dongola to about the Fourth/Fifth Cataract, where al-Abwab and Alodia began.
      Label point is Old Dongola, the capital until the court moved north to Daw (often identified with Gebel Adda)
      after the civil war of 1365; after that, draw a shrinking rump in Lower Nubia. "Dotawo" is the kingdom's own
      Old Nubian name in documents from the 1180s to the 1490s. End date is debated: the usual narrative ends Christian
      royal rule in the late 15th century (last known king Joel, 1463 and 1484), but Adam Simmons argues the kingdom
      survived in reduced form until 1615-1620. Urban strata are recorded on pl-dongola and pl-qasr-ibrim.
    basemap_match: ["Makuria", "Nubia"]
    polity_profile:
      - year: 1250
        base: AGR
        flow: EXT
        membership: [FAITH, KIN]
        ruled_not_counted: enslaved people; Arab-descended settlers in Lower Nubia under their own leaders
        standing: SOV
        shape: CENTRAL
        rulers: ONE
        right: [DESCENT, DIVINE]
        flag: >
          The baqt with Egypt (an exchange arrangement dating to 651/652) is read by some as tribute; Ruffini and others
          read it as an exchange between equals, so SOV is the better reading for 1250.
      - year: 1320
        base: AGR
        flow: EXT
        membership: [FAITH, KIN]
        ruled_not_counted: enslaved people; Muslim newcomers (soldiers, merchants, tax agents) under Mamluk protection
        standing: BOUND
        shape: CENTRAL
        rulers: ONE
        right: [DESCENT, VICTORY]
        flag: >
          Kings still claimed the throne by royal descent (Barshambu and Kanz al-Dawla were both nephews of King David),
          but after 1276 the Mamluk sultan installed and removed kings by force, demanded tribute on top of the baqt, and
          imposed the jizya. Claim DESCENT; practice VICTORY by a foreign army.
    evidence: [src-werner-christentum-nubien, src-seignobos-nubia-mamluks, src-wikipedia-makuria, src-simmons-dotawo-redating, src-dbmnt]
    confidence: medium

  - id: pl-dongola
    name: Old Dongola
    alt_names: [Dunqula, Tungul]
    kind: city
    region: middle-nile
    location: {lat: 18.22, lon: 30.75}
    span: {start: 500, end: null, approx: true}
    parent: pl-makuria
    geometry_note: >
      East bank of the Nile between the Third and Fourth Cataracts. Royal capital of Makuria until the 1365 civil war;
      afterwards a regional town (Evliya Celebi still describes a functioning town in the 17th century). Polish Centre
      of Mediterranean Archaeology (University of Warsaw) has excavated here since 1964.
    evidence: [src-godlewski-dongola-social-change, src-heritagedaily-dongola]
    confidence: high

  - id: pl-qasr-ibrim
    name: Qasr Ibrim
    alt_names: [Silmi, Primis, Ibrim]
    kind: city
    region: middle-nile
    location: {lat: 22.65, lon: 31.99}
    span: {start: -1000, end: 1812, approx: true}
    parent: pl-makuria
    geometry_note: >
      Fortified hilltop town in Lower Nubia (now an island in Lake Nasser). Seat of the bishop of Ibrim and, in the
      Makurian period, center of the eparch of Nobadia. Its dry conditions preserved hundreds of Old Nubian, Coptic,
      Greek and Arabic documents. Not in the registry; created here because the Christian persistence story depends on it.
    evidence: [src-ruffini-bishop-eparch-king, src-dbmnt, src-timotheos-scrolls]
    confidence: high

  - id: pl-alodia
    name: Alodia (Alwa)
    alt_names: [Alwa, "Aloa", "Kingdom of Soba"]
    kind: polity
    region: middle-nile
    location: {lat: 15.52, lon: 32.68}
    span: {start: 580, end: 1504, approx: true}
    parent: null
    geometry_note: >
      Capital Soba East, near the confluence of the Blue and White Niles (south of modern Khartoum). Territory covered
      the Gezira and reached toward the Atbara; its northern province became the separate kingdom of al-Abwab by 1268/9.
      The end date is contested: Sudanese tradition (Funj Chronicle, Shendi documents) puts Soba's fall between the
      1470s and 1509; archaeology shows Soba in decline from the 12th century and no pottery or glass after the 13th.
    basemap_match: ["Alodia", "Alwa"]
    polity_profile:
      - year: 1250
        base: AGR
        flow: EXT
        membership: [FAITH, KIN]
        ruled_not_counted: herding and farming peoples of the Gezira and Butana whose religion is not recorded
        standing: SOV
        shape: IMPERIAL
        rulers: ONE
        right: [DESCENT, DIVINE]
        flag: >
          This profile leans on the 10th-century description by Ibn Selim al-Aswani and on Zarroug's model of a
          multi-ethnic kingdom; almost nothing written survives for the 13th century. Treat every cell as a hypothesis.
    evidence: [src-zarroug-alwa, src-wikipedia-alodia, src-gerhards-gezira]
    confidence: low

  - id: pl-zagwe
    name: Zagwe kingdom
    alt_names: ["Zagwe dynasty", "Lasta kingdom"]
    kind: polity
    region: ethiopian-highlands
    location: {lat: 12.1, lon: 39.1}
    span: {start: 1137, end: 1270, approx: true}
    parent: null
    geometry_note: >
      Core in Lasta and Wag (Agaw country), with authority over Tigray, Eritrean highlands and Amhara. Royal centers at
      Adefa and Roha (later called Lalibela). Start date debated (c. 930 to c. 1137 depending on which king lists are
      trusted); ends with the battle of Ansata, 1270. Zagwe descendants kept Wag and Lasta under the title Wagshum.
    basemap_match: ["Ethiopia", "Abyssinia", "Zagwe"]
    polity_profile:
      - year: 1210
        base: AGR
        flow: EXT
        membership: [FAITH, KIN]
        ruled_not_counted: non-Christian peoples on the southern and western frontiers; enslaved people
        standing: SOV
        shape: IMPERIAL
        rulers: ONE
        right: [DIVINE, DESCENT]
        flag: >
          Zagwe kings presented themselves as holy Christian kings (Lalibela is venerated as a saint and the town as a
          New Jerusalem). The later Solomonic texts call them non-Israelite usurpers; that is the winners' claim, not
          evidence about Zagwe legitimacy in their own day.
    evidence: [src-tamrat-church-state, src-sergew-hable-sellassie-ancient-medieval, src-wikipedia-zagwe, src-lalibela-land-grants]
    confidence: medium

