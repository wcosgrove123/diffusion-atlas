  - id: pl-ifat
    name: Ifat (Walasma sultanate)
    alt_names: ["Awfat", "Wafat", "Yifat", "Walashma sultanate"]
    kind: polity
    region: horn-interior
    location: {lat: 10.0, lon: 39.9}
    span: {start: 1285, end: 1415, approx: true}
    parent: null
    geometry_note: >
      Eastern Shewa escarpment and the lowlands toward the Awash, reaching to the port of Zeila. Capital Wafat; ruled
      by the Walasma dynasty, which absorbed the older Makhzumi sultanate of Shewa around 1278-1285. Ended when Sa'd
      al-Din II was killed near Zeila (al-Maqrizi: 1402/3; Ethiopian-based dating and Cerulli: 1414/15). Its dynasty
      re-formed as Adal (pl-adal).
    basemap_match: ["Ifat", "Ifat Sultanate"]
    polity_profile:
      - year: 1310
        base: AGR
        flow: EXT
        membership: [FAITH, KIN]
        ruled_not_counted: pastoral Afar and Somali groups at the edges; enslaved people
        standing: SOV
        shape: IMPERIAL
        rulers: ONE
        right: [DESCENT, DIVINE]
        flag: >
          The Walasma claimed Arab descent (from the Prophet's family via Aqil or al-Hasan). Cerulli, Trimingham and
          Taddesse Tamrat treat the dynasty as locally rooted, and the claim as a legitimacy strategy common in the Horn.
      - year: 1340
        base: AGR
        flow: EXT
        membership: [FAITH, KIN]
        ruled_not_counted: same
        standing: BOUND
        shape: IMPERIAL
        rulers: ONE
        right: [DESCENT, DIVINE]
        flag: After Amda Seyon's campaigns (1328-1332), Ifat's sultans ruled as tributaries installed by the Christian king, and revolted repeatedly.
    evidence: [src-wikipedia-walashma, src-britannica-ifat, src-chekroun-barr-sad-al-din, src-trimingham-islam-ethiopia, src-al-maqrizi-ilmam]
    confidence: medium

