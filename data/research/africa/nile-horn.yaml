diffusions:
  # ---------------- NUBIA ----------------
  - id: df-coptic-bishops-to-nubia
    lens: religion
    what: Bishops consecrated by the Coptic patriarch of Alexandria for the Nubian church
    from: [pl-cairo, pl-alexandria]
    to: pl-makuria
    span: {start: 1200, end: 1372, approx: true}
    mechanism: hierarchical
    carriers: [religious-specialist, ruler]
    outcome: adoption
    summary: >
      Nubian Christians could not ordain their own top clergy; bishops were chosen and consecrated by the Coptic patriarch
      in Egypt. The last known one, Timotheos, was consecrated in 1371 or 1372 and carried his appointment letters home to Qasr Ibrim.
    detail: >
      A centuries-old link, still working in the late 14th century. Timotheos's two scrolls (one Coptic with some Greek,
      one Arabic; each holding the same five letters) were found under his body in the north crypt of the Qasr Ibrim
      cathedral. The Coptic scroll is the only known Bohairic Coptic text from medieval Nubia. After him no Nubian bishop
      is documented, which helps explain how village Christianity could fade without clergy. The dependence on
      Alexandria also tied the Nubian church's fate to Mamluk Cairo's politics.
    evidence: [src-timotheos-scrolls, src-wikipedia-timotheos, src-british-museum-timotheos-cross]
    confidence: high
    ap_topics: ["1.5", "2.5"]

  - id: df-mamluk-court-islam-dongola
    lens: religion
    what: Islam at the Makurian court, imposed through Mamluk military intervention and installed Muslim princes
    from: [pl-mamluks, pl-cairo]
    to: pl-dongola
    span: {start: 1276, end: 1365}
    mechanism: imposed
    carriers: [military, ruler]
    outcome: elite-only
    summary: >
      Mamluk armies from Egypt sacked Dongola in 1276 and later put Muslim princes on the Makurian throne. Islam arrived at
      the top by force, while the city around the palace stayed mostly Christian.
    detail: >
      Mamluk campaigns: 1276 (Baybars), late 1280s (several, described by al-Nuwayri, destruction confirmed at Dongola),
      1316 (installing Barshambu), 1323 (installing Kudanbes). The jizya was imposed after 1276. Godlewski (2018) reads
      the 1317 mosque as evidence of subjugation, used mainly by northern newcomers; no evidence of mass conversion in
      Dongola before the 16th century. Arabic accounts (al-Nuwayri, al-Mufaddal, al-Maqrizi) are Mamluk court writing:
      they present Nubian kings as rebels and vassals, which is the conqueror's frame. Test 5 (coexistence) is arguable:
      Godlewski reads the 1317 mosque as serving northern newcomers. Christian kings (Kudanbes) also reigned after
      Barshambu. Mechanism imposed (Test 1): Islam reached the Makurian throne through Mamluk conquest, tribute and
      installed princes, not by elite choice.
    evidence: [src-seignobos-nubia-mamluks, src-al-nuwayri-nihaya, src-godlewski-dongola-social-change, src-wikipedia-makuria]
    confidence: high
    ap_topics: ["1.2", "1.5"]

  - id: df-bedouin-islam-nubia
    lens: religion
    what: Islam carried by Arab pastoral groups (Banu Kanz, Juhayna, Banu Ja'd and others) settling and intermarrying in Nubia
    from: [pl-mamluks]
    to: pl-makuria
    span: {start: 1300, end: 1450, approx: true}
    mechanism: relocation
    carriers: [migrant, family]
    outcome: coexistence
    summary: >
      Arab herding groups moving south from Upper Egypt settled in Nubia and married into Nubian families. Islam spread
      mostly through these marriages and households, slowly and over generations.
    detail: >
      Ibn Khaldun (late 14th century, outsider) says Juhayna overran Nubia and that Arab husbands' sons inherited Nubian
      chiefships through their mothers; Gerhards (2025, via Wikipedia) and others think he exaggerated. The Banu Kanz,
      Arab emirs of Aswan who intermarried with Nubians (the origin of the Kunuz), produced Kanz al-Dawla, king from
      1317. Expelled from Aswan in 1412/3, they merged further into Nubian society. Yusuf Fadl Hasan (University of
      Khartoum, 1967) built the classic account of gradual Arabization through intermarriage and matrilineal
      inheritance. Outcome is "coexistence" for 1300-1450: in this window Muslim and Christian households lived side
      by side; broad adoption of Islam in Nubia belongs to the 16th century and later. Elzein's archaeology of Islam in
      Sudan distinguishes Egyptian Sunni influence from the north and Sufi influence from the Red Sea.
    evidence: [src-ibn-khaldun-ibar, src-yusuf-fadl-hasan-arabs-sudan, src-wikipedia-makuria, src-elzein-islamic-archaeology-sudan, src-kropacek-unesco-nubia]
    confidence: medium
    ap_topics: ["1.2", "2.5"]

  - id: df-arabic-writing-dongola
    lens: language
    what: Arabic as a written language replacing Old Nubian
    from: [pl-mamluks]
    to: pl-dongola
    span: {start: 1317, end: 1450, approx: true}
    mechanism: hierarchical
    carriers: [ruler, military, merchant]
    outcome: no-uptake
    summary: >
      Old Nubian writing died out in the 1400s, but Arabic writing did not take its place in Dongola. For a long time the
      town seems to have written very little at all.
    detail: >
      Godlewski (2018) describes a long period of illiteracy beginning in the 15th century: Old Nubian texts stop and no
      Arabic texts replace them, which makes Islamization impossible to measure in writing. Old Nubian kept being written at
      Qasr Ibrim at least to 1463 and 1484 (DBMNT), and its spoken descendants survive today. The 1317 Arabic stela shows
      Arabic arrived with power, not with a literate community. Outcome is for this window only.
    evidence: [src-godlewski-dongola-social-change, src-dongola-mosque-stela, src-dbmnt]
    confidence: medium
    ap_topics: ["2.5"]

