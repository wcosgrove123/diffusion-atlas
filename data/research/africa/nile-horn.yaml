      Gizachew Tiruneh argues for an older Arabic text; others see a 6th-century core. Stimulus: shared biblical and
      Arabic Solomon traditions reshaped into a distinctly Ethiopian national epic. Ironically it was finished in the
      Tigrayan circle of a governor who rebelled against Amda Seyon (Taddesse Tamrat; not checked), yet it became the
      Solomonic charter.
