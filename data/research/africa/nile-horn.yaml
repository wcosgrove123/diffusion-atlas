  - id: df-new-jerusalem-lalibela
    lens: religion
    what: Jerusalem's holy places as a model for a sacred city in Ethiopia ("New Jerusalem")
    from: [pl-ext-levant]
    to: pl-lalibela
    span: {start: 1187, end: 1270, approx: true}
    mechanism: stimulus
    carriers: [pilgrim, ruler, religious-specialist]
    outcome: adoption
    summary: >
      Tradition says King Lalibela, who had lived in Jerusalem, rebuilt its holy places in rock at Roha after Saladin took
      Jerusalem in 1187. Its churches carry Jerusalem names and a stream is called the Jordan.
    detail: >
      The idea is taken up and remade in an Ethiopian form (stimulus), not copied. The Gadla Lalibela (a later
      hagiography) credits angels with helping. The 1187 link is a widely repeated interpretation (UNESCO; Met essay;
      the UNESCO GHA introduction ties it to Ethiopia's isolation from Alexandria). Ethiopian Christians' own frame is a
      holy king making Ethiopia a place of the Holy Land, connected to the later Solomonic idea of Ethiopia as heir of
      Israel. Do not frame this as a crusade response: Lalibela's world was Coptic Egypt and Jerusalem pilgrimage, and
      Ayyubid Egypt, which controlled the route, was also the Ethiopian church's link to its patriarch.
    evidence: [src-unesco-whc-lalibela, src-windmuller-luna-met-lalibela, src-gadla-lalibela, src-unesco-gha-vol4, src-wikipedia-lalibela-king]
    confidence: medium
    ap_topics: ["1.5", "2.5"]

  - id: df-aksumite-forms-rock-churches
    lens: architecture
    what: Aksumite building forms (stepped walls, monkey-head beams, window frames) carved into living rock
    from: [pl-zagwe]
    to: pl-lalibela
    span: {start: 1100, end: 1270, approx: true}
    mechanism: stimulus
    carriers: [artisan, ruler]
    outcome: adoption
    summary: >
      Lalibela's carvers copied the look of older Aksumite stone-and-timber buildings, but cut them down into solid rock.
      An old building style became a new kind of monument.
    detail: >
      Fauvelle and Mensan's stratigraphy proposes four phases at Lalibela: small caves; larger hypogean complexes in an
      Aksumite style; a first monumental phase (Betä Maryam); and a second monumental phase with new trenches (per
      Gnisci's review of Bosc-Tiessé and Derat 2019). They argue much of the southern complex began as fortification.
      Phillipson (2009) gives a different phased chronology. The local material is mostly basaltic scoria (Bruxelles and
      Mensan). The "from" place is the wider Zagwe kingdom, where earlier rock-hewn churches in Tigray show the tradition.
    evidence: [src-gnisci-review-lalibela, src-bosc-tiesse-derat-lalibela, src-phillipson-ancient-churches, src-windmuller-luna-met-lalibela]
    confidence: medium
    ap_topics: ["1.5"]

