    year: 1441
    approx: false
    place: pl-ethiopia-solomonic
    title: Ethiopian delegates at the Council of Florence
    keyframe: false
    lenses: [religion]
    summary: >
      Ethiopian monks attended the Council of Florence in Italy in 1441. It was one of the first direct meetings between
      the Ethiopian church and the pope's church.
    detail: >
      See df-ethiopian-delegates-florence for who sent them and the Prester John confusion.
    evidence: [src-wikipedia-zara-yaqob, src-tsehai-dacb-zara-yaqob]
    confidence: medium
    ap_topics: ["1.7", "2.5"]

  - id: ev-gomit-1445
    year: 1445
    approx: false
    place: pl-adal
    title: Battle of Gomit; Sultan Badlay of Adal killed
    keyframe: false
    lenses: [governance]
    summary: >
      Adal's sultan Badlay invaded the Christian kingdom's province of Dawaro and was killed by Zara Yaqob's army at Gomit
      in 1445. Adal then paid tribute for a time, but rebuilt its strength in the following decades.
    detail: >
      After Gomit, Zara Yaqob tightened control over the Sidama kingdoms. Badlay reigned 1433-1445.
    evidence: [src-wikipedia-zara-yaqob, src-wikipedia-walashma, src-tsehai-dacb-zara-yaqob]
    confidence: medium
    ap_topics: ["1.5"]

  - id: ev-debre-mitmaq-1450
    year: 1450
    approx: false
    place: pl-ethiopia-solomonic
    title: Council of Debre Mitmaq settles the Sabbath dispute
    keyframe: true
    lenses: [religion]
    summary: >
      At a church council called by Zara Yaqob, the Egyptian bishops accepted that Ethiopian Christians keep both Saturday
      and Sunday as holy days. It ended a split of about a century that began with the monk Ewostatewos and his followers.
    detail: >
      Held at Debre Mitmaq in Tegulet (Shewa). Debre Mitmaq was named after an Egyptian monastery destroyed by Mamluk
      authorities, which Zara Yaqob protested to Sultan Jaqmaq. Unity came with coercion: the same reign persecuted the
      Stephanites.
    evidence: [src-wikipedia-zara-yaqob, src-wikipedia-ewostatewos, src-tamrat-church-state]
    confidence: high
    ap_topics: ["2.5"]

sources:
  # ================= PRIMARY: NUBIA =================
  - id: src-dongola-mosque-stela
    title: Arabic foundation stela of the Dongola mosque (DBMNT 611)
    author: Unknown (issued under Sayf al-Din Abdallah Barshambu)
    author_from: Dongola, Makuria
    date: "1317-05-29"
    kind: primary
    type: epigraphy
    voice: insider
    happ:
      historical_situation: A Mamluk-installed Muslim prince had just taken the Makurian throne; Mamluk power over Nubia was at its height.
      audience: Muslims praying in the new mosque, Mamluk officials, and the Dongola court.
      purpose: Record and sanctify the conversion of the royal hall, and display the new ruler's Islamic legitimacy.
      point_of_view: The new ruler's and his Mamluk backers'; it does not speak for Dongola's Christian majority.
    citation: "Marble stela, in situ, Throne Hall, Old Dongola. Database of Medieval Nubian Texts (DBMNT) no. 611; translation in Godlewski 2015 and Crawford 1951."
    url: https://dbmnt.uw.edu.pl/texts/611/
    access: open-url
    verification: web-checked
    notes: >
      Voice is insider (produced in Dongola) though the patron depended on Egypt. Web-checked for date, findspot and
      description only; the translation was not seen. DBMNT flags older misdatings (RCEA, Insoll 2003).

  - id: src-qasr-ibrim-old-nubian-documents
    title: Old Nubian land sale under King Ioel of Dotawo (DBMNT 644)
    author: Unknown Nubian scribe
    author_from: Qasr Ibrim, Nobadia
    date: "1463-11-14"
    kind: primary
    type: documentary
    voice: insider
    happ:
      historical_situation: Late Dotawo; court based in Lower Nubia after the 1365 move from Dongola.
      audience: The parties, witnesses and officials who would later need proof of ownership.
      purpose: Record a legal sale of land in the official Nubian protocol.
      point_of_view: Nubian landholders and officials writing in their own language.
    citation: "Deed of land sale, Ismale to Ionngoka and Kasla, Qasr Ibrim (Archive 1). DBMNT no. 644; museum no. EA 90225."
    url: https://www.dbmnt.uw.edu.pl/texts/644/
    access: open-url
    verification: web-checked
    notes: Dating and titles read from the DBMNT record; full text not read.

  - id: src-timotheos-scrolls
    title: The consecration scrolls of Bishop Timotheos (Coptic and Arabic)
    author: Patriarch Gabriel IV of Alexandria and his chancery
    author_from: Cairo, Egypt
    date: 1371-1372
    kind: primary
    type: documentary
    voice: regional-outsider
    happ:
      historical_situation: Coptic patriarchate under Mamluk rule still appointing bishops for a shrinking Nubian church.
      audience: The clergy and faithful of Nubia, and the bishop himself.
      purpose: Certify Timotheos's consecration and authority as bishop of Faras with seat at Ibrim.
      point_of_view: The Coptic church hierarchy in Egypt, the Nubian church's parent body.
    citation: "J. M. Plumley, The Scrolls of Bishop Timotheos: Two Documents from Medieval Nubia (London: Egypt Exploration Society, 1975)."
    url: null
    access: book
    verification: citation-only
    notes: Content summarized from British Museum record and Wikipedia; scroll text not read.

  - id: src-dbmnt
    title: Database of Medieval Nubian Texts (DBMNT)
    author: Adam Łajtar, Grzegorz Ochała and team (University of Warsaw)
    author_from: Warsaw, Poland
    date: ongoing
    kind: secondary
    type: reference
    voice: scholar-international
    citation: "Database of Medieval Nubian Texts, University of Warsaw, https://dbmnt.uw.edu.pl"
    url: https://dbmnt.uw.edu.pl
    access: open-url
    verification: web-checked
    notes: Catalog of inscriptions and documents with dates, findspots and bibliography. Polish (international) project.

  - id: src-al-nuwayri-nihaya
    title: Nihayat al-arab fi funun al-adab (sections on Nubia)
    author: Shihab al-Din al-Nuwayri
    author_from: Upper Egypt / Cairo (Mamluk official)
    date: c. 1314-1333
    kind: primary
    type: chronicle-local
    voice: regional-outsider
    happ:
      historical_situation: Mamluk sultanate at its height, recently intervening repeatedly in Nubia.
      audience: Mamluk officials and learned readers in Cairo.
      purpose: Encyclopedic history of the Mamluk state, recording its campaigns.
      point_of_view: Mamluk chancery official; presents Nubian kings as vassals and rebels.
    citation: "Al-Nuwayri, Nihayat al-arab; Nubian passages translated in G. Vantini, Oriental Sources Concerning Nubia (Heidelberg and Warsaw, 1975)."
    url: null
    access: library
    verification: needs-library
    notes: Type is chronicle-local only in the sense of chronicle; voice regional-outsider relative to Nubia. Known here via Wikipedia's citation chain.

  - id: src-ibn-khaldun-ibar
    title: Kitab al-Ibar (passage on the Arabs in Nubia)
    author: Ibn Khaldun
    author_from: Tunis; wrote in the Maghrib and Cairo
    date: c. 1377-1382
    kind: primary
    type: chronicle-local
    voice: distant-outsider
    happ:
      historical_situation: Written after decades of Bedouin movement into Upper Egypt and Nubia, which he never visited.
      audience: Learned Muslim readers in North Africa and Egypt.
      purpose: Explain the rise and fall of dynasties through his theory of nomadic group solidarity.
      point_of_view: North African scholar whose theory makes nomads the drivers of change; likely exaggerates Juhayna conquest.
    citation: "Ibn Khaldun, Kitab al-Ibar; Nubian passage translated in Vantini, Oriental Sources Concerning Nubia (1975)."
    url: null
    access: library
    verification: citation-only
    notes: The passage on matrilineal inheritance passing chiefdoms to Arab husbands' sons is widely cited (Yusuf Fadl Hasan, Adams); not read here.

  - id: src-funj-chronicle
    title: Funj Chronicle (Katib al-Shuna tradition)
    author: Ahmad Katib al-Shuna and later editors
    author_from: Sennar region, Sudan
    date: 19th century compilation
    kind: primary
    type: chronicle-local
    voice: insider
    happ:
      historical_situation: Compiled in the Turco-Egyptian period, centuries after Soba's fall.
      audience: Sudanese readers and officials interested in Funj history.
      purpose: Record the origins and history of the Funj sultanate.
      point_of_view: Funj-era and later Muslim Sudanese memory; Soba's fall is the founding story of a new order.
    citation: "Funj Chronicle; see P. M. Holt, The Sudan of the Three Niles: The Funj Chronicle 910-1288/1504-1871 (Leiden: Brill, 1999)."
    url: null
