religion_profiles:
  # ---------------- MAKURIA ----------------
  - id: rp-makuria-court-1200-1275
    place: pl-makuria
    span: {start: 1200, end: 1275, approx: true}
    stratum: court
    community_name: null
    traditions:
      - {family: abrahamic, tradition: christianity, branch: miaphysite-coptic, share: dominant,
         local_form: "Nubian church under the Coptic patriarch of Alexandria; Greek, Coptic and Old Nubian in liturgy and records; royal patronage of cathedrals at Dongola and Faras"}
    relation: exclusive
    basis: attested
    summary: >
      Makuria's kings were Christian rulers whose bishops were appointed by the Coptic patriarch in Egypt. Church texts
      and inscriptions used Greek, Coptic and the Nubians' own written language, Old Nubian.
    detail: >
      Old Nubian use peaked in the 13th century (Lajtar and Ochala 2020, via Wikipedia); Greek remained the prestige
      liturgical language and Coptic marked the tie to Egypt. Faras cathedral paintings show kings and bishops under the
      protection of Christ, Mary and archangels, with Nubian rulers painted with darker skin than biblical figures, a
      choice that marks them as Nubian. The baqt kept relations with Egypt stable; Muslim merchants and envoys were the
      only Muslims at Dongola (Godlewski 2013, via Wikipedia).
    evidence: [src-wikipedia-makuria, src-werner-christentum-nubien, src-faras-cathedral-paintings, src-godlewski-dongola-social-change]
    confidence: high
    flag: null

  - id: rp-makuria-court-1276-1365
    place: pl-makuria
    span: {start: 1276, end: 1365}
    stratum: court
    community_name: null
    traditions:
      - {family: abrahamic, tradition: christianity, branch: miaphysite-coptic, share: significant, local_form: "Christian kings of the old royal line (David, Semamun, Kudanbes, Abraam)"}
      - {family: abrahamic, tradition: islam, branch: sunni-unspecified, share: significant, local_form: "Muslim princes installed or recognized by the Mamluk sultan (Sayf al-Din Abdallah Barshambu 1316-17; Kanz al-Dawla from 1317)"}
    relation: contested
    summary: >
      After a Mamluk army sacked Dongola in 1276, Egypt's sultans installed and removed Makurian kings, some Christian
      and some Muslim. In 1317 the first Muslim king turned the royal throne hall into a mosque and was killed within months.
    detail: >
      Sequence (Seignobos 2018, 2020; Werner 2013, via Wikipedia): King David raided the Red Sea port of Aidhab (1272);
      Baybars' army set out on 20 January 1276 and defeated him at Dongola in spring 1276; the king of al-Abwab handed
      David to the Mamluks; the installed king swore fealty, paid tribute beyond the baqt and the jizya was imposed.
      Further Mamluk invasions in the late 1280s left destruction visible in Dongola's archaeology. In 1316 al-Nasir
      Muhammad installed Barshambu, a Muslim nephew of David; his throne hall became a mosque (stela dated 29 May 1317);
      he was killed the same year by Kanz al-Dawla, another Muslim nephew of David and emir of the Banu Kanz of Aswan, who
      ruled with intermittent Mamluk recognition. Contested, not plural: the throne itself was fought over by armies and
      assassins along religious and dynastic lines. Godlewski notes some princes converted before coronation to win
      Egypt's favor; conversion here was a political strategy, not evidence about the population.
    evidence: [src-seignobos-nubia-mamluks, src-werner-christentum-nubien, src-wikipedia-makuria, src-dongola-mosque-stela, src-al-nuwayri-nihaya, src-godlewski-dongola-social-change]
    confidence: high
    flag: null

  - id: rp-makuria-court-1365-1450
    place: pl-makuria
    span: {start: 1365, end: 1450, approx: true}
    stratum: court
    community_name: null
    traditions:
      - {family: abrahamic, tradition: christianity, branch: miaphysite-coptic, share: dominant, local_form: "Kings of Dotawo ruling from Daw in Lower Nubia; bishops still consecrated by the Coptic patriarch (Timotheos, 1371/2)"}
    relation: exclusive
    basis: inferred
    summary: >
      After civil war in 1365 the Makurian court left Dongola and moved north to Daw, where Christian kings of
      "Dotawo" kept ruling. Old Nubian documents show these kings still issuing land deeds as late as 1463.
    detail: >
      Evidence is thin for 1365-1450 itself: the consecration scrolls of Bishop Timotheos (1371/2), found under his body
      at Qasr Ibrim, show the church still tied to Alexandria; the 1463 Old Nubian land sale from Qasr Ibrim names King
      Ioel (Joel) as king of Dotawo with a queen mother, an eparch of Nobadia and a bishop of Ibrim, i.e. the full
      Christian court hierarchy, just after this window. Simmons argues Dotawo lasted into the early 17th century;
      Godlewski treats the 15th century as the end of literate Christian court culture. "Exclusive" is inferred from
      Christian documents; Muslim princes of the Kanz line may also have ruled parts of the kingdom in this period.
    evidence: [src-timotheos-scrolls, src-qasr-ibrim-old-nubian-documents, src-dbmnt, src-simmons-dotawo-redating, src-wikipedia-makuria]
    confidence: low
    flag: Gap between 1372 and 1463 has almost no court evidence; the profile bridges two documents ninety years apart.

  - id: rp-makuria-rural-1200-1350
    place: pl-makuria
    span: {start: 1200, end: 1350, approx: true}
    stratum: rural
    community_name: null
    traditions:
      - {family: abrahamic, tradition: christianity, branch: miaphysite-coptic, share: dominant, local_form: "village churches and Old Nubian-language Christian practice in Lower Nubia and the Batn el-Hajar"}
      - {family: abrahamic, tradition: islam, branch: sunni-unspecified, share: minority, local_form: "Arab-descended settlers on the Egyptian frontier who had intermarried and spoke Nubian"}
    relation: coexisting
    summary: >
      Farming villages along the Nile in northern Nubia built and used their own churches. Near the Egyptian border,
      Muslim families of Arab descent lived alongside them and spoke Nubian.
    detail: >
      Rural evidence is unevenly spread. Lower Nubia (the stretch flooded by Lake Nasser) was excavated village by
      village in the 1960s UNESCO salvage campaign, so its village churches and houses are known (Adams); the Dongola
      reach and the region south of it are far less excavated, and their villages are mostly known from surface survey.
