    geometry_note: >
      Kingdom south of the Blue Nile (Abbay) bend; exact extent unknown and probably shifting. Raided Shewa in the
      13th century under a ruler the Christian hagiographies call Motalami. Conquered or made tributary by Amda Seyon
      (1316/7); afterward a frontier province. Not in the registry; created here as the target of southern evangelization.
      No polity_profile: no source from Damot survives, and the hagiographies are too late and hostile to profile it.
    evidence: [src-tamrat-church-state, src-gadla-takla-haymanot, src-wikipedia-amda-seyon]
