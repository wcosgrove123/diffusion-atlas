    detail: >
      Built probably under Zacharias III and Georgios I (first half of the 9th century). A marble stela with a 10-line
      Arabic foundation inscription, still in place left of the mihrab, is dated 16 Rabi I 717 = 29 May 1317 (DBMNT 611;
      older editions misdate it, including Insoll 2003). English translation in Godlewski 2015 and Crawford 1951.
      Excavated by the PCMA 1970-1983.
