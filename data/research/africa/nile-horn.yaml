  - id: pl-ethiopia-solomonic
    name: Christian kingdom of Ethiopia (Solomonic dynasty)
    alt_names: ["Ethiopia", "Abyssinia", "al-Habasha", "Amhara (in al-Umari)"]
    kind: polity
    region: ethiopian-highlands
    location: {lat: 10.5, lon: 39.2}
    span: {start: 1270, end: 1974}
    parent: null
    geometry_note: >
      The court was a moving camp, not a fixed capital, until Zara Yaqob settled at Debre Berhan (after 1456). Core in
      Amhara and Shewa (label point), with Tigray, Lasta, Gojjam and the Eritrean highlands. Expansion under Amda Seyon
      (1314-1344), Dawit I and Yeshaq made the Muslim sultanates of Ifat, Dawaro, Bali and Hadiya, and the kingdom of
      Damot, tributary for long stretches; draw a core plus a tributary halo.
    basemap_match: ["Ethiopia", "Abyssinia", "Ethiopian Empire"]
    polity_profile:
      - year: 1350
        base: AGR
        flow: EXT
        membership: [FAITH, KIN]
        ruled_not_counted: tributary Muslim sultanates (Ifat, Dawaro, Bali, Hadiya); Damot and Gojjam peoples; Beta Israel; enslaved people
        standing: SOV
        shape: IMPERIAL
        rulers: ONE
        right: [DESCENT, DIVINE]
        flag: >
          The dynasty claimed descent from Solomon and the Queen of Sheba (Kebra Nagast). Yekuno Amlak took the throne
          by defeating the last Zagwe king in battle in 1270, so in practice VICTORY founded what the texts call DESCENT.
      - year: 1445
        base: AGR
        flow: EXT
        membership: [FAITH, KIN]
        ruled_not_counted: Muslim tributaries; Beta Israel; Agaw and southern peoples; dissenting Christian monks; enslaved people
        standing: SOV
        shape: IMPERIAL
        rulers: ONE
        right: [DIVINE, DESCENT]
        flag: >
          Zara Yaqob made FAITH membership something the state checked: Christians had to wear written formulas on
          forehead and arms, and refusers lost property or life. He also required prostration before the king, which
          the Stephanite monks refused as worship owed to God alone.
    evidence: [src-tamrat-church-state, src-tamrat-unesco-horn, src-kebra-nagast, src-solomon-gebreyes-practices, src-wikipedia-zara-yaqob]
    confidence: high

