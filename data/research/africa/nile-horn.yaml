      western fortifications (Archive 1). Seller Ismale; buyers Ionngoka and Kasla. Titles include king of Dotawo, queen
      mother, eparch of Nobadia, bishop of Silmi (Ibrim), and tot of Faras. museum no. EA 90225 per DBMNT (present
      location "unknown, probably Egypt"). An insider document: Nubians recording their own property in their own language.
      Just outside the 1450 window but the best evidence for the kingdom in it.
    image_hint: "No open image known; use a Qasr Ibrim site photo from Wikimedia Commons"
    evidence: [src-qasr-ibrim-old-nubian-documents, src-dbmnt]
    confidence: high

  - id: ex-lalibela-churches
    name: Rock-hewn churches of Lalibela
    place: pl-lalibela
    location: {lat: 12.032, lon: 39.041}
    span: {start: 1150, end: null, approx: true}
    lenses: [architecture, religion]
    summary: >
      Eleven churches were carved down into solid rock at Lalibela, in two groups divided by a stream named the Jordan.
      Ethiopian tradition credits King Lalibela, while archaeologists think the work took several phases over centuries.
    detail: >
      Tradition: Lalibela (reigned about 1181-1221) carved them in 24 years with angels' help (Gadla Lalibela; priests told
      Alvares the same in the 1520s). Scholarship: four or five phases, 7th-13th centuries (Met essay); some structures
      (Bete Mercurios, Bete Gabriel-Rufael) probably began as fortifications (Fauvelle and Mensan) or palaces (Phillipson).
      Bete Giyorgis stands apart. Still a living pilgrimage center, especially at Genna (Ethiopian Christmas). UNESCO World
      Heritage since 1978.
    image_hint: "Wikimedia Commons search: Bete Giyorgis Lalibela"
    evidence: [src-unesco-whc-lalibela, src-windmuller-luna-met-lalibela, src-gnisci-review-lalibela, src-gadla-lalibela]
    confidence: high

  - id: ex-kebra-nagast
    name: Kebra Nagast ("Glory of the Kings")
    place: pl-ethiopia-solomonic
    location: {lat: 14.13, lon: 38.72}
    span: {start: 1314, end: 1322, approx: true}
    lenses: [religion, language, governance]
    summary: >
      This Ge'ez book tells how Menelik, son of Solomon and the Queen of Sheba, brought the Ark of the Covenant to
      Ethiopia. Ethiopian kings used it for six centuries to say God had chosen their family.
    detail: >
      Label point Aksum, where the colophon places the translator Yeshaq. Dating and the claimed Coptic-Arabic origin are
      debated (see df-kebra-nagast-solomonic-ideology). Insider source with a purpose: legitimacy for a dynasty that won
      its throne in battle in 1270. Cited in the 1955 Ethiopian constitution. English translation by Budge (1922);
      German by Bezold (1905).
    image_hint: "Wikimedia Commons search: Kebra Nagast manuscript"
    evidence: [src-kebra-nagast, src-wikipedia-kebra-nagast, src-tiruneh-kebra-nagast]
    confidence: high

  - id: ex-debre-libanos
    name: Debre Libanos monastery
    place: pl-debre-libanos
    location: {lat: 9.712, lon: 38.848}
    span: {start: 1284, end: null, approx: true}
    lenses: [religion, knowledge]
    summary: >
      Founded by the monk Tekle Haymanot around 1284, Debre Libanos became the most powerful monastery in Ethiopia.
      Its abbot ranked second only to the bishop from Egypt.
    detail: >
      Founded as Debre Asbo; renamed in the 15th century (Zara Yaqob promoted Tekle Haymanot's cult and Debre Libanos's
      rank). Its later hagiographies rewrote history to give Tekle Haymanot a role in the 1270 restoration (Taddesse
      Tamrat). Zara Yaqob also had its abbot Takla Hawariat beaten after he criticized royal violence; he died in prison.
    image_hint: "Wikimedia Commons search: Debre Libanos"
    evidence: [src-wikipedia-debre-libanos, src-tamrat-church-state, src-wikipedia-zara-yaqob]
    confidence: high

  - id: ex-zir-ganela-gospels
    name: Zir Ganela Gospels (1400-1401)
    place: pl-ethiopia-solomonic
    location: {lat: 12.5, lon: 39.3}
    span: {start: 1400, end: 1401}
    lenses: [art-music, religion, social]
    summary: >
      This illuminated Ge'ez Gospel book was commissioned by Princess Zir Ganela, an abbess and granddaughter of Amda
      Seyon. Its 26 full-page paintings in bright orange and warm colors show Ethiopia's own painting style.
    detail: >
      Colophon dates it 29 August 1400 to 28 August 1401, under her brother Dawit I. Made for the monastery she led (not
      named by the Morgan). Now Morgan Library MS M.828 (New York). Location field is a placeholder in the
      northern highlands; the monastery is unidentified. A woman as patron and abbess: a social-history entry point.
    image_hint: "Morgan Library online: Zir Ganela Gospels MS M.828 (check license)"
    evidence: [src-morgan-zir-ganela]
    confidence: high

  - id: ex-mashafa-berhan
    name: Mashafa Berhan ("Book of Light") of Zara Yaqob
    place: pl-ethiopia-solomonic
    location: {lat: 9.68, lon: 39.53}
    span: {start: 1434, end: 1468}
    lenses: [religion, governance, language]
    summary: >
      Written for King Zara Yaqob, this Ge'ez book lays out his church rules and attacks the spirit cults of Dask and
      Dino. It is the best surviving description of non-Christian religion in the highlands, written by its enemy.
    detail: >
      Edited by Conti Rossini and Ricci (CSCO, 1964-65). Pankhurst credits Zara Yaqob with Mashafa Berhan, Mashafa Milad
      and Mashafa Selassie; Ullendorff only the first two. Label point Debre Berhan, his capital after 1456. HAPP: author is
      the king or his clerics; audience clergy and officials; purpose enforce uniformity; point of view royal-orthodox.
    image_hint: "No open image known; use Debre Berhan Selassie church photo from Wikimedia Commons"
    evidence: [src-mashafa-berhan, src-solomon-gebreyes-practices, src-wikipedia-zara-yaqob]
    confidence: medium

  - id: ex-zeila-qiblatayn
    name: Masjid al-Qiblatayn and the medieval port of Zeila
    place: pl-zeila
    location: {lat: 11.353, lon: 43.473}
    span: {start: 1200, end: null, approx: true}
    lenses: [architecture, religion]
    summary: >
      Zeila's ruins include an old mosque with two prayer niches, one facing Jerusalem and one facing Mecca. Imported
      Islamic and Chinese pottery found there shows how far the port's trade reached.
    detail: >
      Survey (Fauvelle et al.) estimated a ~50 ha medieval site with at least three old mosques and coral-limestone tombs;
      finds of local pottery and imported Islamic and Chinese wares from the 13th-18th centuries helped date building
      phases. Local tradition dates the Qiblatayn mosque to the Prophet's lifetime; the archaeology does not support so
      early a date for the standing building. The start year is approximate.
    image_hint: "Wikimedia Commons search: Zeila mosque"
    evidence: [src-fauvelle-zeyla-archaeology, src-africanhistoryextra-zeila]
    confidence: medium

  - id: ex-amharic-soldier-songs
    name: Amharic soldiers' songs for Amda Seyon
    place: pl-ethiopia-solomonic
    location: {lat: 10.5, lon: 39.2}
    span: {start: 1314, end: 1344, approx: true}
    lenses: [language, art-music]
    summary: >
      A few songs praising King Amda Seyon are usually called the oldest texts in Amharic, the court's spoken language,
      beside Ge'ez, the language of church and books. The oldest surviving copy was made around 1600, so their 1300s
      date rests on tradition.
    detail: >
      Composed in his reign per standard accounts (Wikipedia: four soldiers' songs; Britannica: hymns praising him), but
      the manuscript that preserves the royal songs (Oxford, Bodleian Bruce 88) is late 16th or early 17th century
      (Hamburg Amharic summer-school slides date it 1610-1632, and date Amharic texts from about the 16th century). So
      the 14th-century date rests on attribution, not on a 14th-century copy. Amharic's role as "lessana negus" (language
      of the king) is the reason the songs exist at all.
    image_hint: "No open image known"
    evidence: [src-wikipedia-amda-seyon, src-hamburg-amharic-slides]
    confidence: low

events:
  - id: ev-lalibela-new-jerusalem
    year: 1200
    approx: true
    place: pl-lalibela
    title: King Lalibela's New Jerusalem
    keyframe: true
    lenses: [religion, architecture]
    summary: >
      Ethiopian tradition says King Lalibela, who ruled around 1181-1221, turned his capital Roha into a holy city modeled
      on Jerusalem, with churches cut from the rock. Archaeologists think the carving took several phases, and Ethiopians
      still go there on pilgrimage today.
    detail: >
      Reign about 1181-1221; land grants of 1204 and 1225 survive. The year is a label for his reign, not a construction
      date; see ex-lalibela-churches for the phasing debate.
    evidence: [src-unesco-whc-lalibela, src-windmuller-luna-met-lalibela, src-lalibela-land-grants]
    confidence: medium
    ap_topics: ["1.5", "2.5"]

  - id: ev-yekuno-amlak-1270
    year: 1270
    approx: false
    place: pl-ethiopia-solomonic
    title: Yekuno Amlak takes the throne; the Solomonic dynasty begins
    keyframe: true
    lenses: [religion, governance]
    summary: >
      Yekuno Amlak, a lord from Amhara, defeated the last Zagwe king in 1270 and founded a new dynasty. His successors
      claimed descent from Solomon and Sheba and called their rise a "restoration."
    detail: >
      Battle of Ansata. Taddesse Tamrat argued the last Zagwe king was Yetbarak, whose name the records erased;
      Getatchew Mekonnen Hasen names Na'akueto La'ab. Tradition calls the Zagwe king Za-Ilmaknun ('the unknown'). Yekuno
      Amlak had aid from the Muslim sultanate of Shewa and wrote to Baybars in 1273 for an abun. The "restoration"
      language is the dynasty's own; to the Zagwe it was a usurpation.
    evidence: [src-tamrat-church-state, src-wikipedia-yekuno-amlak]
    confidence: medium
    ap_topics: ["1.5"]

  - id: ev-mamluk-sack-dongola
    year: 1276
    approx: false
    place: pl-dongola
    title: Mamluk army sacks Dongola
    keyframe: true
    lenses: [religion, governance]
    summary: >
      In 1276 an army sent by the Mamluk sultan Baybars defeated King David of Makuria and sacked Dongola. From then on
      Egypt's sultans chose or removed Nubia's kings and taxed its Christians.
    detail: >
      The Mamluk army set out on 20 January 1276 (Wikipedia, citing Seignobos), took Gebel Adda and Meinarti, and defeated
      David's army at Dongola in spring 1276. The campaign followed King David's 1272 raid on Aidhab. David fled to
      al-Abwab, whose king Adur handed him over; he died a prisoner in Cairo. Mashkouda was installed on 4 June 1276 and
      swore fealty to Baybars. Arabic narratives (al-Mufaddal, al-Nuwayri) are the conqueror's record.
    evidence: [src-seignobos-nubia-mamluks, src-al-nuwayri-nihaya, src-wikipedia-makuria, src-wikipedia-al-abwab]
    confidence: high
    ap_topics: ["1.2", "1.5"]

  - id: ev-dongola-mosque-1317
    year: 1317
    approx: false
    place: pl-dongola
    title: Throne hall becomes a mosque under Makuria's first Muslim king
    keyframe: true
    lenses: [religion, architecture, governance]
    summary: >
      On 29 May 1317, the royal throne hall in Dongola was turned into a mosque under Abdallah Barshambu, a Muslim prince
      put on the throne by the Mamluks. Months later he was killed, but the building stayed a mosque.
    detail: >
      See ex-dongola-throne-hall-mosque. Barshambu is also spelled Barshanbu. Killed by Kanz al-Dawla, who took the
      throne himself. Neither later Christian nor Muslim kings restored the hall's royal function (Mamluk pressure).
      Teaching point: a mosque at the top does not mean a Muslim country; Dongola's churches kept working for another 150
      years.
    evidence: [src-dongola-mosque-stela, src-wikipedia-throne-hall-dongola, src-godlewski-dongola-social-change, src-seignobos-nubia-mamluks]
    confidence: high
    ap_topics: ["1.2", "1.5", "2.5"]

  - id: ev-amda-seyon-ifat-1332
    year: 1332
    approx: true
    place: pl-ifat
    title: Amda Seyon's war with Ifat
    keyframe: true
    lenses: [religion, governance]
    summary: >
      King Amda Seyon defeated Ifat and the Muslim states of the eastern highlands and made them pay tribute. A Ge'ez
      chronicle celebrates his campaign as a holy war; Arabic writers in Cairo describe Muslims suffering under it.
    detail: >
      Trigger (per chronicle): Ifat's sultan Haqq al-Din killed the royal envoy Ti'yintay amid tension over Mamluk
      persecution of Copts (1320-22). Sabr al-Din's revolt and the campaign through Adal: 1332 (Dillmann, Conti Rossini,
      Cerulli) or 1329 (Huntingford). The Chronicle of Amda Seyon is a royal text, possibly composed or reworked in the
      15th century; Marrassini reads it as a church homily with propaganda purpose. Not a crusade: a regional war over
      trade routes, tribute and the treatment of co-religionists, framed in religious terms by both sides.
    evidence: [src-chronicle-amda-seyon, src-wikipedia-amda-seyon, src-tamrat-church-state, src-al-umari-masalik]
    confidence: medium
    ap_topics: ["1.2", "1.5", "1.7"]

  - id: ev-dongola-court-leaves-1365
    year: 1365
    approx: true
    place: pl-makuria
    title: Civil war; the Makurian court leaves Dongola for Daw
    keyframe: false
    lenses: [governance, population]
    summary: >
      After a civil war in which Arab allies and a Mamluk army took part, the Makurian court abandoned Dongola and moved
      north to Daw in Lower Nubia. The kingdom, now called Dotawo in its documents, survived there in smaller form.
    detail: >
      1365 civil war; Mamluks withdrew in early 1366 without retaking Dongola (Werner 2013 via Wikipedia). Godlewski: the
      transfer is described in Arab sources for the second half of the 14th century; Daw is often identified with Gebel Adda.
      The town at Dongola continued, partly settled by the Banu Ja'd per some accounts.
    evidence: [src-werner-christentum-nubien, src-wikipedia-makuria, src-godlewski-dongola-social-change, src-heritagedaily-dongola]
    confidence: medium
    ap_topics: ["1.5"]

  - id: ev-timotheos-consecrated
    year: 1371
    approx: true
    place: pl-qasr-ibrim
    title: Bishop Timotheos consecrated for Nubia
    keyframe: false
    lenses: [religion]
    summary: >
      The Coptic patriarch in Egypt consecrated a Nubian monk named Timotheos as bishop for Faras and Qasr Ibrim. He is the
      last Nubian bishop we know of.
    detail: >
      19 November 1371 (British Museum) or 1372 (Wikipedia, following other sources). See ex-timotheos-scrolls.
    evidence: [src-timotheos-scrolls, src-british-museum-timotheos-cross]
    confidence: high
    ap_topics: ["2.5"]

  - id: ev-sad-al-din-killed
    year: 1403
    approx: true
    place: pl-zeila
    title: Sultan Sa'd al-Din of Ifat killed near Zeila
    keyframe: false
    lenses: [governance, religion]
    summary: >
      Christian forces pursued Ifat's sultan Sa'd al-Din toward the coast and killed him, in 1403 or 1415 depending on
      the source. His sons fled to Yemen and later returned to found the sultanate of Adal.
    detail: >
      Date disputed: al-Maqrizi gives 1402/3 (under Dawit I); Cerulli and others 1414/15 (under Yeshaq). Some recent work
      doubts the Zeila invasion account. Somali tradition remembers Sa'd al-Din at Saad Din island off Zeila, where a tomb
      is attributed to him. Ethiopian royal hymns celebrate the victory; al-Maqrizi treats Sa'd al-Din as a martyr.
    evidence: [src-al-maqrizi-ilmam, src-wikipedia-walashma, src-africanhistoryextra-zeila]
    confidence: medium
    ap_topics: ["1.2", "1.5"]

  - id: ev-yeshaq-beta-israel
    year: 1420
    approx: true
    place: pl-beta-israel
    title: Yeshaq's war in Wegera and the land-for-baptism decree
    keyframe: false
    lenses: [religion, social]
    summary: >
      King Yeshaq defeated a Beta Israel revolt at Kossoge, and Ethiopian accounts and Beta Israel memory say he ruled
      that only baptized Christians could inherit land. Many Beta Israel are remembered as losing their land rather
      than give up their faith.
    detail: >
      Yeshaq reigned 1414-1429/30; he built Debre Yeshaq church to mark the victory. Decree reported from Ethiopian
      accounts and oral tradition (Kaplan, via Wikipedia). One proposed origin of "Falasha" (landless, wanderer).
    evidence: [src-wikipedia-yeshaq, src-wikipedia-jews-ethiopia, src-kaplan-beta-israel]
    confidence: medium
    ap_topics: ["1.5"]

