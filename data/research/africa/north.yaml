  # ---------- Primary sources ----------
  - id: src-ibn-khaldun-ibar
    title: Kitab al-Ibar (with the Muqaddimah) and the autobiography al-Ta'rif
    author: Abd al-Rahman ibn Khaldun
    author_from: Tunis (Ifriqiya); served in Fez, Granada, Bejaia, Tlemcen; died Cairo
    date: c. 1375-1406
    kind: primary
    type: chronicle-local
    voice: insider
    happ:
      historical_situation: Written after decades of service at rival Maghrebi courts, the Black Death, and (for later revisions) his move to Mamluk Cairo in 1382.
      audience: Learned Muslim readers and patrons, first the Hafsid sultan of Tunis, later Cairo's scholars and rulers.
      purpose: Explain the rise and fall of dynasties through group solidarity ('asabiyya) and record the history of the Arabs, Berbers and neighbors.
      point_of_view: Maliki jurist and courtier of Andalusi-Arab family; an insider for the Maghreb, a regional outsider relying on informants for Mali.
    citation: "Ibn Khaldun, Kitab al-Ibar. Mali and Kanem passages in N. Levtzion and J. F. P. Hopkins, eds., Corpus of Early Arabic Sources for West African History (Cambridge, 1981); French trans. A. Cheddadi, Le Livre des exemples (Gallimard, 2002-2012)."
    url: null
    access: book
    verification: citation-only
    notes: >
      Voice is insider for the Maghreb places in this file; for Mali he is a regional outsider (see Austen and Jansen).
      The 1257 Kanem giraffe embassy to al-Mustansir is attributed to him via the al-Mustansir reference.

  - id: src-ibn-battuta-rihla
    title: Tuhfat al-nuzzar (the Rihla)
    author: Ibn Battuta (dictated to Ibn Juzayy)
    author_from: Tangier, Morocco
    date: 1355-1356
    kind: primary
    type: travel-geography
    voice: regional-outsider
    happ:
      historical_situation: Written for the Marinid court after his return from Mali.
      audience: Marinid sultan Abu Inan and his court in Fez.
      purpose: Record and entertain; display the reach of Islam and the author's piety and learning.
      point_of_view: Maliki jurist from Morocco; an insider for Sijilmasa and Fez, a regional outsider for Mali.
    citation: "Ibn Battuta. In Hamdun and King, eds., Ibn Battuta in Black Africa (Markus Wiener, 1994)."
    url: null
    access: book
    verification: citation-only
    notes: Same id as the record-format example; voice kept as regional-outsider for merge consistency, but in this file it is cited for Sijilmasa, where he is an insider.

  - id: src-al-umari-masalik
    title: Masalik al-absar fi mamalik al-amsar
    author: Ibn Fadl Allah al-Umari
    author_from: Damascus and Cairo (Mamluk chancery)
    date: c. 1337-1340
    kind: primary
    type: travel-geography
    voice: regional-outsider
    happ:
      historical_situation: Written by a senior Mamluk chancery official in Cairo about a decade after Mansa Musa's 1324 visit.
      audience: Mamluk officials and educated readers needing knowledge of foreign rulers and protocol.
      purpose: An administrative encyclopedia of the world's kingdoms, with information useful for diplomacy.
      point_of_view: Cairo bureaucrat relying on informants such as Ibn Amir Hajib (Mali) and Jamal al-Din of Zayla (Ethiopia); judges by Mamluk court norms.
    citation: "al-Umari, in Levtzion and Hopkins, eds., Corpus of Early Arabic Sources for West African History (Cambridge, 1981), pp. 269-273 (Musa in Cairo)."
    url: https://worldhistorycommons.org/al-umaris-account-mansa-musas-visit-cairo
    access: open-url
    verification: web-checked
    notes: Insider for Egypt, regional outsider for Mali and Ethiopia.

  - id: src-al-maqrizi-suluk
    title: Kitab al-Suluk li-ma'rifat duwal al-muluk
    author: Taqi al-Din al-Maqrizi
    author_from: Cairo, Egypt
    date: c. 1430s-1442
    kind: primary
    type: chronicle-local
    voice: insider
    happ:
      historical_situation: Written in the crisis-ridden 15th c. by a Cairo scholar and former market inspector, looking back on Ayyubid and Mamluk history.
      audience: Cairo's learned elite.
      purpose: A year-by-year history of Egypt; al-Maqrizi often contrasts a better past with present decline.
      point_of_view: Shafi'i scholar, critical of Mamluk misrule; describes Copts from a Muslim urban viewpoint and sometimes exaggerates (O'Sullivan).
    citation: "al-Maqrizi, Kitab al-Suluk; passages on 1321 and 1354 as discussed in Little (1976) and O'Sullivan (2006)."
    url: null
    access: book
    verification: citation-only
    notes: Read here only through O'Sullivan and the Konieczny summary.

  - id: src-al-maqrizi-ilmam
    title: al-Ilmam bi-akhbar man bi-ard al-Habasha min muluk al-Islam
    author: Taqi al-Din al-Maqrizi
    author_from: Cairo, Egypt
    date: c. 1430s
    kind: primary
    type: travel-geography
    voice: regional-outsider
    happ:
      historical_situation: Written in Mamluk Cairo during wars between the Solomonic kingdom and Muslim sultanates of the Horn.
      audience: Cairo's learned and political elite.
      purpose: Record the history of the Muslim rulers of Ethiopia (Ifat, Adal) and their struggle with the Christian kings.
      point_of_view: Cairo Sunni scholar sympathetic to the Muslim states, relying on informants from the Horn.
    citation: "al-Maqrizi, al-Ilmam bi-akhbar man bi-ard al-Habasha min muluk al-Islam (Arabic text in the OpenITI corpus)."
    url: null
    access: book
    verification: citation-only
    notes: Listed for nile-horn coordination; this file only uses it to show Cairo as a center of writing about Africa.

  - id: src-al-nuwayri-ilmam
    title: Kitab al-Ilmam (on the 1365 sack of Alexandria)
    author: Muhammad ibn Qasim al-Nuwayri al-Iskandarani
    author_from: Alexandria, Egypt
    date: c. 1365-1374
    kind: primary
    type: chronicle-local
    voice: insider
    happ:
      historical_situation: Written by an Alexandrian after the crusader sack of his city in October 1365.
      audience: Muslim readers in Egypt.
