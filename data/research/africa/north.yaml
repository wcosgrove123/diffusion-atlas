      Because Jewish tradition forbade destroying writing that might contain God's name, Fustat's Jews stored old
      papers in a synagogue room for centuries. Hundreds of thousands of letters, contracts and books survive,
      including papers in Maimonides' own hand.
    detail: >
      Documents span the 6th to 19th c., richest for the 11th-12th c. and thinning in the Mamluk period (EJ), which
      itself is evidence of the community's changing role. Rabbanite and Karaite material; Judeo-Arabic dominant.
      Goitein's A Mediterranean Society is the classic synthesis.
    image_hint: "Wikimedia Commons search: Ben Ezra Synagogue Cairo; Cairo Genizah fragment"
    evidence: [src-cairo-geniza, src-goitein-mediterranean-society, src-jvl-mamluk-jews]
