    lenses: [architecture, religion, knowledge]
    summary: >
      Sultan Abu Inan built this madrasa between 1350 and 1355, and it was the only Moroccan madrasa that also served
      as a Friday mosque. Across the street a water clock built in 1357 rang the hours for prayer.
