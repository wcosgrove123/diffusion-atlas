    summary: >
      Al-Azhar was built by the Fatimids, a Shi'i dynasty, and lost its role when the Sunni Ayyubids took over
      Egypt. It revived as a Sunni teaching mosque under the Mamluks from 1266, and by 1415 it housed hundreds of
      poor students grouped by home region.
    detail: >
      Archnet: khutba restored 1266 under Baybars by Aydamur al-Hilli; Taybarsiyya madrasa (1309, Shafi'i and Maliki
      iwans), Aqbughawiyya (1340). Encyclopedia entry: 750 indigent students in riwaqs by province and nationality
      in 1415-16 (al-Maqrizi). West African riwaqs by name are documented later (Kane, 18th c.).
    image_hint: "Wikimedia Commons search: Al-Azhar Mosque courtyard"
