    year: 1354
    approx: false
    place: pl-mamluks
    title: Coptic officials dismissed, church lands seized
    keyframe: false
    lenses: [religion, governance]
    summary: >
      Riots and new decrees in 1354 removed Christians, and even recent converts, from government jobs and took away
