    keyframe: true
    lenses: [religion, social]
    summary: >
      Tradition says that after the tomb of Fez's founder Idris II was rediscovered, the area was closed to
      non-Muslims and the city's Jews were moved to a new quarter by the royal palace, the mellah, the first in
      Morocco. Some historians argue the move was gradual and began long before 1438.
    detail: >
      Date debated: traditional 1438 (some 1437); Rguig (2014) and Gilson Miller (2001) argue for a gradual move that
      began after Fes el-Jdid's founding (1276), with Jews still in Fes el-Bali in the mid-14th c. Purpose read both as
