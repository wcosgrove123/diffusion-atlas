    ap_topics: ["1.2", "1.5"]

  - id: ev-abbasid-caliphate-cairo
    year: 1261
    approx: true
    place: pl-cairo
    title: An Abbasid caliph installed in Mamluk Cairo
    keyframe: true
    lenses: [governance, religion]
    summary: >
      Three years after the Mongols destroyed Baghdad, the Mamluk sultan Baybars recognized a member of the Abbasid
      family in Cairo as caliph and received authority from him. Muslim rulers looked to this caliph for legitimacy,
      but the clearest African case, Songhay's Askia Muhammad, came only in 1496-97.
    detail: >
      Garcin (pp. 418-419) gives the caliph's presence from 1262 (first claimant 1261, killed on campaign; a second
      installed 1262). Banister: the caliphs lost political weight by the mid-14th c. but kept ceremonial authority.
      African investiture documented here only for Askia Muhammad (1496-97). Year 1261 is the first claimant;
      Garcin's 1262 is the lasting installation, hence approx.
    evidence: [src-garcin-egypt-gha4, src-banister-abbasid-authority]
    confidence: high
    ap_topics: ["1.2", "1.5"]

  - id: ev-cairo-1321-churches
    year: 1321
    approx: false
    place: pl-cairo
    title: Churches destroyed across Egypt; fires in Cairo
    keyframe: true
    lenses: [religion, social]
    summary: >
      In 1321 crowds destroyed dozens of churches and monasteries across Egypt, and then a series of fires broke out
      in Cairo that officials blamed on Christian monks. Sultan al-Nasir Muhammad at first resisted but then gave in
      to protesters and issued harsh decrees against Christians.
    detail: >
      al-Maqrizi: 11 churches in Cairo and 49 elsewhere in about two weeks; confessions under torture of a monks' plot;
      decrees later rescinded and officials restored; only one convert known by name (Konieczny summary). O'Sullivan:
      about 60 churches and monasteries. Debate card: was 1321 popular anger at Coptic officials, a state-tolerated
      purge, or both? Whose account do we have? (A Muslim chronicler writing a century later.)
    evidence: [src-al-maqrizi-suluk, src-konieczny-cairo-1321, src-osullivan-coptic-conversion, src-little-coptic-conversion]
    confidence: high
    ap_topics: ["1.2"]

  - id: ev-musa-in-cairo
    year: 1324
    approx: false
    place: pl-cairo
    title: Mansa Musa in Cairo
    keyframe: true
    lenses: [religion, knowledge]
    summary: >
      On his way to Mecca, Mansa Musa of Mali stayed in Cairo, met Sultan al-Nasir Muhammad, and spent so much gold
      that al-Umari reports its value in Egypt fell for years. Cairo's writers made Mali famous across the Muslim world.
    detail: >
      al-Umari via Ibn Amir Hajib; Levtzion and Hopkins, CEAS pp. 269-273 (World History Commons excerpt). Garcin
      (p. 414): Musa's gold supported Egyptian coinage. Schultz: the gold drop was within normal range. No caliphal
      investiture of Musa is documented. Coordinate with wsahel ev-musa-hajj (place pl-mali); this record is the
      Cairo end of the same journey.
    evidence: [src-al-umari-masalik, src-garcin-egypt-gha4, src-wp-mansa-musa]
    confidence: high
    ap_topics: ["1.5", "2.4", "2.5"]

  - id: ev-black-death-maghreb-egypt
    year: 1348
    approx: false
    place: pl-cairo
    title: The Black Death in Egypt and the Maghreb
    keyframe: true
    lenses: [population, religion]
    summary: >
      Plague reached Alexandria in late 1347 and killed perhaps a third of Cairo's people by early 1349, while also
      ravaging Tunis and Fez. People gathered for mass prayers and processions, and villages emptied for generations.
    detail: >
      See df-black-death-egypt-maghreb. Ibn Khaldun lost his parents in Tunis (Idris, GHA IV p. 137, names his father
      in 1349; Ibn Khaldun's own Ta'rif says both parents died). Dols: no breakdown of government or religious
      institutions; Muslim responses framed plague as martyrdom for believers, while Ibn al-Khatib argued for
      contagion.
