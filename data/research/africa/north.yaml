    summary: >
      After the Mongols destroyed Baghdad, the Mamluks made a member of the Abbasid family caliph in Cairo in
      1261, and rulers elsewhere sought his approval to strengthen their claims. The clearest African case is
      Songhay's Askia Muhammad, who received this approval on his pilgrimage in 1496-97.
    detail: >
      Garcin (pp. 418-419, 425): caliph installed 1261/62, invested Baybars; prized by African Muslims; askiya
      Muhammad invested 1496. The Timbuktu chronicles disagree: Tarikh al-Sudan says the Abbasid caliph made him his
      deputy; Tarikh al-Fattash credits the Sharif of Mecca, acting as the caliph's deputy. No investiture of a Mali
      or Kanem ruler by the Cairo caliph before 1450 was found in this research: Mansa Musa's 1324 visit was to the
      sultan, and Bornu's 1391 letter to sultan Barquq is diplomacy, not investiture. Banister (2014-15) documents
      requests from Delhi, the Muzaffarids and the Ottomans, not African rulers. Span extends past 1450 as a
      forward pointer.
