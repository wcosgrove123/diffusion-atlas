# North Africa and Egypt (registry owner: north). Africa module, 1200-1450.
# Researcher file. Perspective note: North Africans, Egyptians, Amazigh (Berber) peoples, Copts and
# Maghrebi Jews are African; their own writers are tagged insider. Ibn Khaldun is an insider for the
# Maghreb and a regional outsider for Mali. Page numbers for UNESCO GHA IV refer to the FRENCH edition
# (Histoire generale de l'Afrique IV), read chapter by chapter at bokundoli.org during this research.

places:
  - id: pl-almohads
    name: Almohad Caliphate
    alt_names: [al-Muwahhidun, "Almohads"]
    kind: polity
    region: maghreb
    location: {lat: 31.8, lon: -6.5}
    span: {start: 1121, end: 1269, approx: true}
    parent: null
    geometry_note: >
      Movement begins with Ibn Tumart's preaching among the Masmuda of the High Atlas (Tinmal) c. 1121;
      Marrakesh taken 1147; at its height c. 1160-1212 it ruled from the Atlantic to Tripolitania and
      al-Andalus. After Las Navas de Tolosa (1212) it breaks apart: Hafsids independent 1229, Zayyanids
      1235/36, Marinids take Fez 1248. By the 1240s-1260s reduced to the Marrakesh region; ends 1269.
      Label point placed between Marrakesh and the Middle Atlas.
    basemap_match: []
    polity_profile:
      - year: 1200
        base: AGR
        flow: EXT
        membership: [FAITH, KIN]
        ruled_not_counted: >
          Muslims who were not Almohad initiates (Saidi notes non-Almohad populations paid kharaj under
          Abd al-Mu'min); Jews and Christians, who lost dhimma status and were pressed to convert; enslaved people
        standing: SOV
        shape: IMPERIAL
        rulers: ONE
        right: [DIVINE, DESCENT]
        flag: >
          Claimed rule as heirs of an infallible mahdi (Ibn Tumart) and as caliphs; in practice power rested
          on Masmuda kin councils and, increasingly, on hired troops including Christian mercenaries.
      - year: 1235
        base: AGR
        flow: EXT
        membership: [KIN, FAITH]
        ruled_not_counted: enslaved people; non-Muslims; Arab and Zanata groups held by bargains, not membership
        standing: SOV
        shape: CENTRAL
        rulers: ONE
        right: [DESCENT, VICTORY]
        flag: >
          In 1229 caliph al-Ma'mun publicly repudiated Ibn Tumart's status as mahdi, removing the founding
          claim; the dynasty kept the caliphal title while relying on Castilian troops.
    evidence: [src-saidi-almohads-gha4, src-hrbek-maghrib-disintegration-gha4, src-bennison-almoravid-almohad]
    confidence: high

  - id: pl-marinids
    name: Marinid Sultanate
    alt_names: [Banu Marin, "Marinids"]
    kind: polity
    region: maghreb
    location: {lat: 33.4, lon: -5.6}
    span: {start: 1244, end: 1465, approx: true}
    parent: null
    geometry_note: >
      Banu Marin were Zanata pastoralists (Hrbek: from the Zab). Take Fez 1248 (capital), Marrakesh 1269;
      Fes el-Jdid founded 1276. Core: Morocco north of the High Atlas plus Sijilmasa. Brief maximum under
      Abu al-Hasan and Abu Inan: Tlemcen 1337 and 1352, Tunis 1347 and 1357. Wattasid viziers dominate
      from 1420; last Marinid sultan killed 1465; Wattasid sultans from 1472.
    basemap_match: []
    polity_profile:
      - year: 1350
        base: AGR
        flow: EXT
        membership: [KIN, FAITH]
        ruled_not_counted: >
          Jews (dhimmi, with their own communal administration in Fez); enslaved people, including
          West Africans brought via Sijilmasa; Christian mercenaries and merchants as foreigners
        standing: SOV
        shape: IMPERIAL
        rulers: ONE
        right: [VICTORY, DESCENT]
        flag: >
          Lacking a religious founding claim, the Marinids built legitimacy through Maliki madrasas,
          jihad in Iberia, the mawlid and patronage of saints and sharifs; Abu Inan's brief claim to the
          caliphal title did not outlast him.
      - year: 1440
        base: AGR
        flow: EXT
        membership: [KIN, FAITH]
        ruled_not_counted: Jews (moved to the Fez mellah by c. 1438); enslaved people
        standing: SOV
        shape: CENTRAL
        rulers: ONE
        right: [DESCENT, DIVINE]
        flag: >
          Sultans reigned but Wattasid viziers ruled; the 1437 discovery of Idris II's tomb shows the court
          turning to sharifian (Prophet's descendant) sanctity for legitimacy.
    evidence: [src-hrbek-maghrib-disintegration-gha4, src-idris-maghrib-society-gha4, src-kably-societe-pouvoir-religion, src-shatzmiller-berbers-islamic-state]
