  - id: ev-almohad-mahdi-repudiated
    year: 1229
    approx: true
    place: pl-almohads
    title: Almohad caliph al-Ma'mun rejects the founder's claim to be the mahdi
    keyframe: true
    lenses: [religion, governance]
    summary: >
      The Almohad caliph al-Ma'mun denied that the movement's founder, Ibn Tumart, had been the mahdi, a leader
      sent by God, and hired Castilian Christian soldiers. The same year Tunis broke away, and the empire began to
      split into three North African kingdoms.
    detail: >
      Saidi (pp. 52-53): doctrine dropped because it had become a source of political isolation. Hrbek (pp. 102, 105):
      Castilian troops in the 1230 campaign; Abu Zakariyya independent 1229. Card prompt: what happens to a state
      religion when the state abandons it? The repudiation is variously put in 1229 or 1230 (626-627 AH), hence
      approx.
    evidence: [src-saidi-almohads-gha4, src-hrbek-maghrib-disintegration-gha4, src-wp-almohad-doctrine]
    confidence: high
    ap_topics: ["1.2", "1.5"]

  - id: ev-marinids-take-fez
    year: 1248
    approx: false
    place: pl-fez
    title: The Marinids take Fez
    keyframe: false
    lenses: [governance, religion]
    summary: >
      The Banu Marin, Amazigh (Berber) herders from Morocco's eastern steppe, captured Fez and made it their capital.
      Over the next century they organized Moroccan Islam around Maliki law and new colleges called madrasas.
    detail: Hrbek (p. 110). Marrakesh fell to them in 1269, ending the Almohads.
    evidence: [src-hrbek-maghrib-disintegration-gha4]
