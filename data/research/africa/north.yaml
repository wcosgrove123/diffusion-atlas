religion_profiles:
  # ================= ALMOHADS =================
  - id: rp-almohads-court-1200-1229
    place: pl-almohads
    span: {start: 1200, end: 1229, approx: true}
    stratum: court
    community_name: null
    traditions:
      - {family: abrahamic, tradition: islam, branch: other, share: dominant,
         local_form: "Almohad doctrine (tawhid): Ibn Tumart as infallible mahdi, creed taught in Tamazight and Arabic, Maliki manuals officially sidelined"}
    relation: exclusive
    basis: attested
    summary: >
      The Almohad court followed a strict reform of Islam taught by the Amazigh (Berber) preacher Ibn
      Tumart, whom it honored as the mahdi, a leader sent by God. Unlike most Muslim rulers, it refused
      Jews and Christians protected status.
    detail: >
      Saidi (GHA IV, French ed. pp. 42-44) summarizes the doctrine: strict affirmation of God's unity against
      anthropomorphism, condemnation of the Almoravid Maliki jurists, a claim to the mahdi, rejection of the
      exclusive authority of Maliki furu' manuals; Ibn Tumart preached in Tamazight and reportedly wrote in it.
      Bennison calls it a hybrid drawing on hadith study, Zahiri and Shafi'i law and Shi'i-style imamate ideas.
      Dhimma was rejected: Jews and Christians faced conversion or exile (Maimonides' family left Fez for Egypt).
      Maliki jurists remained in the cities and in practice kept teaching; Idris (pp. 129-130) stresses that the
      doctrine never displaced Maliki law among Maghrebis. Recorded as exclusive at the court level only.
    evidence: [src-saidi-almohads-gha4, src-bennison-almoravid-almohad, src-wp-almohad-doctrine, src-idris-maghrib-society-gha4]
    confidence: high
    flag: >
      Claim vs practice: the court proclaimed one doctrine for all subjects, but Maliki scholarship continued
      in the towns throughout the Almohad century.

  - id: rp-almohads-court-1229-1269
    place: pl-almohads
    span: {start: 1229, end: 1269, approx: true}
    stratum: court
    community_name: null
    traditions:
      - {family: abrahamic, tradition: islam, branch: other, share: dominant,
         local_form: "Residual Almohad dynastic tradition after al-Ma'mun's public repudiation of Ibn Tumart as mahdi (1229)"}
      - {family: abrahamic, tradition: islam, branch: sunni-maliki, share: significant, local_form: null}
      - {family: abrahamic, tradition: christianity, branch: latin-catholic, share: minority,
         local_form: "Castilian and other Iberian Christian mercenary cavalry serving the caliph, with their own clergy"}
    relation: coexisting
    summary: >
      In 1229 the caliph al-Ma'mun rejected the founder's claim to be the mahdi and brought Castilian Christian
      soldiers into Morocco to fight for him. A shrinking Almohad court now leaned on Maliki jurists and foreign
      Christian troops who kept their own worship.
    detail: >
      Repudiation date 1229 per the Almohad-doctrine reference; Saidi (pp. 52-53) explains it as a response to
      the political isolation the sectarian creed had produced; Hrbek (p. 102) notes al-Ma'mun's 1230 campaign
      used Castilian Christian soldiers. The often-repeated report that he allowed them a church in Marrakesh
      comes from Maghrebi chronicles (Rawd al-Qirtas tradition) and was not checked here. Whether later Almohad
      caliphs partly restored the mahdi cult is reported in some surveys but was not verified in this research.
    evidence: [src-saidi-almohads-gha4, src-hrbek-maghrib-disintegration-gha4, src-wp-almohad-doctrine]
    confidence: medium
    flag: null

  - id: rp-almohads-urban-1200-1229
    place: pl-almohads
    span: {start: 1200, end: 1229, approx: true}
    stratum: urban
    community_name: null
    traditions:
      - {family: abrahamic, tradition: islam, branch: other, share: significant,
         local_form: "Official Almohad creed taught by state-appointed preachers and talaba"}
      - {family: abrahamic, tradition: islam, branch: sunni-maliki, share: dominant,
         local_form: "Maliki law and teaching kept alive by town jurists; Sufi saints such as Abu al-Abbas al-Sabti (d. 1204) in Marrakesh"}
      - {family: abrahamic, tradition: judaism, branch: rabbanite, share: trace,
         local_form: "Outwardly converted Jewish families keeping Jewish practice in private; distinctive dress imposed by Ya'qub al-Mansur"}
    relation: contested
    summary: >
      In the cities, most Muslims kept following Maliki teachers even as the state pushed the Almohad creed.
      Jews who had been pressured into converting were made to wear special clothing, and some kept Jewish
      practice in secret.
    detail: >
      Contested because of forced conversion and the abolition of dhimma (Test 3). Ya'qub al-Mansur (r. 1184-1199)
      required converted Jews to wear dark blue or black; the pressure eased after 1229 but the Almohad period
      left few open Jewish communities in Morocco. Evidence for crypto-Jewish practice comes largely from Jewish
      sources (responsa, Maimonides' Epistle on Forced Conversion) rather than from Almohad texts. The Sabti cult in
      Marrakesh, venerated by Jews too (later evidence), shows urban saint devotion already in the Almohad capital.
    evidence: [src-wp-almohad-doctrine, src-idris-maghrib-society-gha4, src-wp-seven-saints, src-wp-jewish-fes]
    confidence: medium
    flag: null

  - id: rp-almohads-rural-1200-1269
    place: pl-almohads
    span: {start: 1200, end: 1269, approx: true}
    stratum: rural
    community_name: null
    traditions:
      - {family: abrahamic, tradition: islam, branch: sunni-unspecified, share: dominant,
         local_form: "Tamazight-speaking Islam of village saints (e.g. Abu Ya'za, d. 1177, Middle Atlas), baraka, pilgrimage to living holy men"}
      - {family: abrahamic, tradition: islam, branch: other, share: minority,
         local_form: "Almohad creed among Masmuda kin groups of the High Atlas tied to the dynasty (Tinmal)"}
    relation: coexisting
    summary: >
      In the countryside most people were Amazigh (Berber) farmers and herders who practiced Islam in their
      own language, often through local holy men believed to carry blessing (baraka). The Almohad creed had
      followers mainly among the High Atlas groups that founded the movement.
    detail: >
