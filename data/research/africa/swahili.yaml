    happ:
      historical_situation: Ritual furnishing of the Hill Complex at the capital's height.
      audience: Rulers, ritual specialists, ancestors.
      purpose: Ritual and royal symbolism (exact purpose debated).
      point_of_view: Royal and ritual elite.
    citation: Matenga (1998); Huffman (1985); Met Heilbrunn essay.
    url: null
    access: open-url
    verification: citation-only

