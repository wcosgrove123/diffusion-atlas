  - id: ev-mapungubwe-hill-capital
    year: 1220
    approx: true
    place: pl-mapungubwe
    title: Mapungubwe's rulers move onto the hill
    keyframe: false
    lenses: [religion, governance]
    summary: >-
      Around 1220 Mapungubwe's elite moved onto a hilltop above their people, linking kingship to rain-making.
      The kingdom traded gold and ivory to the coast for beads and cloth.
    detail: Hill capital c.1220-1290 (Chirikure et al. 2013; Met). K2 below the hill from the 11th c.
    evidence: [src-chirikure-2013-new-pathways, src-met-mapungubwe]
    confidence: medium
    ap_topics: ["1.5", "2.3"]

  - id: ev-fakhr-al-din-mosque
    year: 1269
    approx: false
    place: pl-mogadishu
    title: Fakhr al-Din mosque inscribed at Mogadishu
    keyframe: false
    lenses: [religion, architecture]
    summary: >-
      An inscription on the mihrab (prayer niche) dates Mogadishu's Fakhr al-Din mosque to 1269. Its curved
      stone roof marks the start of dome and vault building on the coast.
    detail: See ex-fakhr-al-din-mosque.
    evidence: [src-mogadishu-mosque-inscriptions, src-samuel-ahe-swahili-architecture]
    confidence: high
    ap_topics: ["1.2", "2.3"]

  - id: ev-mahdali-takeover
    year: 1277
    approx: true
    place: pl-kilwa
    title: The Mahdali dynasty takes Kilwa
    keyframe: true
    lenses: [religion, governance]
    summary: >-
      Around 1277 al-Hasan ibn Talut seized power at Kilwa and founded the Mahdali dynasty, which claimed descent
      from the Prophet's family through Yemen. Under his grandson Kilwa controlled the gold trade of Sofala and
      reached its peak.
    detail: >-
      Date from Freeman-Grenville's chronology of the Kilwa Chronicle; Chittick puts the dynastic break late
      13th/early 14th c. The Chronicle and Barros differ on details (Saad). Kilwa had taken Sofala from
      Mogadishu's merchants in the late 13th c. (Pouwels via Samuel) or earlier (some versions say 12th c.).
      Ask students: what did a sharifian claim give a ruler who had taken the throne by force?
    evidence: [src-kilwa-chronicle-arabic, src-kilwa-chronicle-barros, src-saad-1979-kilwa-historiography, src-chittick-1965-shirazi]
    confidence: medium
    ap_topics: ["1.2", "1.5", "2.3"]

  - id: ev-ibn-battuta-swahili-coast
    year: 1331
    approx: true
    place: pl-kilwa
    title: Ibn Battuta sails the Swahili coast
    keyframe: true
    lenses: [religion, knowledge, social]
    summary: >-
      The Moroccan traveler Ibn Battuta visited Mogadishu, Mombasa and Kilwa and described their Muslim courts,
      wooden mosques and generous sultan. He wrote as an outsider, judging African Muslims by North African
      standards.
    detail: >-
      Date: 1331 in Gibb and Dunn's chronology; 1330 or 1332 in other works. Key claims: Mogadishu's ruler Abu
      Bakr speaks Maqdishi and Arabic, merchants lodge with hosts; Mombasa's people are Shafi'i with wooden
      mosques; Kilwa is beautifully built, its people mostly Zanj with facial tattoos, its sultan Abu
      al-Muzaffar Hasan (Abu al-Mawahib) generous and campaigning against mainland non-Muslims, giving away
      slaves and ivory. He only heard about Sofala's gold from Yufi. HAPP: dictated in Fez c.1355 for the
      Marinid court.
    evidence: [src-ibn-battuta-rihla, src-rodland-medievalslavery-kilwa]
    confidence: high
    ap_topics: ["1.2", "2.3", "2.5"]

  - id: ev-said-of-mogadishu
    year: 1315
    approx: true
    place: pl-mogadishu
    title: Sa'id of Mogadishu leaves to study in Mecca and Medina
    keyframe: false
    lenses: [knowledge, religion]
    summary: >-
      According to Ibn Battuta, who met him in India, a young scholar from Mogadishu named Sa'id studied in
      Mecca and Medina for many years and later traveled to India and China. African Muslims were teachers and
      travelers in the Islamic world, not only learners.
    detail: >-
      Born c.1301, reported by Ibn Battuta (who met him in India) as studying 14 years in each holy city. Year
      1315 is an estimate of departure ("as a teenager"). Kept as an event because the taxonomy has no outcome
      for a scholar joining an existing shared tradition abroad (see taxonomy pressure).
    evidence: [src-ibn-battuta-rihla]
    confidence: medium
    ap_topics: ["1.2", "2.3"]

  - id: ev-great-zimbabwe-peak
    year: 1350
    approx: true
    place: pl-great-zimbabwe
    title: Great Zimbabwe at its height
    keyframe: true
    lenses: [architecture, religion, governance]
    summary: >-
      By the mid-1300s Great Zimbabwe's builders were raising the Great Enclosure, and the city's rulers grew
      rich from gold traded to the coast. They kept their own Shona religion while trading with Muslim
      merchants.
    detail: >-
      Peak building 14th-15th c.; imports peak 14th c. (Fagan). Pair this keyframe with
      ev-ibn-battuta-swahili-coast (1331) to show the two ends of one trade route with two different
      religious outcomes.
    evidence: [src-chirikure-2013-bayesian-gz, src-fagan-zambezi-limpopo, src-unesco-whc-great-zimbabwe]
    confidence: high
    ap_topics: ["1.5", "1.7", "2.3"]

  - id: ev-tumbatu-abandoned
    year: 1350
    approx: true
    place: pl-zanzibar
    title: Tumbatu abandoned
    keyframe: false
    lenses: [population]
    summary: >-
      The stone town of Tumbatu, off Unguja (Zanzibar), was abandoned around 1350, and its cause is not
      known. Power in the islands shifted toward Pemba's towns.
    detail: Wynne-Jones via Samuel; cause not established. Matches a wider late-14th-c. downturn (gold prices, plague?).
    evidence: [src-samuel-ahe-kilwa-timeline]
    confidence: low
    ap_topics: ["2.3"]

  - id: ev-malindi-giraffe
    year: 1414
    approx: false
    place: pl-malindi
    title: An East African giraffe reaches the Ming court
    keyframe: true
    lenses: [governance, art-music]
    summary: >-
      In 1414 a giraffe from Malindi was presented to the Yongle emperor, and in 1415 Malindi's own envoys brought
      another. The Chinese court treated the animal as a qilin, proof of the emperor's virtue.
    detail: See df-malindi-giraffe-to-china. The 1414 animal came via Bengal; 1415 directly from Malindi.
    evidence: [src-sciencenews-giraffes, src-shen-du-giraffe-painting]
    confidence: medium
    ap_topics: ["2.3", "2.5"]

  - id: ev-ming-fleets-east-africa
    year: 1418
    approx: true
    place: pl-mogadishu
    title: Ming treasure-fleet squadrons call at Mogadishu, Brava and Malindi
    keyframe: false
    lenses: [governance, technology]
    summary: >-
      Squadrons of Zheng He's fleets reached Mogadishu, Brava and Malindi between 1417 and 1433, trading silk
      and porcelain and escorting envoys home. The visits ended when the Ming stopped the voyages, leaving
      little lasting trace.
    detail: >-
      Fifth voyage (1417-1419) lists Mogadishu, Brava and Malindi; sixth (1421-1422) sent detached squadrons to
      Mogadishu and Brava; seventh (1431-1433) names them in the Mingshi. Whether Zheng He himself came is
      unclear (Dreyer). Matveiev dates the first reliable records to 1417-1419 and 1421-1422. Legends of Chinese
      shipwreck survivors on Pate are unproven.
    evidence: [src-ming-voyage-records, src-dreyer-zheng-he, src-matveiev-swahili-civilization]
    confidence: medium
    ap_topics: ["2.3"]

  - id: ev-kilwa-great-mosque-rebuilt
    year: 1430
    approx: true
    place: pl-kilwa
    title: Kilwa's Great Mosque rebuilt as amirs rise
    keyframe: false
    lenses: [architecture, governance]
    summary: >-
      Under Sultan Sulayman ibn Muhammad, Kilwa rebuilt its Great Mosque with coral pillars and vaults. At the
      same time real power was shifting from sultans to governors and councils of leading families.
    detail: Sulayman ibn Muhammad c.1421-1442 (Matveiev gives 1412-1442). Saad on 15th-c. decentralization.
    evidence: [src-matveiev-swahili-civilization, src-saad-1979-kilwa-historiography, src-samuel-ahe-kilwa-timeline]
    confidence: medium
    ap_topics: ["1.5", "2.3"]

  - id: ev-great-zimbabwe-decline
    year: 1450
    approx: true
    place: pl-great-zimbabwe
    title: Great Zimbabwe declines; Khami and Mutapa rise
    keyframe: true
    lenses: [population, governance, religion]
    summary: >-
      During the 1400s Great Zimbabwe lost its place as the region's main center, while Khami in the
      southwest and Mutapa in the north grew. Shona tradition says people left because salt ran short;
      archaeologists also point to worn-out land and shifting trade.
    detail: >-
      Contested: UNESCO gives abandonment c.1450 (overpopulation, deforestation); Chirikure et al. (2013) show
      occupation into the 16th c. and probably the 17th; the overlap their abstract discusses is with
      Mapungubwe, not Khami. Explanations: land and resource exhaustion (the "salt" of tradition may stand for
      this), falling gold demand, new Zambezi trade routes. Fagan (GHA IV) gives environmental limits and a
      late-15th-c. decline. The salt tradition (Mutota leaving to find salt) is citation-only.
    evidence: [src-unesco-whc-great-zimbabwe, src-chirikure-2013-bayesian-gz, src-shona-oral-traditions, src-fagan-zambezi-limpopo]
    confidence: medium
    ap_topics: ["1.5", "1.7", "2.6"]

  - id: ev-mutapa-founding
    year: 1450
    approx: true
    place: pl-mutapa
    title: Nyatsimba Mutota founds Mutapa (tradition)
    keyframe: false
    lenses: [governance, religion]
    summary: >-
      Shona traditions say Nyatsimba Mutota led people north from the Zimbabwe plateau, found salt in Dande and
      founded the Mutapa kingdom. Historians accept a 15th-century founding but not an exact date.
    detail: 'Forward pointer. Beach: Mutota may be symbolic; Mudenge: traditions telescoped.'
    evidence: [src-shona-oral-traditions, src-mudenge-munhumutapa, src-beach-shona]
    confidence: low
    ap_topics: ["1.5"]

sources:
  # ------------------------------------------------------------ PRIMARY
  - id: src-ibn-battuta-rihla
    title: Tuhfat al-nuzzar (the Rihla), East African section
    author: Ibn Battuta (dictated to Ibn Juzayy)
    author_from: Tangier, Morocco
    date: 1355-1356
    kind: primary
    type: travel-geography
    voice: regional-outsider
    happ:
      historical_situation: Dictated in Fez after decades of travel; describes a voyage down the coast about 1331.
      audience: Marinid sultan Abu Inan and his court in Fez.
      purpose: Record and entertain; display the reach of Islam and the author's piety, learning and patrons.
      point_of_view: Maliki jurist from Morocco judging coastal practice by North African norms; brief stays (one night at Mombasa); reports Sofala only by hearsay.
    citation: >-
      Ibn Battuta, Travels in Asia and Africa 1325-1354, trans. H.A.R. Gibb (Routledge, 1929), pp. 110-112
      (abridged); full: Gibb, Travels of Ibn Battuta vol. 2 (Hakluyt Society, 1962); Hamdun and King, Ibn Battuta
      in Black Africa (Markus Wiener); Freeman-Grenville, The East African Coast: Select Documents (1975), pp. 31-32.
    url: https://sourcebooks.web.fordham.edu/Halsall/source/ibnbattuta-africa14C.asp
    access: open-url
    verification: web-checked
    notes: >-
      Web-checked against the Gibb 1929 abridgment (Fordham), a Gibb 1958 excerpt (Lafayette exhibit,
      https://exhibits.lafayette.edu/s/museumstudies/item/27529: Mogadishu ruler Abu Bakr of Barbara origin,
      speaks Maqdishi and Arabic), and the Freeman-Grenville extract on slaves (medievalslavery.org). The
      Shafi'i statement for Mombasa and the holy-war phrasing for Kilwa come from Hamdun and King as quoted at
      https://sacredfootsteps.com/2023/07/03/ibn-battuta-in-east-africa/ ; check in a full edition. The 1929
      abridgment uses a pejorative word for Kilwa's mainland neighbors; paraphrase it in class materials.

  - id: src-kilwa-chronicle-arabic
    title: Kitab al-Sulwa fi akhbar Kulwa (Kilwa Chronicle, Arabic version)
    author: Anonymous Kilwa author(s); 1877 copy by Shaykh Abdullah ibn Musbah al-Suwafi
    author_from: Kilwa (copy made in Zanzibar)
    date: c.1520-1550 (composition); 1877 (surviving copy)
    kind: primary
    type: chronicle-local
    voice: insider
    happ:
      historical_situation: Written during Kilwa's succession crisis after the Portuguese intervention of 1505-1512; recopied for Sultan Barghash of Zanzibar in 1877.
      audience: Kilwa's ruling lineages and Muslim learned elite; in 1877, the Omani-Zanzibari court.
      purpose: Legitimize a royal line by tracing it to a Shirazi founder and a sharifian dynasty; present Kilwa as Muslim and urban in contrast to the mainland.
      point_of_view: Court insider; dynastic partisan; Islamic frame for local history; possible 19th-c. Omani edits.
    citation: >-
      British Library Or. 2666. Ed. S. Arthur Strong, "The History of Kilwa," Journal of the Royal Asiatic
      Society (1895). English typescript translation: SOAS MS 53501.
    url: null
    access: library
    verification: citation-only
    notes: Composition and manuscript facts web-checked via Arabahmadi 2023 abstract and Saad 1979 abstract.

  - id: src-kilwa-chronicle-barros
    title: Kilwa Chronicle, Portuguese version (in Decadas da Asia, Dec. I, liv. 8, cap. 6)
    author: Kilwa informants, as compiled by Joao de Barros
    author_from: Kilwa / Lisbon
    date: 1552 (publication); possibly composed 1505-1512
    kind: primary
    type: chronicle-local
    voice: insider
    happ:
      historical_situation: Portuguese occupation of Kilwa (1505-1512) and its aftermath.
      audience: Portuguese officials and readers of Barros's imperial history.
      purpose: For the Kilwa informants, to state dynastic claims to the new power; for Barros, to explain the lands Portugal entered.
      point_of_view: Insider genealogy filtered through a distant-outsider editor with imperial interests.
    citation: Joao de Barros, Da Asia, Decada I (Lisbon, 1552).
    url: null
    access: library
    verification: citation-only
    notes: Saad (1979) suggests it was composed quickly for the Portuguese during the occupation.

  - id: src-pate-chronicle
    title: Pate Chronicle (Habari za Pate)
    author: Pate court tradition; recited by Bwana Kitini (Muhammad bin Fumo Omar Nabhani)
    author_from: Pate and Lamu
    date: lost original; copies 1903 onward
    kind: primary
    type: chronicle-local
    voice: insider
    happ:
      historical_situation: Written down in the colonial era from a memorized text of the deposed Nabhani dynasty.
      audience: Lamu officials (the 1903 copy was ordered by the liwali of Lamu) and British administrators.
      purpose: Legitimize Nabhani claims to rule and to past greatness.
      point_of_view: Dynastic insider; telescopes and inflates early history.
    citation: >-
      Stigand, The Land of Zinj (1913); Werner, Journal of the African Society (1914-15); M. Tolmacheva, The
      Pate Chronicle (Michigan State University Press, 1993).
    url: null
    access: book
    verification: citation-only
    notes: Facts about versions checked via Wikipedia "Pate Chronicle" summary.

  - id: src-abu-al-fida-taqwim
    title: Taqwim al-buldan
    author: Abu al-Fida
    author_from: Hama, Syria
    date: c.1321
    kind: primary
    type: travel-geography
    voice: regional-outsider
    happ:
      historical_situation: Compiled by an Ayyubid prince-governor under the Mamluks from earlier geographies.
      audience: Learned Arabic readers.
      purpose: Systematic geography of the known world.
      point_of_view: Never visited East Africa; relays earlier reports.
    citation: Abu al-Fida, Taqwim al-buldan; extracts in Freeman-Grenville, The East African Coast (1975).
    url: null
    access: book
    verification: citation-only
    notes: His statement that Sofala's people were Muslim is taken from Samuel, African History Extra (Sofala).

  - id: src-yaqut-mujam-al-buldan
    title: Mu'jam al-buldan
    author: Yaqut al-Hamawi
    author_from: born in Byzantine Anatolia; worked in Baghdad, Merv, Aleppo
    date: c.1224-1228
    kind: primary
    type: travel-geography
    voice: regional-outsider
    happ:
      historical_situation: Geographical dictionary compiled from travelers' reports and books.
      audience: Learned Arabic readers.
      purpose: Alphabetical reference of places.
      point_of_view: Never visited the coast; relays merchants' accounts.
    citation: Yaqut, Mu'jam al-buldan; cited in Matveiev, UNESCO GHA IV ch. 18.
    url: null
    access: book
    verification: citation-only

  - id: src-kilwa-coinage
    title: Kilwa-type coins (copper, silver, gold)
    author: Kilwa sultans' mint
    author_from: Kilwa
    date: late 10th-16th c.
    kind: primary
    type: epigraphy
    voice: insider
    happ:
      historical_situation: Local coinage for a commercial island state.
      audience: Townspeople and traders of the southern coast.
      purpose: Announce the ruler's name and piety; provide small change; store value.
      point_of_view: Royal and Muslim self-presentation; names paired with rhyming pious phrases.
    citation: >-
      Perkins, Fleisher and Wynne-Jones 2014 (Azania 49:1); Chittick 1965; Brown, "Kilwa coinage" (1991,
      cited via Sutton).
    url: null
    access: library
    verification: citation-only

  - id: src-husuni-kubwa-inscription
    title: Husuni Kubwa palace inscription
    author: Court of al-Hasan ibn Sulayman
    author_from: Kilwa
    date: c.1310-1333
    kind: primary
    type: epigraphy
    voice: insider
    happ:
      historical_situation: Building program of Kilwa's most powerful sultan.
      audience: Visitors and subjects.
      purpose: Assert royal authority with the title al-Malik al-Mansur.
      point_of_view: Royal.
    citation: Reported in Sutton 1997 and Chittick 1974.
    url: null
    access: library
    verification: citation-only

  - id: src-mogadishu-mosque-inscriptions
    title: Mogadishu mosque inscriptions (Jama'a minaret 636 AH/1238; Fakhr al-Din mihrab 1269)
    author: Mogadishu rulers and builders
    author_from: Mogadishu
    date: 1238; 1269
    kind: primary
    type: epigraphy
    voice: insider
    happ:
      historical_situation: Royal and communal mosque building in a wealthy Muslim port.
      audience: Worshippers and visitors.
      purpose: Record the founder and date; display piety.
      point_of_view: Ruling elite.
    citation: Matveiev, GHA IV ch. 18; Pradines, Historic Mosques in Sub-Saharan Africa (2022).
    url: null
    access: library
    verification: citation-only
    notes: Dates checked via Matveiev (French edition) and Wikipedia mosque entries.

  - id: src-gedi-dated-tomb-inscription
    title: Inscription of the Dated Tomb, Gedi (A.H. 802 / 1399)
    author: Gedi family of the deceased
    author_from: Gedi
    date: 1399
    kind: primary
    type: epigraphy
    voice: insider
    happ:
      historical_situation: Funerary monument in a prosperous Swahili town.
      audience: Townspeople and descendants.
      purpose: Commemorate the dead in Arabic Muslim form.
      point_of_view: Patrician family.
    citation: Kirkman, Gedi (1975).
    url: null
    access: library
    verification: citation-only

  - id: src-ming-voyage-records
    title: Ming records of the treasure voyages (Mingshi; Fei Xin, Xingcha shenglan, 1436)
    author: Ming officials; Fei Xin
    author_from: Ming China
    date: 1436 (Fei Xin); 1739 (Mingshi)
    kind: primary
    type: travel-geography
    voice: distant-outsider
    happ:
      historical_situation: Records of the Yongle and Xuande emperors' fleets (1405-1433).
      audience: Ming court and later officials.
      purpose: Record tributary relations; display imperial reach.
      point_of_view: Frames all foreign states as tributaries of the Ming.
    citation: Fei Xin, Xingcha shenglan, trans. Mills and Ptak (1996); Mingshi.
    url: null
    access: book
    verification: citation-only
    notes: Voyage stops checked via Wikipedia "Ming treasure voyages" summary of Dreyer and Pelliot.

  - id: src-shen-du-giraffe-painting
    title: Tribute giraffe with attendant (painting with eulogy)
    author: Shen Du
    author_from: Ming court, Nanjing
    date: 1414
    kind: primary
    type: material-culture
    voice: distant-outsider
    happ:
      historical_situation: Arrival of a giraffe at the Yongle court.
      audience: Emperor and court.
      purpose: Celebrate an auspicious qilin as a sign of the emperor's virtue.
      point_of_view: Chinese cosmology; Malindi appears only as a tributary.
    citation: Shen Du, Tribute Giraffe with Attendant (later copy, Philadelphia Museum of Art).
    url: null
    access: book
    verification: citation-only

  - id: src-pegado-barros-zimbabwe
    title: Portuguese descriptions of Great Zimbabwe (Vicente Pegado 1531, via Barros 1552)
    author: Vicente Pegado; Joao de Barros
    author_from: Sofala garrison; Lisbon
    date: 1531; 1552
    kind: primary
    type: travel-geography
    voice: distant-outsider
    happ:
      historical_situation: Portuguese at Sofala seeking control of the gold trade.
      audience: Portuguese crown and readers.
      purpose: Describe the gold lands; later fitted to Ophir and Prester John stories.
      point_of_view: Secondhand, from Swahili traders; Barros reports the "Moorish" merchants could not read an inscription or name the builders.
    citation: Barros, Da Asia, Dec. I (1552); summarized in Zimbabwe Field Guide.
    url: null
    access: book
    verification: citation-only

  - id: src-shona-oral-traditions
    title: Shona oral traditions of the Mutapa founding and Great Zimbabwe's decline
    author: Shona (Karanga, Korekore) tradition-bearers, spirit mediums and royal houses
    author_from: Zimbabwe plateau
