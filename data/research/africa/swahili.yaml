      mostly through male lines, mostly Persian-related; admixture began c.AD 1000, matching the spread of
      Islam on the coast. The authors call Kiswahili an African Bantu language with Asian loanwords and suggest
      immigrant men's children took their mothers' language. African ancestry averaged 74% at Kilwa. This
      supports intermarriage within African towns, not colonization; the paper's own phrase is ongoing
      cultural mixing. Note: some readers took the paper as confirming the Kilwa Chronicle's Shirazi story;
      the authors say only that Persian-related ancestry is consistent with it.
