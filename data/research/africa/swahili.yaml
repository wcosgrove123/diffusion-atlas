    location: {lat: -8.957, lon: 39.512}
    span: {start: 1000, end: 1505, approx: true}
    parent: null
    geometry_note: >-
      Island town off the southern Tanzanian coast. Core: Kilwa Kisiwani island and neighboring Songo Mnara
      (founded late 14th c.) and Sanje ya Kati. Hegemony, strongest c.1300-1350, over the Mafia archipelago
      (Kisimani Mafia, Kua) and the gold port of Sofala, where Kilwa appointed a governor. Mainland opposite
      (Kilwa Kivinje area) belonged to non-Muslim farming peoples whom Kilwa traded with and raided. First
      coral buildings and coins at the end of the 10th c. (Horton et al. 2022). Portuguese sack 1505.
    basemap_match: ["Kilwa Sultanate", "Kilwa"]
    polity_profile:
      - year: 1330
        base: COM
        flow: MKT
        membership: [PLACE, FAITH]
        ruled_not_counted: enslaved people taken from the mainland; non-Muslim mainland neighbors who were raided
        standing: SOV
        shape: CENTRAL
        rulers: ONE
        right: [DESCENT, DIVINE]
        flag: >-
          The Mahdali founder al-Hasan ibn Talut took power by force (VICTORY in practice), while the dynasty
          claimed descent from the Prophet's family. Kilwa's hold on Sofala and Mafia makes the shape partly
          IMPERIAL.
      - year: 1430
        base: COM
        flow: MKT
        membership: [PLACE, FAITH]
        ruled_not_counted: enslaved agricultural and household workers
        standing: SOV
        shape: CENTRAL
        rulers: FEW
        right: [DESCENT, DIVINE]
        flag: >-
          Sultans kept the title, but in the 15th c. amirs (governors) and a council of patricians and lesser
          royals made and unmade sultans (Saad 1979). Claim ONE, practice FEW.
    evidence: [src-horton-2022-kilwa-chronology, src-chami-pre-islamic-kilwa, src-matveiev-swahili-civilization, src-unesco-whc-kilwa, src-saad-1979-kilwa-historiography, src-samuel-ahe-kilwa-timeline]
