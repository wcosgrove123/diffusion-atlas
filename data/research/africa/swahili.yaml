religion_profiles:
  # ------------------------------------------------------------------ Kilwa
  - id: rp-kilwa-court-1200-1277
    place: pl-kilwa
    span: {start: 1200, end: 1277, approx: true}
    stratum: court
    community_name: null
    traditions:
      - {family: abrahamic, tradition: islam, branch: sunni-unspecified, share: dominant, local_form: "sultans named on coins with pious rhyming phrases; Friday mosque"}
    relation: exclusive
    basis: inferred
    summary: >-
      Kilwa's first ruling line, remembered as "Shirazi," minted coins in Arabic and built a Friday mosque.
      Only their public Muslim practice left evidence.
    detail: >-
      Evidence: copper coins naming rulers such as Ali ibn al-Hasan (types in circulation for centuries;
      Chittick 1965 placed him c.1200, Horton et al. 2022 put the first coins at the end of the 10th c.), and
      the 11th-12th c. northern prayer hall of the Great Mosque, enlarged in the 13th c. The Kilwa Chronicle,
      written about 300 years later, calls this line Persian from Shiraz; current scholarship (Spear, Pouwels,
      Allen, Horton) reads that as a status claim by an African Muslim lineage, possibly with Gulf ancestry
      through marriage. Legal school is not attested before Ibn Battuta. Whether the court also kept non-Islamic
      ritual is not documented either way, hence the flag.
    evidence: [src-kilwa-coinage, src-chittick-1965-shirazi, src-horton-2022-kilwa-chronology, src-spear-1984-shirazi]
    confidence: medium
    flag: Exclusive reflects only what coins and mosques record; private or royal non-Islamic ritual is undocumented, not disproven.

  - id: rp-kilwa-court-1277-1450
    place: pl-kilwa
    span: {start: 1277, end: 1450, approx: true}
    stratum: court
    community_name: null
    traditions:
      - {family: abrahamic, tradition: islam, branch: sunni-shafii, share: dominant, local_form: "sharifian (Mahdali) dynasty; royal hajj; patronage of visiting sharifs and scholars"}
    relation: exclusive
    basis: attested
    summary: >-
      After about 1277 the Mahdali sultans, who claimed descent from the Prophet's family, made Kilwa's court a
      showcase of Sunni Islam. Ibn Battuta, a Moroccan visitor, reports that Sultan al-Hasan gave a fifth of
      his war booty to religious causes.
    detail: >-
      The Kilwa Chronicle names al-Hasan ibn Talut as founder of the new line; its date c.1277 rests on
      Freeman-Grenville's reading of regnal years and could be a generation later (Chittick 1965 saw a cultural
      break late 13th/early 14th c.). Al-Hasan ibn Sulayman (Abu al-Mawahib, "father of gifts," r. c.1310-1333)
      made the hajj, reportedly studied in Aden, built Husuni Kubwa and domed the Great Mosque. Ibn Battuta
      (1331) describes him rewarding sharifs and pious visitors and campaigning against non-Muslim mainland
      neighbors; Ibn Battuta's framing of these raids as holy war is his own Maliki traveler's lens. Shafi'i
      affiliation is reported for the coast in the full Rihla (Hamdun and King translation, for Mombasa) and
      in later practice; check the Kilwa passage in a full translation. The brief asked about Hadrami scholars:
      the Mahdali link is to Yemen (the Ahdal/Mahdali sharifs), and the large Hadrami (Ba Alawi) scholarly
      migration to the coast is mostly 16th c. and later, so "Hadrami scholars at Kilwa before 1450" is not
      supported by what I could check.
    evidence: [src-ibn-battuta-rihla, src-kilwa-chronicle-arabic, src-sutton-kilwa, src-pouwels-horn-crescent, src-chittick-1965-shirazi]
    confidence: medium
    flag: Shafi'i label for Kilwa itself needs a check in a full Rihla translation.

  - id: rp-kilwa-urban-1200-1300
    place: pl-kilwa
    span: {start: 1200, end: 1300, approx: true}
    stratum: urban
    community_name: null
    traditions:
      - {family: abrahamic, tradition: islam, branch: sunni-unspecified, share: significant, local_form: null}
      - {family: local, tradition: indigenous, branch: other, share: unknown, local_form: "Swahili mizimu (ancestral spirits) and spirit (pepo, jini) practice; known from later ethnography, inferred for this period"}
    relation: plural
    basis: projected
    summary: >-
      Kilwa's merchants and stone-house families were Muslim, while most townspeople lived in earthen houses
      and their religious practice is unclear. One UNESCO historian argues Islam spread from merchants to
      the old nobility to ordinary people over generations.
    detail: >-
      Matveiev (UNESCO GHA IV) argues conversion on the coast was voluntary, without organized missions, and
      that Islam coexisted with older cults; he gives the order merchants, then old nobility, then commoners.
      Pouwels describes coastal Islam before 1800 as shaped by its African setting, absorbing local ideas.
      Medieval evidence for mizimu practice specifically is indirect (later ethnography; deposits of coins and
      beads in houses and graves at Songo Mnara in the next span). Share of the local tradition set to unknown
      on purpose.
    evidence: [src-matveiev-swahili-civilization, src-pouwels-horn-crescent]
    confidence: low
    flag: null

  - id: rp-kilwa-urban-1300-1450
    place: pl-kilwa
    span: {start: 1300, end: 1450, approx: true}
    stratum: urban
    community_name: null
    traditions:
      - {family: abrahamic, tradition: islam, branch: sunni-shafii, share: dominant, local_form: null}
      - {family: local, tradition: indigenous, branch: other, share: unknown, local_form: "Swahili mizimu (ancestral spirits); coins and carnelian beads buried in house foundations and near graves at Songo Mnara"}
    relation: plural
    summary: >-
      By the 1300s most townspeople of Kilwa and Songo Mnara were Muslims who prayed in many neighborhood
      mosques. They also buried coins in house foundations and cared for graves in ways that point to local
      ideas about ancestors and place.
    detail: >-
      Songo Mnara (founded late 14th c.) had six mosques and four cemeteries for a small town. Perkins,
      Fleisher and Wynne-Jones (2014) excavated more than 300 Kilwa-type copper coins with a carnelian
      necklace in a stonehouse foundation, reading it as building value into the house; other coins lie near
      graves, possibly as memorials. This is the kind of practice the taxonomy calls plural: the same people use
      Islam for prayer and law and local practice for house, lineage and the dead. Ibn Battuta describes the
      majority of Kilwa's people as Zanj (local Africans) with facial tattoo marks, which itself shows that
      Kilwa's Muslims were Africans.
    evidence: [src-perkins-2014-songo-mnara-coins, src-wynne-jones-fleisher-coins-context, src-ibn-battuta-rihla, src-matveiev-swahili-civilization]
    confidence: medium
    flag: null

