# Research file: East African (Swahili) coast, Mogadishu to Sofala, plus the interior gold partner
# (Great Zimbabwe, with Mapungubwe before it and Mutapa after it). Africa module, 1200-1450.
# Owner: swahili. Written 2026-10-14.
#
# Perspective notes for the coordinator:
# - Swahili society is treated as African, Bantu-speaking and cosmopolitan. The colonial-era picture of
#   "Arab" or "Persian" colonies (Strandes, Coupland, Kirkman's 1954 title "The Arab City of Gedi",
#   early Chittick) is recorded as historiography, not as fact.
# - The Shirazi origin stories (Kilwa Chronicle, Pate Chronicle, family genealogies) are insider sources
#   with their own purposes (claims of rank, legitimacy, and Islamic credentials), read with HAPP.
# - Ancient DNA (Brielle et al. 2023) shows real Persian-related and Indian-related male ancestry mixing
#   with African women from about AD 1000. That supports contact and intermarriage, not colonization:
#   language, most ancestry, and the towns themselves are African.
# - Great Zimbabwe is the clean control case: deep trade with Muslim merchants, no trace of Islam.

