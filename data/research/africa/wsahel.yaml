events:
  - id: ev-gao-royal-epitaph
    year: 1100
    approx: true
    place: pl-gao
    title: Earliest dated royal gravestone at Gao-Saney
    keyframe: false
    lenses: [religion, language]
    summary: >
      A king of Gao named Muhammad was buried around 1100 under an Arabic gravestone of marble carved in
      Almeria, Spain. Muslim kingship on the Niger River is older than Mali, though scholars still debate
      the exact dates.
    detail: >
      Date per the commonly cited reading of the earliest royal marble stele (about 1100, with successors
      about 1110 and 1120); approx because I did not see the inscription edition (Moraes Farias 2003).
      Sources conflict: Cissoko (UNESCO IV p. 214) cites a quartz stele for a Muhammad who died 1103 and a
      royal daughter Hawa (1140); the Wikipedia Gao-Saney page says end of 12th / start of 13th c. Check
      Moraes Farias before fixing the year.
    evidence: [src-gao-saney-stelae, src-moraes-farias-inscriptions]
    confidence: medium
    ap_topics: ["1.2", "2.4"]

  - id: ev-kirina
    year: 1235
    approx: true
    place: pl-mali
    title: Battle of Kirina, Sunjata defeats Sumaoro
    keyframe: true
    lenses: [religion, governance]
    summary: >
      Mande tradition says Sunjata Keita's coalition defeated Sumaoro Kante of Sosso at Kirina, founding
      Mali. The epic credits the victory to hunters' secrets and the betrayal of Sumaoro's protective taboo.
    detail: >
      1235 comes from Delafosse's chronology, which Niane calls relative; Niane places the war 1220-1235
      and notes the battlefield is hard to locate. Ibn Khaldun confirms Mari Jata conquered the Susu. The
      tradition's Muslim framing (Sunjata as Bilal's descendant) and Mande framing (nyama, sorcery) coexist.
    evidence: [src-niane-unesco-mali, src-niane-sundiata, src-ibn-khaldun-ibar, src-cisse-kamissoko-grande-geste]
    confidence: medium
    ap_topics: ["1.5"]

  - id: ev-uli-hajj
    year: 1265
    approx: true
    place: pl-mali
    title: Mansa Uli makes the pilgrimage to Mecca
    keyframe: false
    lenses: [religion]
    summary: >
      Ibn Khaldun reports that Sunjata's son Mansa Uli made the hajj (the pilgrimage to Mecca) while Baybars
      ruled Egypt, between 1260 and 1277. Mali's royal ties to Mecca and Cairo began half a century before
      Mansa Musa.
    detail: >
      Ibn Khaldun: during Baybars's reign (1260-1277); year is a midpoint placeholder.
    evidence: [src-ibn-khaldun-ibar, src-niane-unesco-mali]
    confidence: medium
    ap_topics: ["1.2", "1.5"]

  - id: ev-musa-hajj
    year: 1324
    approx: false
    place: pl-mali
    title: Mansa Musa's hajj
    keyframe: true
    lenses: [religion, knowledge, architecture]
    summary: >
      Mansa Musa reached Cairo in July 1324 on his way to Mecca, and al-Umari, a Cairo official, reports
      that he gave away so much gold that its value in Egypt fell. He returned with scholars, books and
      al-Sahili, a poet from Muslim Spain.
    detail: >
      al-Umari (Levtzion & Hopkins pp. 269-273): Musa refused to kiss the ground before the sultan, saying he
      bowed only to God, and the mithqal fell from 25 to about 22 dirhams. Schultz argues the drop was within
      normal fluctuation. Musa's account to Cairo of his predecessor's Atlantic voyage is also from al-Umari.
    evidence: [src-al-umari-masalik, src-niane-unesco-mali, src-gomez-african-dominion]
    confidence: high
    ap_topics: ["1.2", "1.5", "2.4", "2.5"]

  - id: ev-musa-gao-timbuktu
    year: 1325
    approx: true
    place: pl-timbuktu
    title: Musa's return through Gao and Timbuktu; mosques founded
    keyframe: false
    lenses: [architecture, religion]
    summary: >
      On his way home Musa ordered mosques at Gao and Timbuktu, including Timbuktu's Djinguereber. Mali's
      rule over the Niger bend towns was now on display.
    detail: Djinguereber dated 1325-1327 in different sources; see ex-djinguereber.
    evidence: [src-cissoko-unesco-songhay, src-niane-unesco-mali]
    confidence: medium
    ap_topics: ["1.5", "2.5"]

  - id: ev-al-umari-goldfields
    year: 1337
    approx: true
    place: pl-bambuk-bure
    title: Al-Umari records how Mali handled the gold country
    keyframe: false
    lenses: [religion, governance]
    summary: >
      Writing in Cairo, al-Umari recorded a Moroccan informant's report that Mali's kings left the gold
      miners unconverted and took tribute from them instead. If his report is accurate, it shows Mali's
      kings choosing not to force Islam on their subjects.
    detail: >
      Masalik al-absar's Mali section dates about 1337-38 (Levtzion & Hopkins, via secondary citation).
      The passage (Kenny ch.11) is on the authority of Abu 'Uthman Sa'id al-Dukkali, who lived 35 years in
      Mali; he attributes the belief to 'the kings of this kingdom', not to Musa (fact-check 2026-10-14).
    evidence: [src-al-umari-masalik]
    confidence: medium
    ap_topics: ["1.5", "2.4"]

  - id: ev-mossi-sack-timbuktu
    year: 1337
    approx: true
    place: pl-timbuktu
    title: Mossi raiders sack Timbuktu
    keyframe: false
    lenses: [religion]
    summary: >
      The Tarikh al-Sudan, a Timbuktu chronicle written in the 1650s, reports that a Mossi army looted and
      burned Timbuktu while Mali ruled it, around 1337. Historians debate the date and whether these
      raiders were ancestors of the later Mossi kingdoms.
    detail: >
      Usually dated about 1337 (Izard); other modern dates range 1333-1343; al-Sadi links it to the era of
      Kankan Musa. Whether these raiders are the ancestors of the Volta Mossi kingdoms is debated (Izard).
    evidence: [src-al-sadi-tarikh-sudan, src-izard-unesco-niger-volta]
    confidence: low
    ap_topics: ["1.5"]

  - id: ev-ibn-battuta-mali
    year: 1352
    approx: false
    place: pl-mali
    title: Ibn Battuta visits Walata and Mansa Sulayman's court
    keyframe: true
    lenses: [religion, social, knowledge]
    summary: >
      The Moroccan traveler Ibn Battuta spent 1352-53 in Mali, praising its prayer and safety while
      condemning Mande court rituals and women's freedom. His account is the fullest outsider view of Mali.
    detail: >
      Reached Walata about April 1352, the capital in mid-1352 (June or July, by different chronologies),
      stayed about eight to nine months, left via Timbuktu and Gao (1353). Praises: 'There is complete
      security in their country' (Gibb trans.). Condemns: dust-pouring, masked jeliw, unclothed servants,
      women's companions. Dictated to Ibn Juzayy for the Marinid court; some scholars question parts of
      its firsthand reliability.
    evidence: [src-ibn-battuta-rihla, src-niane-unesco-mali]
    confidence: high
    ap_topics: ["1.2", "1.5", "2.4", "2.5"]

  - id: ev-jolof-founded
    year: 1350
    approx: true
    place: pl-jolof
    title: Jolof emerges as the Wolof overlord kingdom
    keyframe: false
    lenses: [governance, religion]
    summary: >
      Wolof tradition says Ndiadiane Ndiaye united the Wolof kingdoms into Jolof, which broke free of Mali
      around the later 1300s, though some historians date it earlier. Different tellers give the founder
      Muslim, Fulbe or Serer roots, each a claim about where the right to rule came from.
    detail: About 1350-1360 (Ogot); Boulegue and others argue for an earlier start.
    evidence: [src-boulegue-grand-jolof, src-barry-senegambia]
    confidence: low
    ap_topics: ["1.5"]

  - id: ev-sunni-independence
    year: 1430
    approx: true
    place: pl-songhay-gao
    title: Gao breaks from Mali under the Sunni dynasty
    keyframe: false
    lenses: [governance, religion]
    summary: >
      Songhay princes of the Sunni line broke Gao free of Mali's rule, though historians disagree on when,
      with dates from the 1300s to the early 1400s. Later sources describe their kings combining Islam
      with Songhay spiritual power.
    detail: >
      Chronology unresolved: Ali Kolon's 14th-c. revolt; lasting independence under Sunni Sulayman Dama in
      the first half of the 15th c.; Cissoko's chapter gives both a 13th-c. and an end-14th-c. date.
    evidence: [src-cissoko-unesco-songhay, src-al-sadi-tarikh-sudan]
    confidence: low
    ap_topics: ["1.5"]

  - id: ev-tuareg-take-timbuktu
    year: 1433
    approx: true
    place: pl-timbuktu
    title: Tuareg take Timbuktu and Walata from Mali
    keyframe: true
    lenses: [governance, knowledge]
    summary: >
      Tuareg forces under Akil ag Malwal took control of Timbuktu around 1433 as Mali weakened. The city's
      Muslim scholars kept teaching under new masters.
    detail: >
      Hunwick 1999 (1433-34; names Akil, not checked here); Ly-Tall p. 200 (about 1433, also Walata and Nema; does not
      name Akil) is the web-checked support. al-Sa'di is citation-only for this passage. Songhay takes Timbuktu in
      1468.
    evidence: [src-ly-tall-unesco-mali-decline, src-al-sadi-tarikh-sudan]
    confidence: medium
    ap_topics: ["1.5", "2.4"]

sources:
  # ------------------------------------------------------------ primary
  - id: src-ibn-battuta-rihla
    title: Tuhfat al-nuzzar (the Rihla), West African section
    author: Ibn Battuta (dictated to Ibn Juzayy)
    author_from: Tangier, Morocco
    date: 1355-1356
    kind: primary
    type: travel-geography
    voice: regional-outsider
    happ:
      historical_situation: Written for the Marinid court after his 1352-53 journey to Walata, Mali's capital, Timbuktu and Gao.
      audience: Marinid sultan Abu Inan and his court in Fez.
      purpose: Record and entertain; display the reach of Islam and the author's piety and learning.
      point_of_view: Maliki jurist from Morocco judging West African practice by North African norms.
    citation: "Ibn Battuta. In Hamdun and King, eds., Ibn Battuta in Black Africa (Markus Wiener, 1994); excerpt in H.A.R. Gibb trans., Travels in Asia and Africa 1325-1354 (1929), pp. 319-334."
    url: https://digfir-published.macmillanusa.com/strayer2e/strayer2e_ch7_24.html
    access: open-url
    verification: citation-only
    notes: "The Gibb excerpt at the url was read (Walata women and inheritance, court ceremony, Friday prayer, security) and supports those claims; the Timbuktu (Masufa majority, al-Sahili's grave), Gao and Taghaza-Walata passages cited in this file are not in it, so the record is citation-only overall. Levtzion & Hopkins Corpus has the standard translation."

  - id: src-al-umari-masalik
    title: Masalik al-absar fi mamalik al-amsar (Mali section)
    author: Ibn Fadl Allah al-Umari
    author_from: Damascus and Cairo (Mamluk chancery)
    date: about 1337-1338
    kind: primary
    type: travel-geography
    voice: regional-outsider
    happ:
      historical_situation: Mamluk official writing about 12 years after Musa's 1324 visit, from Cairo informants who had met him.
      audience: Mamluk administrators and educated readers.
      purpose: An administrative encyclopedia of the world's realms and their relations with Egypt.
      point_of_view: Cairo bureaucrat impressed by Mali's wealth, interested in protocol and the gold trade.
    citation: "al-Umari, in N. Levtzion and J.F.P. Hopkins, eds., Corpus of Early Arabic Sources for West African History (Cambridge UP, 1981; Markus Wiener 2000), Cairo visit pp. 269-273."
    url: https://worldhistorycommons.org/al-umaris-account-mansa-musas-visit-cairo
    access: open-url
    verification: citation-only
    notes: "Cairo visit passage web-checked via World History Commons excerpt. The gold-country passage is in Kenny ch.11 (https://dhspriory.org/kenny/NWAfr/a11.htm), confirmed by the 2026-10-14 fact-check: its informant is Abu 'Uthman Sa'id al-Dukkali, who lived 35 years in Mali, not Musa."

  - id: src-al-bakri-masalik
    title: Kitab al-masalik wa'l-mamalik (West African sections)
    author: Abu Ubayd al-Bakri
    author_from: Cordoba, al-Andalus
    date: 1068
    kind: primary
    type: travel-geography
    voice: distant-outsider
    happ:
      historical_situation: Compiled in al-Andalus from merchants' reports and earlier archives; al-Bakri never visited West Africa.
      audience: Andalusi courtly and learned readers.
      purpose: Geography of routes and kingdoms, with attention to Islam's reach.
      point_of_view: Andalusi Muslim scholar relying on Muslim traders' accounts.
    citation: "al-Bakri, in Levtzion and Hopkins, eds., Corpus of Early Arabic Sources for West African History (1981)."
    url: null
    access: book
    verification: citation-only
    notes: Malal conversion and Ghana twin-town passages known via Levtzion's summaries; translation itself not read.

  - id: src-ibn-khaldun-ibar
    title: Kitab al-Ibar (history of the kings of Mali)
    author: Ibn Khaldun
    author_from: Tunis; worked in Fez, Granada and Cairo
    date: about 1377-1393
    kind: primary
    type: travel-geography
    voice: regional-outsider
    happ:
      historical_situation: Written in Cairo and the Maghrib from informants including Mali envoys and a Takrur-born jurist.
      audience: Learned Muslim readers and patrons.
      purpose: Universal history of dynasties; the only medieval Arabic king list for Mali.
      point_of_view: North African historian-jurist; sympathetic to Mali's Muslim rulers.
    citation: "Ibn Khaldun, in Levtzion and Hopkins, eds., Corpus of Early Arabic Sources for West African History (1981)."
    url: null
    access: book
    verification: citation-only
    notes: Used for Mari Jata, Uli's hajj under Baybars, Sakura, al-Sahili's audience hall payment.

  - id: src-al-sadi-tarikh-sudan
    title: Tarikh al-Sudan
    author: Abd al-Rahman al-Sadi
    author_from: Timbuktu
    date: about 1655
    kind: primary
    type: chronicle-local
    voice: insider
    happ:
      historical_situation: Written under Moroccan (Arma) rule by a Timbuktu scholar-administrator, 60 years after Songhay's fall.
      audience: Timbuktu's scholarly and administrative elite.
      purpose: Record the region's dynasties and honor its scholars; mourn the lost Songhay order.
      point_of_view: Timbuktu Muslim scholar; hostile to Sunni Ali and to non-Muslim rulers; early sections rest on oral tradition.
    citation: "John O. Hunwick, Timbuktu and the Songhay Empire: al-Sadi's Tarikh al-Sudan down to 1613 and Other Contemporary Documents (Brill, 1999; 2nd ed. 2003)."
    url: null
    access: book
    verification: citation-only
    notes: Insider for Timbuktu, Djenne and Gao; closer to regional-outsider for Mali. Used via secondary citations (Kunburu, Mali's 99 attacks on Djenne, Mossi, Tuareg).

  - id: src-tarikh-al-fattash
    title: Tarikh al-Fattash
    author: attributed to Mahmud Kati and Ibn al-Mukhtar
    author_from: Timbuktu
    date: 17th c. (with 19th-c. interpolations)
    kind: primary
    type: chronicle-local
    voice: insider
    happ:
      historical_situation: Timbuktu chronicle compiled in the 17th c.; parts rewritten in the 19th c. to support Masina's Hamdallahi state.
      audience: Timbuktu and later Masina elites.
      purpose: Dynastic and scholarly history; later edited to legitimize new rulers.
      point_of_view: Timbuktu Muslim scholarship; its authorship and layers are debated.
    citation: "Tarikh el-Fettach, ed. and trans. O. Houdas and M. Delafosse (Paris, 1913)."
    url: null
    access: library
    verification: citation-only
    notes: Used only for its contrary claim that Djenne's chief was Mali's subordinate.

  - id: src-cadamosto-voyages
    title: Navigazioni (voyages to Senegambia)
    author: Alvise Cadamosto
    author_from: Venice (sailing for Portugal)
    date: 1455-1456 (written about 1460s)
    kind: primary
    type: travel-geography
    voice: distant-outsider
    happ:
      historical_situation: Venetian merchant on Portuguese-licensed voyages to the Senegal and Gambia rivers.
      audience: Italian and Portuguese readers interested in trade and discovery.
      purpose: Commercial reconnaissance and travel narrative.
      point_of_view: Christian European trader; relied on Wolof interpreters; judges religion by Christian norms.
    citation: "G.R. Crone, trans. and ed., The Voyages of Cadamosto (Hakluyt Society, 1937)."
    url: null
    access: book
    verification: needs-library
    notes: Budomel of Kajoor and his Muslim clerics; check passage before using in class.

  - id: src-niane-sundiata
    title: Soundjata ou l'epopee mandingue (Sundiata, an Epic of Old Mali)
    author: Mamadou Kouyate (jeli, performer); D.T. Niane (recorder and prose editor)
    author_from: Djeliba Koro near Siguiri, Guinea (performer); Conakry/Dakar (editor)
    date: recorded 1950s; published 1960 (Eng. trans. 1965)
    kind: primary
    type: oral-tradition
    voice: insider
    happ:
      historical_situation: Recorded on the eve of Guinea's independence by a Guinean historian from a Kouyate griot of the Siguiri region.
      audience: Originally Mande listeners; in print, francophone and later world readers.
      purpose: Preserve and honor the Mande founding story; in print, also a national-cultural statement.
      point_of_view: Kouyate jeli lineage, hereditary griots of the Keita; Niane rewrote it as literary prose.
    citation: "D.T. Niane, Soundjata ou l'epopee mandingue (Presence Africaine, 1960); Sundiata: An Epic of Old Mali, trans. G.D. Pickett (Longman, 1965)."
    url: https://takamtikou.bnf.fr/print/pdf/node/1345
    access: book
    verification: citation-only
    notes: BnF Takamtikou review confirms Mamadou Kouyate and the Siguiri region as the source.

  - id: src-cisse-kamissoko-grande-geste
    title: La grande geste du Mali
    author: Wa Kamissoko (jeli, Kirina, 1925-1976); Youssouf Tata Cisse (recorder, editor)
    author_from: Kirina, Mali (performer); Mali (editor)
    date: performances 1975-1976 (Bamako colloquia); published 1988 and 1991
    kind: primary
    type: oral-tradition
    voice: insider
    happ:
      historical_situation: Recorded at the Fondation SCOA colloquia in Bamako (1975, 1976) and in fieldwork; Kamissoko died 1976.
      audience: Malian and international historians at the colloquia; later francophone readers.
      purpose: Give the Kirina tradition of Mande history in full, with commentary.
      point_of_view: Kirina griot tradition (a different lineage and region from Niane's Kouyate).
    citation: "Y.T. Cisse and W. Kamissoko, La grande geste du Mali: des origines a la fondation de l'Empire (Karthala, 1988); Soundjata, la gloire du Mali (1991)."
    url: https://data.bnf.fr/11928740/wa_kamissoko/en.pdf
    access: book
    verification: citation-only
    notes: BnF record checked for Kamissoko's dates and titles; content not read.

  - id: src-conrad-sunjata-conde
    title: "Sunjata: A West African Epic of the Mande Peoples"
    author: Djanka Tassey Conde (jeli, performer); David C. Conrad (recorder, translator)
    author_from: Fadama, Guinea (performer); USA (translator)
    date: recorded 1994; published 2004
    kind: primary
    type: oral-tradition
    voice: insider
    happ:
      historical_situation: Performed for Conrad's tape recorder in Fadama, Guinea, over several sessions.
      audience: Local listeners present; in print, students and scholars.
      purpose: Recount Mande origins and clan histories; in print, a teaching edition.
      point_of_view: Conde jeli lineage of the upper Niger (Hamana), with strong Muslim-genealogy framing.
    citation: "David C. Conrad, ed. and trans., Sunjata: A West African Epic of the Mande Peoples (Hackett, 2004)."
    url: null
    access: book
    verification: citation-only
    notes: null

  - id: src-johnson-son-jara
    title: "Son-Jara: The Mande Epic"
    author: Fa-Digi Sisoko (jeli, performer); John William Johnson (recorder, translator)
    author_from: Kita region, Mali (performer)
    date: recorded 1968; 3rd ed. 2003
    kind: primary
    type: oral-tradition
    voice: insider
    happ:
      historical_situation: Recorded in Kita, Mali, in 1968.
      audience: Mande listeners; in print, students.
      purpose: Performance of the founding epic with genealogy.
      point_of_view: Kita jeli tradition; opens with a Muslim genealogy linking the Keita to Bilali.
    citation: "John William Johnson, Son-Jara: The Mande Epic, performed by Fa-Digi Sisoko (Indiana UP, 3rd ed. 2003)."
    url: null
    access: book
    verification: citation-only
    notes: Version with the Bilali genealogy opening; check before quoting.

  - id: src-birmingham-sumanguru-epic
    title: The Epic of Sumanguru Kante (performance by Abdoulaye Sako, 1997)
    author: Abdoulaye Sako (griot, performer); University of Birmingham 'Re-thinking Sunjata' project (editors)
    author_from: Mali (performer)
    date: performed 1997; edition with Brill
    kind: primary
    type: oral-tradition
    voice: insider
    happ:
      historical_situation: A rare griot epic told from Sumaoro's side, recorded in 1997 and edited with English translation.
      audience: Mande listeners; scholarly readers of the edition.
