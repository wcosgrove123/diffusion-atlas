      al-Aqib 1578-82. Its peak as a learning center is 16th c.; Cissoko (p. 234) describes it as the
      mosque of higher learning. Avoid 'University of Sankore' framing for 1350-1450.
    image_hint: "Wikimedia Commons search: Sankore Mosque Timbuktu"
    evidence: [src-cissoko-unesco-songhay, src-wikipedia-sankore]
    confidence: medium

  - id: ex-timbuktu-manuscripts
    name: Timbuktu manuscript libraries
    place: pl-timbuktu
    location: {lat: 16.775, lon: -3.007}
    span: {start: 1400, end: null, approx: true}
    lenses: [knowledge, language]
    summary: >
      Timbuktu's families and the Ahmed Baba Institute hold hundreds of thousands of manuscripts in Arabic and
      in African languages written in Arabic script (Ajami). Most were written long after 1450.
    detail: >
      Honest dating: collections range from late medieval to the 20th c., and the large majority are
      16th-19th c.; I found no securely dated pre-1450 manuscript in the accessible sources, so the span
      start is a placeholder. About 4,200 were destroyed in 2012-13 and most were evacuated to Bamako
      (Haidara, SAVAMA-DCI). Scholarship: Jeppie & Diagne eds. (2008).
    image_hint: "Wikimedia Commons search: Timbuktu manuscripts"
    evidence: [src-wikipedia-timbuktu-manuscripts, src-jeppie-diagne-timbuktu]
