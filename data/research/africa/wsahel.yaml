diffusions:
  # ------------------------------------------------------------ religion
  - id: df-islam-takrur-war-jabi
    lens: religion
    what: Islam and Islamic law at the Takrur court (pre-1200 baseline)
    from: [pl-sijilmasa]
    to: pl-takrur
    span: {start: 1030, end: 1041, approx: true}
    mechanism: hierarchical
    carriers: [merchant, religious-specialist, ruler]
    outcome: adoption
    summary: >
      Al-Bakri reports that King War Jabi of Takrur became Muslim and made his people follow Islamic law
      before 1041. It is one of the earliest recorded royal conversions south of the Sahara.
    detail: >
      Baseline before the module. Source of the teachers is not named; the Sijilmasa-Awdaghust caravan
      route is the likely channel (shown as from: Sijilmasa). Outcome 'adoption' follows al-Bakri's claim
      that the people converted; rural depth is unknown (see rp-takrur-rural-1200-1450).
    evidence: [src-al-bakri-masalik, src-levtzion-ancient-ghana-mali]
    confidence: medium
    ap_topics: ["1.2", "2.4"]

  - id: df-islam-malal-king
    lens: religion
    what: Conversion of the king of Malal (Mali's forerunner) after a drought
    from: [pl-ghana-wagadu]
    to: pl-mali
    span: {start: 1050, end: 1068, approx: true}
    mechanism: hierarchical
    carriers: [religious-specialist, merchant]
    outcome: elite-only
    summary: >
      Al-Bakri tells how a Muslim guest prayed for rain during a drought in Malal and the king converted when
      the rain came. In al-Bakri's account, the king and nobles became Muslim, but the common people did not.
    detail: >
      al-Bakri 1068 (Corpus); the story is summarized by Levtzion and in many readers. In al-Bakri the
      king also had the sacred objects broken and the specialists expelled, and later rulers bore the title
      al-muslimani (Niane p. 151 gives 'El-Moslemani'; Ibn Khaldun's Barmandana). The guest's origin is not
      stated; Ghana's Muslim merchant community is the likeliest network, hence from: Ghana. Note the
      story's shape: it is a contest of rain-power, the same currency as Mande ritual, which explains why
      it persuaded. Pre-1200 baseline.
    evidence: [src-al-bakri-masalik, src-levtzion-islam-africa, src-niane-unesco-mali]
    confidence: medium
    ap_topics: ["1.2", "1.5", "2.5"]

  - id: df-soninke-diaspora-islam
    lens: religion
    what: Soninke (Wangara) Muslim merchant-clerics dispersing south from Wagadu
    from: [pl-ghana-wagadu]
    to: pl-mali
    span: {start: 1100, end: 1250, approx: true}
    mechanism: relocation
    carriers: [merchant, religious-specialist, migrant]
    outcome: coexistence
    summary: >
      As Wagadu weakened and the Sahel dried, Soninke Muslim traders moved south to the Niger and the
      goldfields. They settled as separate Muslim communities among Mande farmers.
    detail: >
      Niane (pp. 142-143) on the Wangara/Jula/Wakore as merchant names and the Soninke spread toward the
      Niger; Gomez suggests stricter Islam after the 11th-c. crisis also pushed the diaspora. Soninke memory
      ties the dispersal to the death of the serpent Bida. Relocation with coexistence is the core pattern
      that later carried Islam to Djenne, Begho and Hausaland.
    evidence: [src-niane-unesco-mali, src-gomez-african-dominion, src-conrad-fisher-conquest]
    confidence: medium
    ap_topics: ["2.4", "2.5"]

  - id: df-islam-sosso-resisted
    lens: religion
    what: Islam's advance into Sosso-ruled lands, opposed by the Sosso kings (as tradition tells it)
    from: [pl-ghana-wagadu]
    to: pl-sosso
    span: {start: 1180, end: 1235, approx: true}
    mechanism: contagious
    carriers: [merchant, religious-specialist]
    outcome: resistance
    summary: >
      Mande epics present Sumaoro Kante of Sosso as a champion of Mande ancestral religion who resisted
      the Muslim traders and clerics of former Ghana. His defeat at Kirina is told as Sunjata's victory,
      not Islam's.
    detail: >
      Niane, p. 150 n. 18 and p. 151. Debated: the epic is told by Mali's griots, and some versions add a
      Muslim gloss later; a smiths' tradition makes Sumaoro an opponent of slave-raiding instead (n. 22).
      Students should ask whose story calls this a religious war.
    evidence: [src-niane-unesco-mali, src-conrad-oral-sources-links, src-birmingham-sumanguru-epic]
    confidence: low
    ap_topics: ["1.5", "2.5"]

  - id: df-mali-royal-hajj
    lens: religion
    what: Royal pilgrimage to Mecca by the mansas (Uli, Sakura, Musa)
    from: [pl-ext-hijaz, pl-cairo]
    to: pl-mali
    span: {start: 1260, end: 1325, approx: true}
    mechanism: hierarchical
    carriers: [pilgrim, ruler, scholar]
    outcome: elite-only
    summary: >
      Starting with Sunjata's son Mansa Uli, Mali's rulers made the pilgrimage to Mecca and came back with
      scholars, books and Mamluk contacts. Islam grew stronger at court and in the towns; no source
      describes the villages.
    detail: >
      Ibn Khaldun: Uli's hajj in Baybars's reign (1260-1277); Sakura killed on the way home; Musa's hajj
      1324-25 (al-Umari on Cairo, Levtzion & Hopkins pp. 269-273, read via World History Commons). Gomez
      notes the royal hajj also echoed the Mande hunter's quest for power abroad, so the journey carried
      meaning in both traditions.
    evidence: [src-ibn-khaldun-ibar, src-al-umari-masalik, src-gomez-african-dominion, src-niane-unesco-mali]
    confidence: high
    ap_topics: ["1.2", "1.5", "2.4", "2.5"]

