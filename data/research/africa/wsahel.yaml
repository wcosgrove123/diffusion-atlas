religion_profiles:
  # ------------------------------------------------------------ Mali
  - id: rp-mali-court-1235-1300
    place: pl-mali
    span: {start: 1235, end: 1300, approx: true}
    stratum: court
    community_name: null
    traditions:
      - family: local
        tradition: indigenous
        branch: other
        share: dominant
        local_form: "Mande: hunters' (donso) power and nyama, Komo-style power associations, blacksmith ritual, jeli praise of the mansa"
      - family: abrahamic
        tradition: islam
        branch: sunni-unspecified
        share: significant
        local_form: "Muslim clerical clans allied to the Keita (the mori kanda of Kurukan Fuga tradition); royal hajj"
    relation: plural
    basis: projected
    summary: >
      Sunjata's court drew its power from Mande hunters' and blacksmiths' knowledge while keeping Muslim
      allies and advisers. His son Mansa Uli made the pilgrimage to Mecca, so Islam was one tool among several.
    detail: >
      Niane (UNESCO IV, ch. 6, French ed. pp. 157-159) says Sunjata protected Muslims and had Muslim allies
      but that oral tradition remembers him as liberator of the Maninka, not a propagator of Islam; Gomez
      calls his Islam syncretic at best; Fage found nothing Muslim in the epic. Ibn Battuta claims Musa's
      grandfather converted, which may or may not mean Sunjata. Ibn Khaldun reports Mansa Uli's pilgrimage
      in Baybars's reign (1260-1277) and Sakura's hajj. Plural rather than syncretic because the evidence
      shows the two traditions serving different purposes (hajj prestige vs. hunter-king power), not a
      documented fused rite in this span.
    evidence: [src-niane-unesco-mali, src-ibn-khaldun-ibar, src-gomez-african-dominion, src-niane-sundiata]
    confidence: medium
    flag: null

  - id: rp-mali-court-1300-1450
    place: pl-mali
    span: {start: 1300, end: 1450, approx: true}
    stratum: court
    community_name: null
    traditions:
      - family: abrahamic
        tradition: islam
        branch: sunni-maliki
        share: dominant
        local_form: null
      - family: local
        tradition: indigenous
        branch: other
        share: significant
        local_form: "Mande royal ritual: jeli Dugha's praise performance, masked jeliw in bird costumes, dust-pouring before the mansa; Komo ritual objects"
    relation: syncretic
    basis: inferred
    summary: >
      Mansa Musa and Mansa Sulayman led Friday prayer and funded mosques, but court ceremonies kept Mande
      rituals of praise and power. Ibn Battuta, a Moroccan judge, admired the prayer and condemned the rest.
    detail: >
      Ibn Battuta (1352-53) praises Friday attendance and the qadi's children chained until they memorized
      the Qur'an, and condemns dust-pouring, the jeliw performing inside feathered bird figures, and women's
      dress. He judges by Maliki North African norms; what he calls un-Islamic is Mande royal protocol.
      Conrad (1992), as cited by Gomez, reports traditions that Musa brought objects from Mecca for Komo
      rituals, a fused practice; Gomez and Fauvelle describe the mansa as both pious sultan and master of
      Mande power. Niane (p. 178) calls the court's Islam a thin varnish, a judgment the teacher may want
      students to test. After 1360 the evidence thins (Ibn Khaldun ends about 1393; Portuguese sources cover
      only the Gambia provinces from 1455), so the 1360-1450 part of this span is inferred and lower
      confidence. basis is set to inferred for the whole profile because one profile carries one basis;
      1300-1360 is attested (Ibn Battuta, al-Umari). Splitting the span at 1360 would let each part carry
      its own basis.
    evidence: [src-ibn-battuta-rihla, src-gomez-african-dominion, src-conrad-fakoli, src-niane-unesco-mali, src-ly-tall-unesco-mali-decline]
    confidence: high
    flag: null

  - id: rp-mali-urban-1235-1324
    place: pl-mali
    span: {start: 1235, end: 1324, approx: true}
    stratum: urban
    community_name: null
    traditions:
      - family: abrahamic
        tradition: islam
        branch: sunni-unspecified
        share: significant
        local_form: "Wangara (Soninke-Mande) merchant-clerics"
      - family: local
        tradition: indigenous
        branch: other
        share: significant
        local_form: "Mande: craft-group ritual (numu smiths, jeliw), hunters' associations"
    relation: coexisting
    basis: inferred
    summary: >
      Mali's market towns probably had Muslim Wangara merchants and clerics living beside Mande artisans
      and hunters who kept their own rituals, each group with its own leaders. This picture is
      reconstructed from earlier and later sources, since no eyewitness describes these towns.
    detail: >
      Direct evidence for 13th-century towns is thin. The pattern is inferred from al-Bakri's earlier
      account of Ghana's separate Muslim town (1068), Niane's account of Wangara trading towns, and the
      Kurukan Fuga traditions that assign clerical clans and craft clans separate roles. Treat as a
      reasoned reconstruction, not an eyewitness picture.
    evidence: [src-niane-unesco-mali, src-al-bakri-masalik, src-wilks-juula]
    confidence: low
    flag: null

  - id: rp-mali-urban-1324-1450
    place: pl-mali
    span: {start: 1324, end: 1450, approx: true}
    stratum: urban
    community_name: null
    traditions:
      - family: abrahamic
        tradition: islam
        branch: sunni-maliki
        share: dominant
        local_form: "Friday mosques, Qur'an schools, qadis and khatibs"
      - family: local
        tradition: indigenous
        branch: other
        share: significant
        local_form: "Mande ritual specialists and nyamakala craft groups"
