    span: {start: 1327, end: null, approx: true}
    fabric_date: 1570
    lenses: [architecture, religion]
    summary: >
      Timbuktu's great Friday mosque was founded after Mansa Musa's pilgrimage, around 1325-1327. The
      earthen building standing today is the product of many rebuildings since.
    detail: >
      Founding traditionally 1325/1327. Attribution to al-Sahili is contested (Aradeon 1989; Hunwick 1990).
      Renovated under qadi al-Aqib from about 1570; limestone parts added in the 1960s; restored 2006-07;
      UNESCO World Heritage 1988. Teach as a 14th-c. foundation with a later fabric. fabric_date 1570 marks
      qadi al-Aqib's renovation, the oldest major layer of the standing building; later work (1960s,
      2006-07) is layered on top, so treat the year as approximate.
    image_hint: "Wikimedia Commons search: Djinguereber Mosque"
    evidence: [src-wikipedia-djinguereber, src-aradeon-al-sahili, src-niane-unesco-mali]
    confidence: high

