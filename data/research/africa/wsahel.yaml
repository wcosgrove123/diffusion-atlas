# Western Sahel & Senegambia (owner: wsahel)
# Africa 1200-1450 module, Diffusion Atlas. Researcher file; see docs/research-brief.md.
# Research date: 2026-10-14. The UNESCO General History of Africa vol. IV chapters were read in the
# French edition (Histoire generale de l'Afrique IV, 1985) via PDFs hosted at bokundoli.org; page numbers
# cited in detail fields are the French edition's and were reported from those PDFs.

places:
  # ---------------------------------------------------------------- polities
  - id: pl-mali
    name: Mali
    alt_names: [Manden, Manden Kurufaba, Malal (pre-1200 core principality in al-Bakri)]
    kind: polity
    region: western-sahel
    location: {lat: 11.95, lon: -8.30}
    span: {start: 1235, end: 1600, approx: true}
    parent: null
    geometry_note: >
      Core: upper Niger and Sankarani between Kangaba and Siguiri, with the Bure goldfield; Bambuk to the
      west. Greatest extent about 1330-1360 from the Gambia and Senegal rivers to Gao and Walata. Lost
      Timbuktu and Walata to the Tuareg about 1433 and Gao to the Sunni dynasty in the early 15th c.;
      shifted west toward the Gambia in the 15th c. (Ly-Tall). The capital's location is debated: see
      pl-niani. Label point placed in the Kangaba-Siguiri core, not at any one capital candidate.
    basemap_match: ["Mali Empire", "Mali"]
    polity_profile:
      - year: 1240
        base: AGR
        flow: EXT
        membership: [KIN, OATH]
        ruled_not_counted: conquered Sosso and Soninke lands; enslaved captives
        standing: SOV
        shape: IMPERIAL
        rulers: ONE
        right: [VICTORY, DESCENT]
        flag: >
          The epic grounds Sunjata's right in hunter's occult power (nyama), his mother's buffalo-woman
          lineage and victory at Kirina; the Right axis has no value for occult or ritual power, so
          VICTORY is the nearest fit.
      - year: 1330
        base: AGR
        flow: EXT
        membership: [KIN, FAITH]
        ruled_not_counted: tributary peoples including the gold-producing peoples; enslaved people
        standing: SOV
        shape: IMPERIAL
        rulers: ONE
        right: [DESCENT, DIVINE]
        flag: >
          Double legitimacy. Griots give the Keita a Muslim genealogy from Bilal ibn Rabah while the
          court also presented the mansa as a master of Mande power on the model of the Komo society;
          the court claimed Islam while governing a mostly non-Muslim population it did not try to convert.
    evidence: [src-niane-unesco-mali, src-ly-tall-unesco-mali-decline, src-gomez-african-dominion, src-levtzion-ancient-ghana-mali]
    confidence: high

  - id: pl-sosso
