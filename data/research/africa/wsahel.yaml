    location: {lat: 12.86, lon: -7.56}
    span: {start: 1180, end: 1235, approx: true}
    parent: null
    geometry_note: >
      Core in the Koulikoro hills north of the Niger (Niane), with control over former Ghana provinces
      about 1180-1235. The exact site of the capital Soso is not established; label point at Koulikoro,
      where traditions place Sumaoro's disappearance and a shrine.
    basemap_match: ["Sosso"]
    polity_profile:
      - year: 1220
        base: AGR
        flow: EXT
        membership: [KIN]
        ruled_not_counted: Soninke and Maninka tributaries; captives
        standing: SOV
        shape: IMPERIAL
        rulers: ONE
        right: [VICTORY, DESCENT]
        flag: >
          Tradition calls Sumaoro a sorcerer-king whose power rested on occult objects (the Sosso Bala
          balafon, protective fetters); that ritual basis has no value on the Right axis. Everything known
          comes from later Mande oral tradition, mostly told from Mali's side.
    evidence: [src-niane-unesco-mali, src-conrad-oral-sources-links, src-birmingham-sumanguru-epic]
    confidence: low

