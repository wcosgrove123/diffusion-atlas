      Muslim-ancestor traditions; Sogolon's buffalo-woman descent and hunters' nyama give the other
      legitimacy. HAPP each version: performer, patron, date, place. Label point at Kangaba (Kamabolon).
    image_hint: "Wikimedia Commons search: griot kora Mali"
    evidence: [src-niane-sundiata, src-cisse-kamissoko-grande-geste, src-conrad-sunjata-conde, src-johnson-son-jara, src-conrad-bilali-surakata]
