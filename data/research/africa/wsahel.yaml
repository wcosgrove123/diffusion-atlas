  - id: ex-great-mosque-djenne
    name: Great Mosque of Djenne (1906-07 rebuild on the Kunburu site)
    place: pl-djenne
    location: {lat: 13.905, lon: -4.556}
    span: {start: 1200, end: null, approx: true}
    fabric_date: 1907
    on_slider: false
    lenses: [architecture, religion]
    summary: >
      The world's largest mud-brick building stands where Koi Kunboro is said to have turned his palace
      into a mosque. The present structure was built in 1906-07 by Djenne's masons' guild.
    detail: >
      Span starts with the founding, when Koi Kunboro turned his palace into a mosque (dated anywhere from
      about 1180 to 1330; see df-islam-djenne-court); fabric_date 1907 is the standing building, and
      on_slider is false so the 1907 rebuild does not sit on the 1200-1450 timeline. The medieval mosque
      does not survive. Seku Amadu let the old mosque decay and built a plain one (1834-36); Caillie
      (1828) found it abandoned. The 1907 rebuild was led by Ismaila Traore, head of the barey ton
      (masons' guild), with forced colonial-era labor. Bourgeois argues the design is basically African.
      Toron (palm-wood projections) serve as scaffolding for the annual community replastering. Use it to
      teach continuity of technique, not of the building.
    image_hint: "Wikimedia Commons search: Great Mosque of Djenne"
    evidence: [src-bourgeois-djenne, src-aramco-maas-djenne, src-al-sadi-tarikh-sudan]
    confidence: high

